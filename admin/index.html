<!DOCTYPE html>
<html lang="zh-CN">
<head>
<meta charset="utf-8" />
<meta name="viewport" content="width=device-width, initial-scale=1" />
<title>吨吨 · 管理后台</title>
<style>
  :root {
    --bg: #f5f6f8;
    --card: #ffffff;
    --ink: #1c1c1e;
    --gray: #8e8e93;
    --line: #ececef;
    --accent: #3bb3db;
    --accent-soft: #eaf7fb;
    --danger: #e5484d;
    --gold: #d9a13b;
    --nav: #1f2430;
  }
  * { box-sizing: border-box; }
  body {
    margin: 0;
    font-family: -apple-system, BlinkMacSystemFont, "Segoe UI", "PingFang SC",
      "Microsoft YaHei", sans-serif;
    background: var(--bg);
    color: var(--ink);
  }
  .hidden { display: none !important; }
  button { font-family: inherit; cursor: pointer; }
  input, select {
    font-family: inherit;
    font-size: 13px;
    padding: 8px 10px;
    border: 1px solid var(--line);
    border-radius: 10px;
    background: #fff;
    color: var(--ink);
    outline: none;
    width: 100%;
  }
  input:focus, select:focus { border-color: var(--accent); }

  /* ---------------- 登录 ---------------- */
  .login-wrap {
    min-height: 100vh;
    display: flex;
    align-items: center;
    justify-content: center;
    background: radial-gradient(circle at 30% 20%, #dff2f9, #f5f6f8 60%);
  }
  .login-card {
    width: 380px;
    background: var(--card);
    border-radius: 22px;
    padding: 32px 28px;
    box-shadow: 0 18px 50px rgba(31, 36, 48, 0.10);
  }
  .login-card h1 { margin: 0 0 4px; font-size: 24px; }
  .login-card p.sub { margin: 0 0 22px; color: var(--gray); font-size: 13px; }
  .field { margin-bottom: 12px; }
  .field label {
    display: block;
    font-size: 12px;
    color: var(--gray);
    margin-bottom: 6px;
  }
  .btn {
    border: 0;
    border-radius: 12px;
    padding: 10px 16px;
    font-size: 14px;
    font-weight: 600;
    background: var(--accent);
    color: #fff;
  }
  .btn:disabled { opacity: .6; cursor: default; }
  .btn.ghost { background: #f1f2f5; color: var(--ink); }
  .btn.danger { background: #fdecec; color: var(--danger); }
  .btn.sm { padding: 5px 10px; font-size: 12px; border-radius: 9px; }
  .login-card .btn { width: 100%; margin-top: 8px; }
  .login-err { color: var(--danger); font-size: 12px; min-height: 16px; margin-top: 8px; }

  /* ---------------- 布局 ---------------- */
  #app { display: flex; min-height: 100vh; }
  aside {
    width: 212px;
    background: var(--nav);
    color: #cfd6e4;
    padding: 22px 14px;
    display: flex;
    flex-direction: column;
    position: sticky;
    top: 0;
    height: 100vh;
  }
  .brand { padding: 0 10px 22px; color: #fff; font-weight: 800; font-size: 18px; letter-spacing: .5px; }
  .brand span { color: var(--accent); }
  .brand small { display: block; color: #7d879b; font-size: 11px; font-weight: 400; margin-top: 3px; letter-spacing: 0; }
  .nav-btn {
    display: block;
    width: 100%;
    text-align: left;
    border: 0;
    background: transparent;
    color: #cfd6e4;
    padding: 11px 12px;
    border-radius: 11px;
    font-size: 14px;
    margin-bottom: 4px;
  }
  .nav-btn:hover { background: rgba(255,255,255,.07); }
  .nav-btn.active { background: var(--accent); color: #fff; font-weight: 600; }
  .nav-foot { margin-top: auto; font-size: 12px; color: #7d879b; }
  .nav-foot button {
    border: 0; background: rgba(255,255,255,.08); color: #cfd6e4;
    padding: 8px 12px; border-radius: 10px; width: 100%; margin-bottom: 10px;
  }
  main { flex: 1; padding: 26px 30px 40px; min-width: 0; }
  header.page {
    display: flex; align-items: flex-end; justify-content: space-between;
    margin-bottom: 18px; gap: 16px; flex-wrap: wrap;
  }
  header.page h1 { margin: 0; font-size: 22px; }
  .api-hint { font-size: 12px; color: var(--gray); }
  .toolbar { display: flex; gap: 10px; align-items: center; margin-bottom: 14px; flex-wrap: wrap; }
  .toolbar .grow { flex: 1; }
  .toolbar select, .toolbar input { width: auto; min-width: 130px; }

  .card {
    background: var(--card);
    border-radius: 16px;
    overflow: hidden;
    box-shadow: 0 6px 22px rgba(31,36,48,.05);
  }
  table { width: 100%; border-collapse: collapse; font-size: 13px; }
  th {
    text-align: left; font-size: 12px; font-weight: 600; color: var(--gray);
    padding: 12px 14px; background: #fafafb; border-bottom: 1px solid var(--line);
    white-space: nowrap;
  }
  td { padding: 11px 14px; border-bottom: 1px solid var(--line); vertical-align: middle; }
  tr:last-child td { border-bottom: 0; }
  tr:hover td { background: #fbfdfe; }
  td.mono { font-family: ui-monospace, Consolas, monospace; font-size: 11px; color: var(--gray); }
  .tag {
    display: inline-block; padding: 2px 8px; border-radius: 7px;
    font-size: 11px; font-weight: 600; background: #f1f2f5; color: #6b7280;
  }
  .tag.on { background: var(--accent-soft); color: #1d8dad; }
  .tag.off { background: #f1f2f5; color: #9aa0aa; }
  .tag.gold { background: #fff4dd; color: var(--gold); }
  .tag.paid { background: #e8f7ee; color: #1f9254; }
  .tag.pending { background: #fff4dd; color: #b07d19; }
  .tag.cancelled, .tag.refunded { background: #f1f2f5; color: #8e8e93; }
  .tag.rejected { background: #fdecec; color: var(--danger); }
  .row-actions { display: flex; gap: 6px; }
  /* 用户头像：表格里的圆形缩略图（点击放大） */
  .user-cell { display: flex; align-items: center; gap: 8px; }
  .user-avatar {
    width: 30px; height: 30px; border-radius: 50%; flex: 0 0 auto;
    object-fit: cover; background: #f1f2f5; color: #9aa0aa;
    display: inline-flex; align-items: center; justify-content: center;
    font-size: 13px; font-weight: 600; cursor: zoom-in;
  }
  .avatar-preview { text-align: center; }
  .avatar-preview img { max-width: 260px; max-height: 260px; border-radius: 12px; }
  .empty { padding: 40px; text-align: center; color: var(--gray); font-size: 13px; }
  .pager { display: flex; justify-content: flex-end; gap: 8px; margin-top: 14px; font-size: 12px; color: var(--gray); align-items: center; }
  /* 容器图标库：表格里的图标缩略图（统一剪影色，无底色方块） */
  .icon-thumb {
    display: inline-flex; align-items: center; justify-content: center;
    width: 48px; height: 48px;
  }
  .icon-thumb i { display: block; width: 40px; height: 40px; background: #4a4a4a; }
  .icon-fname {
    font-size: 12px; color: #4b5563;
    font-family: ui-monospace, Consolas, monospace;
  }
  .swatch { display: inline-block; width: 14px; height: 14px; border-radius: 4px; vertical-align: -2px; margin-right: 6px; border: 1px solid rgba(0,0,0,.08); }
  /* 饮品图标：容器剪影 + 液体色填充，与 App 饮品页一致 */
  .icon-tile {
    display: inline-flex; align-items: center; justify-content: center;
    border-radius: 9px; overflow: hidden; vertical-align: middle;
  }
  .icon-tile img { object-fit: contain; }
  /* 饮品图标：去掉承载背景，点击放大查看 */
  .icon-btn { border: 0; background: transparent; padding: 0; display: inline-flex; cursor: zoom-in; }
  /* 容器图标上传卡片：选文件 → 预览 → 确认上传 */
  .cu-pick { display: flex; align-items: center; gap: 12px; margin-bottom: 14px; flex-wrap: wrap; }
  .cu-list { display: flex; flex-direction: column; gap: 10px; max-height: 380px; overflow: auto; }
  .cu-row {
    display: flex; align-items: center; gap: 14px;
    border: 1px solid var(--line); border-radius: 14px; padding: 12px;
  }
  .cu-thumb {
    width: 84px; height: 84px; flex: 0 0 auto; border-radius: 12px; background: #f5f6f8;
    display: flex; align-items: center; justify-content: center;
  }
  .cu-thumb img {
    width: 66px; height: 66px; object-fit: contain;
    filter: drop-shadow(0 0 1px rgba(0,0,0,.4));
  }
  .cu-meta { flex: 1; min-width: 0; }
  .cu-name {
    font-size: 13px; color: #4b5563; word-break: break-all;
    font-family: ui-monospace, Consolas, monospace;
  }
  .cu-sub { font-size: 11px; color: var(--gray); margin-top: 2px; }
  .cu-status { font-size: 12px; margin-top: 5px; }
  .cu-status.ok { color: #1f9254; }
  .cu-status.bad { color: var(--danger); }
  .cu-tags { display: flex; gap: 6px; flex-wrap: wrap; margin-top: 6px; }
  .cu-del {
    border: 0; background: #f1f2f5; color: var(--gray);
    width: 26px; height: 26px; border-radius: 8px; flex: 0 0 auto;
  }

  /* ---------------- 弹窗 ---------------- */
  #modalMask {
    position: fixed; inset: 0; background: rgba(20,24,32,.42);
    display: flex; align-items: center; justify-content: center; padding: 20px; z-index: 40;
  }
  .modal {
    width: 520px; max-width: 100%; max-height: 88vh; overflow: auto; background: #fff;
    border-radius: 20px; padding: 22px 24px;
  }
  .modal h3 { margin: 0 0 16px; font-size: 18px; }
  .form-grid { display: grid; grid-template-columns: 1fr 1fr; gap: 12px; }
  .form-grid .full { grid-column: 1 / -1; }
  .form-grid textarea {
    width: 100%; box-sizing: border-box; font-family: inherit; font-size: 13px;
    padding: 8px 10px; border: 1px solid var(--line); border-radius: 10px;
    background: #fff; color: var(--ink); outline: none; resize: vertical;
  }
  .form-grid textarea:focus { border-color: var(--accent); }
  .form-grid > div > label,
  .bev-hero-meta > div > label {
    display: block; font-size: 12px; color: var(--gray); margin-bottom: 6px;
  }
  .check { display: flex; align-items: center; gap: 8px; font-size: 13px; color: var(--ink); padding-top: 22px; }
  .check input { width: 16px; height: 16px; }
  .modal-foot { display: flex; justify-content: flex-end; gap: 10px; margin-top: 18px; }
  .modal-err { color: var(--danger); font-size: 12px; margin-top: 10px; }
  /* 饮品编辑：参考客户端添加饮品页的分区 + 色板 */
  .modal.wide { width: 880px; }
  /* 只读信息弹窗（如用户打卡明细） */
  .modal.mid { width: 720px; max-width: 100%; }
  /* 打卡数据：按天卡片（总计 KPI + 日期切换 + 当日指标/明细） */
  .day-card {
    border: 1px solid var(--line); border-radius: 16px;
    padding: 14px 16px; background: #fff; margin-bottom: 12px;
  }
  .day-head {
    display: flex; align-items: center; justify-content: space-between;
    gap: 12px; flex-wrap: wrap;
  }
  .day-title { font-size: 14px; font-weight: 600; }
  .day-sub { font-size: 12px; color: var(--gray); margin-top: 4px; }
  .day-nav { display: flex; align-items: center; gap: 8px; }
  .day-nav button {
    width: 30px; height: 30px; flex: none; padding: 0;
    border: 1px solid var(--line); border-radius: 9px;
    background: #fff; color: var(--ink); font-size: 15px; line-height: 1;
  }
  .day-nav button:disabled { opacity: .38; cursor: default; }
  .day-nav select { width: auto; min-width: 138px; }
  .metric-grid {
    display: grid; grid-template-columns: repeat(4, minmax(0, 1fr));
    gap: 10px; margin-top: 14px;
  }
  .metric { background: #f7f9fb; border-radius: 12px; padding: 10px 12px; min-width: 0; }
  .metric-label {
    font-size: 12px; color: var(--gray);
    white-space: nowrap; overflow: hidden; text-overflow: ellipsis;
  }
  .metric-value {
    font-size: 18px; font-weight: 700; margin-top: 6px; line-height: 1.15;
    white-space: nowrap; overflow: hidden; text-overflow: ellipsis;
  }
  .metric-value em { font-style: normal; font-size: 12px; font-weight: 600; color: var(--gray); margin-left: 2px; }
  .day-detail { margin-top: 14px; border-top: 1px solid var(--line); padding-top: 12px; }
  .day-detail .card { box-shadow: none; border: 1px solid var(--line); }
  .day-detail th { padding: 8px 10px; }
  .day-detail td { padding: 8px 10px; font-size: 12px; }
  .bev-hero {
    display: flex; gap: 18px; align-items: center;
    background: #f7f9fb; border-radius: 16px; padding: 14px 16px; margin-bottom: 14px;
  }
  .bev-hero-preview {
    width: 108px; height: 108px; flex: none;
    display: flex; align-items: center; justify-content: center;
  }
  .bev-hero-meta { flex: 1; min-width: 0; display: grid; gap: 10px; }
  .bev-section {
    border-top: 1px solid var(--line); padding: 12px 0 0; margin-top: 4px;
  }
  .bev-section h4 { margin: 0 0 8px; font-size: 13px; color: var(--gray); font-weight: 600; }
  /* 两列排布：把弹窗高度压到一屏内，不用上下滚动 */
  .bev-cols {
    display: grid; grid-template-columns: 1fr 1fr; gap: 0 22px;
    border-top: 1px solid var(--line); padding-top: 12px; margin-top: 4px;
  }
  .bev-cols .bev-section { border-top: 0; padding-top: 0; }
  .bev-cols > div { min-width: 0; }
  .palette-grid { display: grid; grid-template-columns: repeat(5, 40px); gap: 10px 14px; align-items: center; }
  .pdot {
    width: 38px; height: 38px; border-radius: 50%; padding: 3px; cursor: pointer;
    border: 2.5px solid transparent; box-sizing: border-box;
  }
  .pdot.selected { border-color: #1c1c1e; }
  .pdot > span {
    display: flex; align-items: center; justify-content: center;
    width: 100%; height: 100%; border-radius: 50%; color: #fff; font-size: 16px;
  }
  .palette-custom { display: flex; gap: 10px; align-items: center; }
  .palette-custom input[type="color"] { width: 44px; height: 32px; padding: 2px; flex: none; }
  .palette-custom #f_color { width: 120px; flex: none; font-family: ui-monospace, Consolas, monospace; }
  .color-label { font-size: 12px; color: var(--gray); white-space: nowrap; }

  .char-thumb { cursor: zoom-in; transition: box-shadow .15s; }
  .char-thumb:hover { box-shadow: 0 0 0 2px var(--accent), 0 4px 12px rgba(31,36,48,.18); }
  .char-preview {
    display: flex; align-items: center; justify-content: center;
    background: #f7f9fb; border-radius: 16px; padding: 18px; min-height: 260px;
  }
  .char-preview img { max-width: 100%; max-height: 52vh; object-fit: contain; }
  .nutri-line { font-size: 11px; color: var(--gray); line-height: 1.55; white-space: nowrap; }
  .nutri-line strong { color: #4b5563; font-weight: 600; }

  .benefit-grid { display: grid; grid-template-columns: 1fr 1fr; gap: 8px; }
  .bcheck {
    display: flex; align-items: center; gap: 8px; font-size: 12px;
    padding: 8px 10px; border: 1px solid var(--line); border-radius: 10px;
    background: #fafbfc; cursor: pointer;
  }
  .bcheck input { width: 14px; height: 14px; padding: 0; flex: none; accent-color: var(--accent); }
  .bcheck span { min-width: 0; overflow: hidden; text-overflow: ellipsis; white-space: nowrap; }
  .bcheck:has(input:checked) { border-color: var(--accent); background: var(--accent-soft); }

  /* ---------------- 数据看板 ---------------- */
  .kpi-grid {
    display: grid; grid-template-columns: repeat(4, minmax(0, 1fr));
    gap: 16px; margin-bottom: 18px;
  }
  .kpi {
    background: var(--card); border-radius: 16px; padding: 15px 16px 14px;
    box-shadow: 0 6px 22px rgba(31,36,48,.05); min-width: 0;
  }
  .kpi-label { font-size: 12px; color: var(--gray); white-space: nowrap; }
  .kpi-value {
    font-size: 25px; font-weight: 700; letter-spacing: -.6px;
    margin-top: 8px; line-height: 1.1;
  }
  .kpi-value em { font-style: normal; font-size: 13px; font-weight: 600; color: var(--gray); margin-left: 3px; }
  .kpi-sub { font-size: 12px; color: var(--gray); margin-top: 8px; }
  .kpi-sub b { color: #1d8dad; font-weight: 600; }
  .chart-grid { display: grid; grid-template-columns: repeat(2, minmax(0, 1fr)); gap: 16px; margin-bottom: 16px; }
  .chart-card {
    background: var(--card); border-radius: 16px; padding: 16px 18px 8px;
    box-shadow: 0 6px 22px rgba(31,36,48,.05); min-width: 0;
  }
  .chart-head {
    display: flex; align-items: baseline; justify-content: space-between;
    gap: 10px; flex-wrap: wrap; margin-bottom: 4px;
  }
  .chart-head h3 { margin: 0; font-size: 14px; }
  .chart-head .legend { display: flex; gap: 14px; font-size: 12px; color: var(--gray); }
  .legend i {
    display: inline-block; width: 8px; height: 8px; border-radius: 3px;
    margin-right: 5px; vertical-align: 1px;
  }
  .chart-svg { display: block; width: 100%; height: auto; }
  .stat-list { display: grid; gap: 14px; margin: 18px 0 10px; }
  .stat-row {
    display: grid; grid-template-columns: 58px 1fr auto;
    gap: 12px; align-items: center; font-size: 12px;
  }
  .stat-row .stat-name { color: #4b5563; }
  .stat-row .stat-num { text-align: right; color: var(--gray); white-space: nowrap; }
  .stat-bar { height: 8px; border-radius: 5px; background: #f1f2f5; overflow: hidden; }
  .stat-bar > span { display: block; height: 100%; border-radius: 5px; }
  .dash-note { font-size: 12px; color: var(--gray); line-height: 1.7; }
  /* 会员转化漏斗 */
  .funnel { display: grid; gap: 10px; }
  .funnel-step {
    display: grid; grid-template-columns: 88px 1fr 90px 58px;
    align-items: center; gap: 12px; font-size: 13px;
  }
  .funnel-step .funnel-label { color: #4b5563; white-space: nowrap; }
  .funnel-track { height: 22px; border-radius: 7px; background: #f1f2f5; overflow: hidden; }
  .funnel-track > span {
    display: block; height: 100%; border-radius: 7px;
    background: linear-gradient(90deg, #3bb3db, #6ccbe6);
    min-width: 2px; transition: width .2s;
  }
  .funnel-step .funnel-num { text-align: right; color: var(--ink); font-weight: 600; }
  .funnel-step .funnel-rate { text-align: right; color: var(--gray); font-size: 12px; }
  .funnel-extra { margin-top: 12px; font-size: 12px; color: var(--gray); }
  .funnel-extra b { color: #1d8dad; font-weight: 600; }
  @media (max-width: 1080px) { .chart-grid { grid-template-columns: 1fr; } }

  /* 卡片内滚动时隐藏滚动条（内容超出仍可滚动） */
  .modal, .icon-pick-grid { scrollbar-width: none; -ms-overflow-style: none; }
  .modal::-webkit-scrollbar,
  .icon-pick-grid::-webkit-scrollbar { width: 0; height: 0; display: none; }

  /* 容器图标选择：独立小卡片浮在编辑弹窗之上，不撑大主弹窗 */
  #pickerMask {
    position: fixed; inset: 0; background: rgba(20,24,32,.30);
    display: flex; align-items: center; justify-content: center; padding: 24px; z-index: 50;
  }
  .modal.picker { width: 560px; max-height: 74vh; padding: 20px 22px; }
  .icon-pick-grid {
    display: grid; grid-template-columns: repeat(auto-fill, minmax(56px, 1fr));
    gap: 10px; max-height: 46vh; overflow: auto;
    padding: 12px; background: #f7f8fa; border-radius: 12px;
  }
  .icon-pick {
    height: 56px; padding: 5px; border: 2px solid transparent; border-radius: 10px;
    background: #fff; display: flex; align-items: center; justify-content: center;
  }
  .icon-pick.selected { border-color: var(--accent); }
  .icon-pick .pick-sil { display: block; width: 36px; height: 36px; background: #4a4a4a; }

  #toast {
    position: fixed; left: 50%; bottom: 30px; transform: translateX(-50%) translateY(20px);
    background: rgba(28,28,30,.92); color: #fff; padding: 10px 18px; border-radius: 12px;
    font-size: 13px; opacity: 0; pointer-events: none; transition: all .22s; z-index: 60;
  }
  #toast.show { opacity: 1; transform: translateX(-50%) translateY(0); }

  /* ============================================================
     视觉升级层：柔和浅蓝底 + 白色浮层卡片 + 圆角胶囊控件
     参考三张 SaaS 后台：左侧留白导航、大圆角面板、轻阴影、青蓝点缀
     ============================================================ */
  :root {
    --bg: #edf4fb;
    --card: #ffffff;
    --ink: #17293d;
    --gray: #7a8ca3;
    --line: #e6eef6;
    --accent: #35afd9;
    --accent-2: #5ac8fa;
    --accent-deep: #0e7c9e;
    --accent-soft: #eaf7fc;
    --danger: #e5484d;
    --gold: #c9942e;
    --nav: #ffffff;
    --ring: 0 0 0 4px rgba(53, 175, 217, .14);
    --shadow-lg: 0 22px 50px rgba(28, 73, 112, .12);
    --shadow-md: 0 12px 30px rgba(28, 73, 112, .09);
    --shadow-sm: 0 6px 16px rgba(28, 73, 112, .08);
  }
  html { -webkit-font-smoothing: antialiased; scrollbar-gutter: stable; }
  body {
    background:
      radial-gradient(1100px 620px at 6% -10%, rgba(120, 205, 241, .30), transparent 62%),
      radial-gradient(900px 540px at 94% 2%, rgba(163, 186, 255, .26), transparent 64%),
      linear-gradient(165deg, #f3f9fd 0%, #edf3fa 46%, #f7fbfe 100%);
    background-attachment: fixed;
    letter-spacing: .1px;
  }
  body::before {
    content: "";
    position: fixed; inset: 0; z-index: 0; pointer-events: none;
    background-image: radial-gradient(rgba(116, 158, 190, .10) 1px, transparent 1px);
    background-size: 24px 24px;
  }
  #app, .login-wrap { position: relative; z-index: 1; }
  ::-webkit-scrollbar { width: 8px; height: 8px; }
  ::-webkit-scrollbar-thumb { background: #cfdfec; border-radius: 8px; }
  ::-webkit-scrollbar-track { background: transparent; }

  /* ---------- 基础控件 ---------- */
  input, select, textarea {

  input:focus, select:focus, textarea:focus {

  .btn {
    border-radius: 12px;
    padding: 10px 18px;
    font-weight: 600;
    letter-spacing: .2px;

  .btn:hover { transform: translateY(-1px); box-shadow: 0 12px 24px rgba(53, 175, 217, .32); }
  .btn:active { transform: translateY(0); box-shadow: 0 6px 14px rgba(53, 175, 217, .22); }
  .btn.ghost {
    background: #fff;
    color: #3d5468;
    border: 1px solid var(--line);
    box-shadow: var(--shadow-sm);
  }
  .btn.ghost:hover { border-color: #cfe6f2; color: var(--accent-deep); box-shadow: var(--shadow-md); }
  .btn.danger { background: #fff0f0; color: var(--danger); box-shadow: none; border: 1px solid #f8d6d7; }
  .btn.danger:hover { background: #ffe7e8; box-shadow: var(--shadow-sm); }
  .btn.sm { border-radius: 10px; padding: 6px 12px; }

  /* ---------- 登录 ---------- */
  .login-wrap {
    background: transparent;
    padding: 24px;
  }
  .login-card {
    width: 420px;
    max-width: calc(100vw - 32px);
    border-radius: 28px;
    padding: 36px 32px 30px;
    background: rgba(255, 255, 255, .92);
    border: 1px solid rgba(255, 255, 255, .9);
    box-shadow: var(--shadow-lg);
    backdrop-filter: blur(16px);
  }
  .login-card::before {
    content: "吨";

    color: #fff; font-size: 23px; font-weight: 800;
    background: linear-gradient(140deg, #41b9e2, #73d2f7 60%, #9be4ff);
    box-shadow: 0 12px 24px rgba(65, 185, 226, .35);
  }
  .login-card h1 { font-size: 25px; letter-spacing: -.4px; }
  .login-card p.sub { color: var(--gray); line-height: 1.7; }
  .login-card .btn { border-radius: 14px; padding: 12px 18px; margin-top: 12px; }
  .login-err { padding-left: 2px; }

  /* ---------- 应用外壳 ---------- */
  #app {

  aside {

    flex: 0 0 234px;
    top: 18px;
    height: calc(100vh - 36px);
    padding: 20px 14px 14px;
    border-radius: 26px;
    color: var(--ink);
    background: linear-gradient(180deg, rgba(255, 255, 255, .94), rgba(255, 255, 255, .76));
    border: 1px solid rgba(255, 255, 255, .95);
    box-shadow: var(--shadow-md);
    backdrop-filter: blur(18px);
    overflow: auto;
    scrollbar-width: none;
  }
  aside::-webkit-scrollbar { width: 0; display: none; }
  .brand {
    display: flex; align-items: center; gap: 12px;
    padding: 2px 8px 20px;
    color: var(--ink);
  }
  .brand-mark {

    border-radius: 14px;
    background: linear-gradient(140deg, #41b9e2, #7cd7f8);
    color: #fff;
    display: flex; align-items: center; justify-content: center;
    box-shadow: 0 10px 20px rgba(65, 185, 226, .32);
  }
  .brand-mark svg { width: 24px; height: 24px; }
  .brand-text b { display: block; font-size: 19px; font-weight: 800; letter-spacing: .3px; line-height: 1.1; }
  .brand-text b span { color: var(--accent); }
  .brand-text small {
    display: block; margin-top: 3px; padding: 0;
    color: #93a5b9; font-size: 10.5px; font-weight: 500;
    letter-spacing: .6px; text-transform: uppercase;
  }
  .nav-list { display: flex; flex-direction: column; }
  .nav-label {
    font-size: 10.5px; font-weight: 600; letter-spacing: 1.4px;
    color: #a9b8c9; padding: 0 12px; margin: 14px 0 6px;
  }
  .nav-label:first-child { margin-top: 2px; }
  .nav-btn {
    display: flex; align-items: center; gap: 10px;
    width: 100%; margin-bottom: 3px;
    padding: 10px 12px;
    border-radius: 13px;
    border: 1px solid transparent;
    background: transparent;
    color: #5b7086;
    font-size: 13.5px; font-weight: 500;
    transition: background .15s, color .15s, box-shadow .15s, transform .15s;
  }
  .nav-btn .nav-ico {
    width: 18px; height: 18px; flex: none;
    fill: none; stroke: currentColor; stroke-width: 1.7;
    stroke-linecap: round; stroke-linejoin: round; opacity: .92;
  }
  .nav-btn:hover { background: rgba(53, 175, 217, .08); color: var(--accent-deep); transform: translateX(1px); }
  .nav-btn.active {
    background: #fff;
    color: var(--accent-deep);
    font-weight: 600;
    border-color: rgba(53, 175, 217, .16);
    box-shadow: 0 8px 18px rgba(46, 127, 164, .14);
  }
  .nav-btn.active .nav-ico { opacity: 1; }
  .nav-foot {
    margin-top: auto; padding: 10px;
    border-radius: 18px;
    background: linear-gradient(180deg, #f7fbff, #eef7fd);
    border: 1px solid #e7f1f9;
  }
  .nav-user { display: flex; align-items: center; gap: 10px; min-width: 0; }
  .nav-avatar {
    width: 34px; height: 34px; flex: none; border-radius: 50%;
    display: flex; align-items: center; justify-content: center;
    font-size: 13px; font-weight: 700; color: #fff;
    background: linear-gradient(140deg, #57c4ea, #8fd9ff);
    box-shadow: 0 6px 14px rgba(57, 160, 200, .28);
  }
  .nav-user-meta { min-width: 0; }
  .nav-user-meta #whoami {
    margin: 0 0 2px; font-size: 11.5px; font-weight: 600; color: #334c62;
    word-break: break-all; line-height: 1.3;
  }
  .nav-user-meta span { font-size: 10.5px; color: #94a6b9; }
  .nav-actions { display: grid; grid-template-columns: 1fr 1fr; gap: 6px; margin-top: 9px; }
  .nav-ghost {
    border: 1px solid #dfeaf4; background: #fff; color: #5a7086;
    padding: 7px 6px; border-radius: 9px;
    font-size: 11px; font-weight: 600;
    transition: color .15s, border-color .15s, box-shadow .15s;
  }
  .nav-ghost:hover { color: var(--accent-deep); border-color: #bfe1ef; box-shadow: var(--shadow-sm); }

  main {
    padding: 26px 30px 38px;
    border-radius: 28px;
    background: rgba(255, 255, 255, .60);
    border: 1px solid rgba(255, 255, 255, .92);
    box-shadow: var(--shadow-md);
    backdrop-filter: blur(14px);
    min-height: calc(100vh - 36px);
    /* 表格再宽也不撑大主面板，避免切换页面时整页宽度跳变 */
    min-width: 0;
  }
  header.page { align-items: center; margin-bottom: 20px; }
  .page-heading h1 {
    margin: 0; font-size: 26px; font-weight: 800;
    letter-spacing: -.5px; color: #152a41;
  }
  .page-sub {
    margin-top: 6px; font-size: 12.5px; color: var(--gray); letter-spacing: .2px;
  }
  /* 提示文字：纯文本样式，不做胶囊容器，避免被误认为可点击按钮 */
  .api-hint {
    font-size: 12px; line-height: 1.7;
    color: #8397ab; max-width: 100%;
  }
  .toolbar { gap: 10px; margin-bottom: 16px; flex-wrap: wrap; }
  .toolbar select, .toolbar input { border-radius: 12px; }

  /* ---------- 自定义下拉框（统一原生 select 在各平台的样式差异） ---------- */
  .dd { position: relative; width: 100%; min-width: 0; }
  .toolbar .dd, .day-nav .dd { width: auto; min-width: 138px; max-width: 280px; }
  .dd-native {
    position: absolute; width: 1px; height: 1px; margin: 0;
    opacity: 0; pointer-events: none; border: 0;
  }
  .dd-btn {
    width: 100%; display: flex; align-items: center; justify-content: space-between; gap: 10px;
    padding: 9px 12px; min-height: 38px;
    border-radius: 12px; border: 1px solid var(--line); background: #fbfdff;
    color: var(--ink); font-size: 13px; text-align: left;
    transition: border-color .15s, box-shadow .15s, background .15s;
  }
  .dd-btn:hover { background: #fff; border-color: #cfe6f2; }
  .dd.open .dd-btn {
    background: #fff; border-color: var(--accent); box-shadow: var(--ring);
  }
  .dd-btn:disabled { opacity: .6; cursor: default; }
  .dd-label {
    flex: 1; min-width: 0;
    overflow: hidden; text-overflow: ellipsis; white-space: nowrap;
  }
  .dd-caret {
    width: 15px; height: 15px; flex: none;
    fill: none; stroke: #8ea3b8; stroke-width: 2;
    stroke-linecap: round; stroke-linejoin: round;
    transition: transform .18s, stroke .18s;
  }
  .dd.open .dd-caret { transform: rotate(180deg); stroke: var(--accent-deep); }
  /* 选项面板挂到 body 上，避免被弹窗 / 卡片的滚动区域裁切 */
  .dd-menu {
    position: fixed; z-index: 80;
    padding: 6px; border-radius: 14px;
    background: rgba(255, 255, 255, .99);
    border: 1px solid #e3eef7;
    box-shadow: 0 18px 44px rgba(18, 55, 88, .18);
    overflow: auto; overscroll-behavior: contain;
    animation: ddIn .14s ease-out;
  }
  @keyframes ddIn {
    from { opacity: 0; transform: translateY(-4px) scale(.985); }
    to { opacity: 1; transform: none; }
  }
  .dd-opt {
    display: block; width: 100%; text-align: left;
    border: 0; background: transparent; color: #33475c;
    padding: 8px 10px; border-radius: 10px; font-size: 13px;
    transition: background .12s, color .12s;
  }
  .dd-opt:hover { background: #f1f9fd; color: var(--accent-deep); }
  .dd-opt.selected { background: #e9f7fd; color: var(--accent-deep); font-weight: 600; }

  /* ---------- 卡片与表格 ---------- */
  .card {
    border-radius: 22px;
    background: rgba(255, 255, 255, .92);
    border: 1px solid rgba(228, 239, 248, .95);
    box-shadow: var(--shadow-md);
    /* 宽表格在卡片内部横向滚动，不撑破整页布局 */
    overflow-x: auto;
  }
  table { font-size: 13px; }
  th {
    padding: 13px 18px;
    background: #f6fafd;
    color: #8a9cb1;
    font-size: 11.5px; font-weight: 600; letter-spacing: .4px;
    border-bottom: 1px solid #edf3f9;
  }
  td {
    padding: 13px 18px;
    border-bottom: 1px solid #f1f6fa;
    color: #2b4056;
  }
  tr:hover td { background: #f8fcfe; }
  .empty { color: #93a4b7; }
  .tag {
    display: inline-flex; align-items: center;
    padding: 3px 10px; border-radius: 999px;
    font-size: 11px; font-weight: 600; letter-spacing: .2px;
  }
  .tag.on { background: #e7f8fd; color: #0c7f9f; }
  .tag.off { background: #f2f5f9; color: #8d9cae; }
  .tag.gold { background: #fdf3dd; color: #b9821e; }
  .tag.paid { background: #e8f8ee; color: #1c9257; }
  .tag.pending { background: #fff4dd; color: #b07d19; }
  .tag.cancelled, .tag.refunded { background: #f2f5f9; color: #8d9cae; }
  .tag.rejected { background: #ffeded; color: #d94a4f; }
  .row-actions { gap: 7px; }
  .pager { margin-top: 16px; }
  .user-avatar { background: #eef6fc; color: #6e8ba3; }
  .swatch { border-radius: 5px; }
  .icon-fname { color: #5b6f84; }
  .cu-row {
    border-radius: 16px; border: 1px solid #e9f1f8;
    background: #fbfdff;
    transition: box-shadow .15s, border-color .15s, transform .15s;
  }
  .cu-row:hover { border-color: #d3e8f3; box-shadow: var(--shadow-sm); transform: translateY(-1px); }
  .cu-thumb { background: #f2f8fc; border-radius: 14px; }
  .cu-del { border-radius: 9px; background: #f4f7fa; }

  /* ---------- 弹窗 ---------- */
  #modalMask, #pickerMask {
    background: rgba(16, 36, 58, .34);
    backdrop-filter: blur(6px) saturate(115%);

  }
  @keyframes maskIn { from { opacity: 0; } to { opacity: 1; } }
  .modal {
    border-radius: 26px;
    padding: 24px 26px 20px;
    background: linear-gradient(180deg, #ffffff, #fdfefe 55%, #fbfdff);
    border: 1px solid rgba(255, 255, 255, .95);
    box-shadow: 0 32px 76px rgba(14, 44, 74, .24), inset 0 1px 0 rgba(255, 255, 255, .9);
    animation: modalIn .2s cubic-bezier(.2, .8, .3, 1);
  }
  @keyframes modalIn {
    from { opacity: 0; transform: translateY(10px) scale(.975); }
    to { opacity: 1; transform: none; }
  }
  .modal h3 {
    display: flex; align-items: center; gap: 10px;
    margin: 0 0 18px; padding-bottom: 16px;
    font-size: 19px; font-weight: 800; letter-spacing: -.3px; color: #17293d;
    border-bottom: 1px solid #edf4fa;

  .modal h3::before {
    content: ""; flex: none;

    background: linear-gradient(180deg, #41b9e2, #7cd7f8);
  }
  .modal-foot {
    position: sticky; bottom: 0;
    margin: 24px -26px -20px;
    padding: 14px 26px 18px;

    backdrop-filter: blur(8px);

  }
  .form-grid > div > label { color: #63798f; letter-spacing: .2px; }
  .modal.picker { border-radius: 22px; }
  .icon-pick-grid { background: #f3f8fc; border-radius: 16px; }
  .icon-pick { background: #fff; border-radius: 12px; }
  .icon-pick.selected { border-color: var(--accent); box-shadow: var(--ring); }
  .form-grid textarea { border-radius: 12px; background: #fbfdff; }

    border-radius: 12px; background: #fbfdff; border-color: #e9f1f8;
  }

  .day-card {
    border-radius: 20px; border-color: #e8f1f8;
    background: linear-gradient(180deg, #ffffff, #fbfdff);
    box-shadow: var(--shadow-sm);
  }
  .day-nav button { border-radius: 10px; background: #fff; }
  .metric {
    border-radius: 14px;

  .pdot.selected { border-color: var(--accent-deep); }
  .char-preview {

    border-radius: 18px;
  }
  .char-thumb:hover { box-shadow: 0 0 0 2px var(--accent), 0 8px 20px rgba(31, 100, 140, .18); }
  .nutri-line { color: #8a9cb1; }

  /* ---------- 数据看板 ---------- */
  .kpi {
    position: relative; overflow: hidden;
    border-radius: 22px;
    padding: 18px 18px 16px;
    background: linear-gradient(160deg, #ffffff 0%, #f6fbff 100%);
    border: 1px solid #e7f1f9;
    box-shadow: var(--shadow-md);
  }
  .kpi::after {
    content: "";
    position: absolute; right: -26px; top: -26px;
    width: 96px; height: 96px; border-radius: 50%;
    background: radial-gradient(circle at 32% 32%, rgba(92, 200, 250, .30), transparent 68%);
    pointer-events: none;
  }
  .kpi:nth-child(4n+2)::after { background: radial-gradient(circle at 32% 32%, rgba(144, 161, 255, .26), transparent 68%); }
  .kpi:nth-child(4n+3)::after { background: radial-gradient(circle at 32% 32%, rgba(108, 220, 196, .26), transparent 68%); }
  .kpi:nth-child(4n+4)::after { background: radial-gradient(circle at 32% 32%, rgba(255, 198, 120, .24), transparent 68%); }
  .kpi-label { font-size: 11.5px; color: #8699ae; letter-spacing: .3px; }
  .kpi-value { font-size: 28px; font-weight: 800; color: #14293f; letter-spacing: -1px; }
  .kpi-value em { color: #90a1b4; font-weight: 600; }
  .kpi-sub { color: #93a4b7; }
  .kpi-sub b { color: var(--accent-deep); }
  .chart-card {
    border-radius: 22px;
    padding: 18px 20px 12px;
    background: rgba(255, 255, 255, .94);
    border: 1px solid #e7f1f9;
    box-shadow: var(--shadow-md);
    min-width: 0;
  }
  .chart-head h3 { font-size: 14.5px; font-weight: 700; color: #22384e; }
  .chart-head .legend { color: #94a6b9; }
  .chart-svg { display: block; width: 100%; height: auto; }
  .stat-bar { background: #eff5fa; border-radius: 999px; height: 7px; }
  .stat-bar > span { border-radius: 999px; }
  .funnel-track { background: #eff5fa; border-radius: 9px; height: 20px; }
  .funnel-track > span { background: linear-gradient(90deg, #3cb2dc, #7ad1f6 60%, #a7b9ff); border-radius: 9px; }
  .funnel-extra b { color: var(--accent-deep); }
  .dash-note { color: #8fa1b5; }

  #toast {
    background: rgba(19, 38, 58, .94);
    border: 1px solid rgba(255, 255, 255, .10);
    box-shadow: 0 16px 40px rgba(12, 32, 52, .30);
    padding: 11px 20px; border-radius: 999px;
  }

  @media (max-width: 1500px) {
    .chart-grid { grid-template-columns: 1fr; }
  }
  @media (max-width: 1024px) {
    #app { padding: 12px; gap: 12px; }
    aside { width: 206px; flex-basis: 206px; top: 12px; height: calc(100vh - 24px); }
    main { padding: 20px 18px 30px; border-radius: 22px; }
    .metric-grid { grid-template-columns: repeat(2, minmax(0, 1fr)); }
    .kpi-grid { grid-template-columns: repeat(2, minmax(0, 1fr)); }
  }
</style>

<script>
(function () {
  "use strict";

  var LS_API = "wl_admin_api";
  var LS_TOKEN = "wl_admin_token";
  var LS_USER = "wl_admin_user";
  var LS_EMAIL = "wl_admin_email";

  var state = {
    token: localStorage.getItem(LS_TOKEN) || "",
    api: localStorage.getItem(LS_API) ||
      (location.protocol.indexOf("http") === 0
        ? location.origin + "/api/v1"
        : "http://localhost:3000/api/v1"),
    tab: "dashboard",
    page: 1,
    pageSize: 20,
    statDays: 30,
    orderStatus: "",
    orderUser: "",
    userQuery: "",
    charCategory: "",
    charCategories: [],
    benefitDict: [],
    beverageCategory: "",
    beverageAll: [],
    rows: [],
  };

  var $ = function (id) { return document.getElementById(id); };
  var esc = function (v) {
    return String(v == null ? "" : v)
      .replace(/&/g, "&amp;").replace(/</g, "&lt;")
      .replace(/>/g, "&gt;").replace(/"/g, "&quot;");
  };

  // 服务端时间统一按 UTC 存储（ISO Z 结尾）。后台统一换算成北京时间
  // （UTC+8）展示，否则与手机端本地时间相差 8 小时（会员订单创建/支付时间
  // 尤其明显）。withTime 默认 true：YYYY-MM-DD HH:mm
  var fmtTime = function (v, withTime) {
    if (!v) return "-";
    var s = String(v);
    var ms = Date.parse(/Z$|[+\-]\d{2}:\d{2}$/.test(s) ? s : s + "Z");
    if (isNaN(ms)) return s;
    var d = new Date(ms + 8 * 3600 * 1000);
    var p = function (n) { return String(n).padStart(2, "0"); };
    var day = d.getUTCFullYear() + "-" + p(d.getUTCMonth() + 1) + "-" + p(d.getUTCDate());
    return withTime === false
      ? day
      : day + " " + p(d.getUTCHours()) + ":" + p(d.getUTCMinutes());
  };

  function toast(msg) {
    var el = $("toast");
    el.textContent = msg;
    el.classList.add("show");
    clearTimeout(el._t);
    el._t = setTimeout(function () { el.classList.remove("show"); }, 2200);
  }

  async function api(path, opts) {
    opts = opts || {};
    var headers = { "Content-Type": "application/json" };
    if (state.token) headers["Authorization"] = "Bearer " + state.token;
    var res;
    try {
      res = await fetch(state.api + path, Object.assign({}, opts, { headers: headers }));
    } catch (e) {
      throw new Error("无法连接后端：" + state.api);
    }
    var text = await res.text();
    var data = null;
    try { data = text ? JSON.parse(text) : null; } catch (_) { data = text; }
    if (res.status === 401) {
      var em = (data && data.error && data.error.message) || "";
      if (state.token) {
        logout();
        throw new Error("登录已过期，请重新登录");
      }
      throw new Error(em || "邮箱或密码错误");
    }
    if (!res.ok) {
      var msg = (data && data.error && data.error.message) || ("HTTP " + res.status);
      if (Array.isArray(msg)) msg = msg.join("; ");
      throw new Error(msg);
    }
    return data;
  }

  /* ---------------- 素材地址与上传 ---------------- */
  // 后端 API 前缀是 /api/v1，静态素材挂在根路径 /static/*，这里换算出资源根地址
  function assetOrigin() {
    return state.api.replace(/\/api\/v\d+\/?$/i, "");
  }

  function assetUrl(u) {
    if (!u) return "";
    if (/^https?:\/\//i.test(u)) return u;
    return assetOrigin() + (u.charAt(0) === "/" ? u : "/" + u);
  }

  /// SVG 预检（服务端还会再做权威校验，这里只为即时给出明确报错）
  /// 返回错误文案，通过则返回 null
  async function validateSvgFile(file, opts) {
    var o = opts || {};
    var label = o.label || "图标";
    var maxBytes = o.maxBytes || 64 * 1024;
    var maxPaths = o.maxPaths || 120;
    var maxNodes = o.maxNodes || 400;
    var requireSquare = o.requireSquare !== false;
    if (file.size > maxBytes) {
      return label + "文件不能超过 " + Math.round(maxBytes / 1024) + "KB";
    }
    var text = await file.text();
    var lower = text.toLowerCase();
    if (!lower.trim()) return label + "内容为空";
    var denies = [
      ["<!entity", "不允许实体声明"],
      ["<script", "不允许 script 标签"],
      ["<foreignobject", "不允许 foreignObject"],
      ["<image", "不允许位图或外链图片"],
      ["<animate", "不允许动画标签"],
      ["<filter", "不允许滤镜标签"],
      ["@import", "不允许 CSS @import"]
    ];
    for (var i = 0; i < denies.length; i++) {
      if (lower.indexOf(denies[i][0]) >= 0) return denies[i][1];
    }
    if (/\son(?:load|click|error|mouseover|focus|begin|end)\s*=/.test(lower)) {
      return "不允许事件属性";
    }
    var hrefRe = /href\s*=\s*["']([^"']*)["']/g, hm;
    while ((hm = hrefRe.exec(lower))) {
      if (hm[1].charAt(0) !== "#") return "不允许引用外部资源";
    }
    if (/url\s*\(\s*["']?(?:http:|https:|\/\/|data:)/.test(lower)) {
      return "不允许引用外部资源";
    }
    var doc = null;
    try { doc = new DOMParser().parseFromString(text, "image/svg+xml"); } catch (_) {}
    if (!doc || doc.getElementsByTagName("parsererror").length ||
        (doc.documentElement && doc.documentElement.nodeName.toLowerCase() !== "svg")) {
      return "不是合法的 SVG 文件";
    }
    var root = doc.documentElement;
    var vb = root.getAttribute("viewBox");
    var w = Number(root.getAttribute("width") || 0);
    var h = Number(root.getAttribute("height") || 0);
    var nums = vb ? vb.trim().split(/[\s,]+/).map(Number)
                  : (w > 0 && h > 0 ? [0, 0, w, h] : null);
    if (!nums || nums.length !== 4 || nums.some(function (n) { return !isFinite(n); })) {
      return '缺少有效 viewBox（建议 viewBox="0 0 100 100"）';
    }
    var vbw = nums[2], vbh = nums[3];
    if (vbw <= 0 || vbh <= 0 || vbw > 4096 || vbh > 4096) {
      return "viewBox 尺寸不合法（宽高 1–4096）";
    }
    var ratio = vbw / vbh;
    if (requireSquare) {
      if (ratio < 0.8 || ratio > 1.25) {
        return "容器图标需要近似正方形画布（宽高比 0.8–1.25）";
      }
    } else if (ratio < 0.2 || ratio > 5) {
      return "画布宽高比需在 0.2–5 之间";
    }
    if (doc.getElementsByTagName("path").length > maxPaths) {
      return "路径数量过多（最多 " + maxPaths + " 条）";
    }
    if (doc.getElementsByTagName("*").length > maxNodes) {
      return "SVG 元素过多（最多 " + maxNodes + " 个）";
    }
    return null;
  }

  /// 容器图标预检：额外要求规范文件名
  async function validateContainerSvgFile(file) {
    var name = String(file.name || "");
    if (!/^[a-z0-9][a-z0-9_-]{0,31}\.svg$/i.test(name)) {
      return "文件名需为小写字母/数字/下划线/中划线（最多 32 个字符），扩展名 .svg";
    }
    return validateSvgFile(file, {
      label: "图标",
      maxBytes: 64 * 1024,
      maxPaths: 120,
      maxNodes: 400,
      requireSquare: true,
    });
  }

  /// 读取本地图片的宽高（同时校验能否正常解码）
  function readImageSize(url) {
    return new Promise(function (resolve) {
      var img = new Image();
      img.onload = function () {
        resolve({ ok: true, width: img.naturalWidth, height: img.naturalHeight });
      };
      img.onerror = function () { resolve({ ok: false }); };
      img.src = url;
    });
  }

  /// 角色素材预检：SVG 按角色规则校验，位图确认可解码且尺寸不超限
  async function validateCharacterAssetFile(file, objectUrl) {
    var m = /\.([a-z0-9]+)$/i.exec(file.name || "");
    var ext = m ? m[1].toLowerCase() : "";
    if (["svg", "png", "jpg", "jpeg", "webp"].indexOf(ext) < 0) {
      return "仅支持 SVG / PNG / JPG / WEBP";
    }
    if (!file.size) return "文件为空";
    if (ext === "svg") {
      return validateSvgFile(file, {
        label: "角色素材",
        maxBytes: 1024 * 1024,
        maxPaths: 1200,
        maxNodes: 3000,
        requireSquare: false,
      });
    }
    if (file.size > 3 * 1024 * 1024) return "图片不能超过 3MB";
    var ownUrl = objectUrl || URL.createObjectURL(file);
    var dim = await readImageSize(ownUrl);
    if (!objectUrl) URL.revokeObjectURL(ownUrl);
    if (!dim.ok) return "图片无法解码，文件内容与扩展名可能不一致";
    if (dim.width > 4096 || dim.height > 4096) {
      return "图片尺寸过大（宽高最多 4096px）";
    }
    return null;
  }

  async function uploadAsset(file, dir, keepName, overwrite) {
    var m = /\.([a-z0-9]+)$/i.exec(file.name || "");
    var ext = m ? m[1].toLowerCase() : "svg";
    if (["svg", "png", "jpg", "jpeg", "webp"].indexOf(ext) < 0) {
      throw new Error("仅支持 SVG / PNG / JPG / WEBP");
    }
    if (!file.size) throw new Error("文件为空");
    if (file.size > 3 * 1024 * 1024) throw new Error("文件不能超过 3MB");
    if (dir === "preset/characters" && ext === "svg" && file.size > 1024 * 1024) {
      throw new Error("角色 SVG 不能超过 1MB");
    }
    var q = "?ext=" + encodeURIComponent(ext);
    if (dir) q += "&dir=" + encodeURIComponent(dir);
    // 容器图标保留原文件名：App 以文件名作为容器 id，删除/覆盖都按它对应
    if (keepName) q += "&name=" + encodeURIComponent(file.name || "");
    if (overwrite) q += "&overwrite=1";
    var res = await fetch(state.api + "/admin/assets" + q, {
      method: "POST",
      headers: {
        "Authorization": "Bearer " + state.token,
        "Content-Type": "application/octet-stream",
      },
      body: file,
    });
    var data = null;
    try { data = await res.json(); } catch (_) {}
    if (res.status === 401) { logout(); throw new Error("登录已过期，请重新登录"); }
    if (!res.ok) {
      var msg = (data && (data.message || (data.error && data.error.message))) || ("HTTP " + res.status);
      throw new Error(msg);
    }
    return data.url;
  }

  /* ---------------- 登录 / 退出 ---------------- */
  function showLogin() {
    $("loginView").classList.remove("hidden");
    $("app").classList.add("hidden");
    $("apiBase").value = state.api;
  }

  function logout() {
    // 先让服务端吊销会话，本地再清空（失败也不阻塞退出）
    if (state.token) {
      try {
        fetch(state.api + "/admin/logout", {
          method: "POST",
          headers: { "Authorization": "Bearer " + state.token },
          keepalive: true,
        }).catch(function () {});
      } catch (_) {}
    }
    state.token = "";
    state.tab = "beverages";
    state.page = 1;
    state.categories = [];
    localStorage.removeItem(LS_TOKEN);
    localStorage.removeItem(LS_USER);
    localStorage.removeItem(LS_EMAIL);
    showLogin();
  }

  async function doLogin(e) {
    e.preventDefault();
    var btn = $("loginBtn");
    $("loginErr").textContent = "";
    var apiBase = $("apiBase").value.trim().replace(/\/+$/, "");
    if (!apiBase) { $("loginErr").textContent = "请填写 API 地址"; return; }
    state.api = apiBase;
    localStorage.setItem(LS_API, state.api);
    btn.disabled = true;
    btn.textContent = "登录中…";
    try {
      var data = await api("/admin/login", {
        method: "POST",
        body: JSON.stringify({
          email: $("email").value.trim(),
          password: $("password").value,
        }),
      });
      state.token = data.accessToken;
      localStorage.setItem(LS_TOKEN, state.token);
      localStorage.setItem(LS_USER, data.userId || "");
      localStorage.setItem(LS_EMAIL, data.email || "");
      // 重新登录总是回到饮品库，避免上次页面接口异常导致循环跳登录
      state.tab = "beverages";
      state.page = 1;
      enterApp();
    } catch (err) {
      $("loginErr").textContent = err.message || "登录失败";
    } finally {
      btn.disabled = false;
      btn.textContent = "登录";
    }
  }

  function renderWho() {
    var email = localStorage.getItem(LS_EMAIL) || "";
    var uid = localStorage.getItem(LS_USER) || "";
    $("whoami").textContent = "已登录：" + (email || uid || "—");
  }

  function enterApp() {
    $("loginView").classList.add("hidden");
    $("app").classList.remove("hidden");
    $("apiHint").textContent = state.api;
    renderWho();
    // 仅登录进入时给一次加载占位；之后所有刷新均静默
    $("view").innerHTML = '<div class="card"><div class="empty">加载中…</div></div>';
    switchTab(state.tab);
  }

  /* ---------------- 账号安全：修改邮箱 / 密码 ---------------- */
  async function openAccountModal() {
    var currentEmail = localStorage.getItem(LS_EMAIL) || "";
    try {
      var info = await api("/admin/account");
      currentEmail = info.email || currentEmail;
      localStorage.setItem(LS_EMAIL, currentEmail);
      renderWho();
    } catch (err) {
      // 取不到就用本地缓存邮箱继续，保存时会由服务端校验
    }

    openModal(
      "账号安全",
      '<div class="form-grid">' +
        '<div class="full"><label>登录邮箱</label><input id="a_email" value="' + esc(currentEmail) + '" /></div>' +
        '<div class="full"><label>当前密码</label><input id="a_old" type="password" autocomplete="current-password" /></div>' +
        '<div class="full"><label>新密码（留空表示不修改）</label><input id="a_new" type="password" autocomplete="new-password" /></div>' +
        '<div class="full"><label>确认新密码</label><input id="a_new2" type="password" autocomplete="new-password" /></div>' +
        '<div class="full" style="font-size:12px;opacity:.7;">修改密码后，其他设备上的登录态会失效，当前设备保持登录。</div>' +
      "</div>",
      async function () {
        var email = $("a_email").value.trim();
        var oldPwd = $("a_old").value;
        var newPwd = $("a_new").value;
        var newPwd2 = $("a_new2").value;
        if (!email) throw new Error("请填写登录邮箱");
        if (!oldPwd) throw new Error("请输入当前密码");
        if (newPwd || newPwd2) {
          if (newPwd.length < 8) throw new Error("新密码至少 8 位");
          if (newPwd !== newPwd2) throw new Error("两次输入的新密码不一致");
        }
        var dto = { currentPassword: oldPwd, email: email };
        if (newPwd) dto.newPassword = newPwd;
        var res = await api("/admin/account", {
          method: "PATCH",
          body: JSON.stringify(dto),
        });
        localStorage.setItem(LS_EMAIL, res.email || email);
        renderWho();
        closeModal();
        toast("账号信息已更新");
      }
    );
  }

  /* ---------------- 导航 ---------------- */
  var TITLES = {
    dashboard: "数据看板",
    beverages: "饮品库",
    categories: "饮品分类",

      else if (state.tab === "users") await renderUsers();

      else if (state.tab === "challenges") await renderChallenges();
      else if (state.tab === "releases") await renderReleases();

  /// 让纵轴最大值落在整齐刻度上（4 条网格线）
  function niceCeil(v) {
    if (!v || v <= 4) return 4;
    var mag = Math.pow(10, Math.floor(Math.log10(v)));
    var steps = [1, 2, 2.5, 5, 10];
    for (var i = 0; i < steps.length; i++) {
      var step = steps[i] * mag / 4;
      if (step * 4 >= v) return step * 4;
    }
    return v;
  }

  /// 通用趋势图：多序列折线，或单序列柱状；纯内联 SVG，自适应容器宽度
  function trendChart(labels, series, opt) {
    opt = opt || {};
    var W = 700;
    var H = opt.height || 200;
    var L = 44, R = 10, T = 14, B = 24;
    var iw = W - L - R, ih = H - T - B;
    var max = 1;
    series.forEach(function (s) {
      s.values.forEach(function (v) { if (Number(v) > max) max = Number(v); });
    });
    max = niceCeil(max);
    var n = Math.max(2, labels.length);
    var band = iw / n;
    var lineStep = iw / Math.max(1, n - 1);
    var xAt = function (i) {
      return opt.bar ? L + band * (i + 0.5) : L + lineStep * i;
    };
    var yAt = function (v) { return T + ih - (Math.max(0, Number(v) || 0) / max) * ih; };

    var out = '<svg class="chart-svg" viewBox="0 0 ' + W + " " + H + '" role="img">';
    for (var g = 0; g <= 4; g++) {
      var val = max * g / 4;
      var y = yAt(val);
      out += '<line x1="' + L + '" y1="' + y + '" x2="' + (W - R) + '" y2="' + y +
        '" stroke="#e1eaf3" stroke-width="1" />';
      out += '<text x="' + (L - 8) + '" y="' + (y + 4) +
        '" text-anchor="end" font-size="11.5" fill="#5d7288">' +
        esc(opt.tick ? opt.tick(val) : fmtInt(Math.round(val))) + "</text>";
    }
    var every = Math.ceil(labels.length / 6);
    labels.forEach(function (lb, i) {
      if (i % every !== 0 && i !== labels.length - 1) return;
      out += '<text x="' + xAt(i) + '" y="' + (H - 6) +
        '" text-anchor="middle" font-size="11" fill="#6b8098">' + esc(lb) + "</text>";
    });

    if (opt.bar) {
      var bw = Math.min(26, band * 0.6);
      series[0].values.forEach(function (v, i) {
        var h = T + ih - yAt(v);
        if (h <= 0) return;
        out += '<rect x="' + (xAt(i) - bw / 2) + '" y="' + yAt(v) +
          '" width="' + bw + '" height="' + Math.max(2, h) + '" rx="4" fill="' +
          series[0].color + '" />';
      });
    } else {
      series.forEach(function (s) {
        var pts = s.values.map(function (v, i) { return xAt(i) + "," + yAt(v); });
        if (s.fill && pts.length) {
          out += '<polygon points="' + xAt(0) + "," + (T + ih) + " " + pts.join(" ") +
            " " + xAt(pts.length - 1) + "," + (T + ih) + '" fill="' + s.color +
            '" opacity=".07" />';
        }
        out += '<polyline fill="none" stroke="' + s.color + '" stroke-width="2.4"' +
          ' stroke-linejoin="round" stroke-linecap="round" points="' + pts.join(" ") + '" />';
        var last = pts[pts.length - 1] || "";
        var xy = last.split(",");
        if (xy.length === 2) {
          out += '<circle cx="' + xy[0] + '" cy="' + xy[1] + '" r="3.4" fill="#fff"' +
            ' stroke="' + s.color + '" stroke-width="2.2" />';
        }
      });
    }
    return out + "</svg>";
  }

    var STATUS = { pending: "待确认", paid: "已确认", rejected: "已拒绝", cancelled: "已取消", refunded: "已退款" };
    var COLORS = { pending: "#d9a13b", paid: "#2eb872", rejected: "#e5484d", cancelled: "#9aa0aa", refunded: "#8e8e93" };
    var ORDER_STATUSES = ["pending", "paid", "rejected", "cancelled", "refunded"];
    var statusRows = ORDER_STATUSES.map(function (st) {

    // 会员转化漏斗：按 actor 去重，环环比 = 相对上一环节
    var steps = (funnel && funnel.steps) || [];

            "</div>";

      : '<div class="empty" style="padding:20px">暂无埋点数据</div>';
    var extras = (funnel && funnel.extra) || [];

      return hit ? hit.users : 0;
    };
    var funnelExtra = '<div class="funnel-extra">' +

    $("view").innerHTML =

      "目标完成率 = 达成每日目标的用户日 / 有打卡的用户日；留存按注册日分群，看次日与第 7 日是否再次打卡；" +

  async function renderBeverages() {
    // 分类胶囊：分类由「饮品分类」页维护
    var cats = state.categories || [];
    try {
      cats = await api("/admin/categories");
      state.categories = Array.isArray(cats) ? cats : [];
    } catch (_) { cats = state.categories || []; }
    if (!Array.isArray(cats)) cats = [];
    if (state.beverageCategory &&
        !cats.some(function (c) { return c.code === state.beverageCategory; })) {
      state.beverageCategory = "";
    }

    // 饮品数量不大，分页循环拉全量：排序靠列表里的 ↑ ↓ 精确控制
    var all = [];
    for (var p = 1; p <= 20; p++) {
      var chunk = await api("/beverages?page=" + p + "&pageSize=100");
      if (!Array.isArray(chunk) || !chunk.length) break;
      all = all.concat(chunk);
      if (chunk.length < 100) break;
    }
    state.beverageAll = all;
    state.rows = state.beverageCategory
      ? all.filter(function (b) { return b.category === state.beverageCategory; })
      : all;

    var catName = {};
    var counts = {};
    all.forEach(function (b) {
      catName[b.category] = b.categoryName || b.category;
      counts[b.category] = (counts[b.category] || 0) + 1;
    });
    cats.forEach(function (c) {
      catName[c.code] = c.name;
      if (!counts[c.code]) counts[c.code] = 0;
    });

    var chips = [{ code: "", name: "全部", count: all.length }]
      .concat(cats.map(function (c) {
        return { code: c.code, name: c.name, count: counts[c.code] || 0 };
      }))
      .map(function (c) {

      "</div></div>",
      async function () {

          name: $("f_name").value.trim(),

          memberOnly: $("f_member").checked,
          isPublished: $("f_pub").checked,
          iconUrl: $("f_icon").value.trim(),
          liquidColor: $("f_color").value.trim(),
        };
        if (!modalReady()) throw new Error("请先填写完整的配置信息");
        if (!dto.name) throw new Error("名称不能为空");
        if (isEdit) await api("/beverages/" + item.id, { method: "PATCH", body: JSON.stringify(dto) });
        else await api("/beverages", { method: "POST", body: JSON.stringify(dto) });

        toast(isEdit ? "已保存" : "已新增");
        render();
      },
      function () { return modalReady(); }
    );

    // 弹窗加宽：参考客户端添加饮品页的「预览 + 分区」布局
    $("modalBox").classList.add("wide");

    var iconInput = $("f_icon");
    var preview = $("f_preview");
    var hint = $("f_icon_hint");
    var catSelect = $("f_category");
    var colorInput = $("f_color");
    var colorPick = $("f_color_pick");
    var palette = $("f_palette");

    // 颜色统一为 16 进制 #RRGGBB（兼容 #RGB 与不带 # 的简写）
    function normalizeHex(raw) {
      var v = String(raw || "").trim().replace(/^#/, "");
      if (/^[0-9a-fA-F]{3}$/.test(v)) {
        v = v[0] + v[0] + v[1] + v[1] + v[2] + v[2];
      }
      if (!/^[0-9a-fA-F]{6}$/.test(v)) return null;
      return "#" + v.toUpperCase();
    }

    var currentColor = normalizeHex(item.liquidColor) || DRINK_COLOR_PRESETS[6];

    // 常用色板：只放两行常用色（10 个），当前颜色高亮
    function renderPalette() {
      palette.innerHTML = DRINK_COLOR_PRESETS.slice(0, 10).map(function (c) {
        var on = c.toUpperCase() === currentColor.toUpperCase();
        return '<div class="pdot' + (on ? " selected" : "") + '" data-color="' + c + '" title="' + c + '">' +
          '<span style="background:' + c + ';color:' + (on ? "#fff" : "transparent") + ';">' +
            (on ? "✓" : "") +
          "</span></div>";
      }).join("");
    }

    // 未上传图标时预览内置容器剪影（按分类 + 液体色着色），与客户端展示一致
    function syncPreview() {
      var u = iconInput.value.trim();
      if (!u) {
        var code = catSelect.value;
        preview.innerHTML = containerIconHtml(
          {
            id: isEdit ? item.id : "",
            category: code,
            liquidColor: currentColor,
          },
          96,
          code
        );
        hint.style.display = "";
        hint.textContent = "未选图标时使用客户端内置插画；图标请从「容器图标库」挑选";
        return;
      }
      preview.innerHTML = uploadedIconHtml(u, 96, currentColor);
      hint.style.display = "none";
    }

    // 色板 / 文本框 / 取色器统一入口：同步色值、选中态与预览
    function applyColor(hex) {
      currentColor = hex;
      if (colorInput.value.toUpperCase() !== hex.toUpperCase()) colorInput.value = hex;
      if (colorPick.value.toUpperCase() !== hex.toUpperCase()) colorPick.value = hex;
      renderPalette();
      syncPreview();
    }

    colorInput.value = currentColor;
    colorPick.value = currentColor;
    renderPalette();
    palette.onclick = function (e) {
      var dot = e.target.closest("[data-color]");
      if (dot) applyColor(dot.dataset.color);
    };
    // 输入过程中只在完整 6 位时实时预览，失焦时再纠正/补全写法
    colorInput.oninput = function () {
      var v = this.value.trim().replace(/^#/, "");
      if (/^[0-9a-fA-F]{6}$/.test(v)) {
        currentColor = "#" + v.toUpperCase();
        renderPalette();
        syncPreview();
      }
    };
    colorInput.onchange = function () {
      var hex = normalizeHex(this.value);
      if (!hex) {
        this.value = currentColor;
        toast("颜色格式应为 16 进制，例如 #56CCF2");
        return;
      }
      applyColor(hex);
    };
    colorPick.oninput = function () {
      var hex = normalizeHex(this.value);
      if (hex) applyColor(hex);
    };
    iconInput.oninput = syncPreview;
    catSelect.onchange = syncPreview;
    syncPreview();

    // 从「容器图标库」挑现成图标：单独的小卡片，不改变主弹窗尺寸
    $("f_icon_lib_btn").onclick = function () {
      openIconPicker(iconInput.value.trim(), function (url) {
        iconInput.value = url;
        syncPreview();
        modalReady();
      });
    };

    // 必填项没录完：「保存」保持禁用
    function modalReady() {
      if (!$("f_name")) return false;
      var ready = $("f_name").value.trim().length > 0 &&
        !!$("f_category").value &&
        $("f_icon").value.trim().length > 0 &&
        Number($("f_ml").value) > 0 &&
        Number($("f_ratio").value) > 0 &&
        !!normalizeHex($("f_color").value) &&
        !!$("f_anim").value;
      var save = $("modalSave");
      if (save) {
        save.disabled = !ready;
        save.title = ready ? "" : "请先填写完整的配置信息";
      }
      return ready;
    }
    ["f_name", "f_category", "f_icon", "f_ml", "f_ratio", "f_color", "f_anim"].forEach(function (id) {
      var el = $(id);
      if (!el) return;
      el.addEventListener("input", modalReady);
      el.addEventListener("change", modalReady);
    });
    modalReady();
  }

      '<div class="grow"></div>' +
      '<button class="btn" id="containerUploadBtn">上传容器图标</button></div>' +

  /// 上传容器图标：先弹卡片选文件 → 预览 + 预检 → 确认后上传
  /// existing：图标库现有文件名（小写），用于同名覆盖提示
  function openContainerUpload(existing) {
    var queue = []; // { file, url, error }

    function revokeAll() {
      queue.forEach(function (f) { URL.revokeObjectURL(f.url); });
    }

    function renderQueue() {
      var box = $("cuList");
      if (!box) return;
      if (!queue.length) {
        box.innerHTML = '<div class="empty" style="padding:24px;">还没有选择文件，点击上方「选择 SVG 文件」</div>';
      } else {
        box.innerHTML = queue.map(function (f, i) {
          var name = String(f.file.name || "");
          var dup = existing[name.toLowerCase()];
          return '<div class="cu-row">' +
            '<span class="cu-thumb"><img src="' + esc(f.url) + '" alt="" /></span>' +
            '<div class="cu-meta">' +
              '<div class="cu-name">' + esc(name) + "</div>" +
              '<div class="cu-sub">' + (f.file.size / 1024).toFixed(1) + " KB</div>" +
              (f.error
                ? '<div class="cu-status bad">' + esc(f.error) + "</div>"
                : '<div class="cu-status ok">校验通过，可用于 App 容器图标</div>') +
              (dup ? '<div class="cu-tags"><span class="tag gold">同名图标已存在 · 上传后将覆盖</span></div>' : "") +
            "</div>" +
            '<button type="button" class="cu-del" data-cu-del="' + i + '" title="移除">✕</button>' +
          "</div>";
        }).join("");
        box.querySelectorAll("[data-cu-del]").forEach(function (el) {
          el.onclick = function () {
            var idx = Number(el.dataset.cuDel);
            if (queue[idx]) URL.revokeObjectURL(queue[idx].url);
            queue.splice(idx, 1);
            renderQueue();
          };
        });
      }
      var save = $("modalSave");
      if (save) save.disabled = !queue.some(function (f) { return !f.error; });
    }

    var bodyHtml =
      '<div class="cu-pick">' +
        '<label class="btn ghost" style="margin:0;cursor:pointer;">选择 SVG 文件' +
          '<input id="cuInput" type="file" accept=".svg" multiple style="display:none;" />' +
        "</label>" +
        '<span class="api-hint">单色 SVG 剪影，文件名（小写字母/数字/下划线，≤32 字符）即容器 id，上限 64KB</span>' +
      "</div>" +
      '<div class="cu-list" id="cuList"></div>' +
      '<div class="api-hint" style="margin-top:10px;">选择后会立即预览图标并做格式校验；校验不通过的文件不会被上传</div>';

    async function doUpload() {
      var items = queue.filter(function (f) { return !f.error; });
      if (!items.length) throw new Error("没有可上传的文件");
      var dups = items.filter(function (f) { return existing[String(f.file.name).toLowerCase()]; });
      if (dups.length) {
        var names = dups.map(function (f) { return f.file.name; }).join("、");
        if (!confirm("以下同名图标已存在，覆盖后所有用户都会看到新图标：\n" + names + "\n\n确定覆盖吗？")) {
          throw new Error("已取消覆盖");
        }
      }
      for (var i = 0; i < items.length; i++) {
        var f = items[i];
        var overwrite = !!existing[String(f.file.name).toLowerCase()];
        await uploadAsset(f.file, "preset/containers", true, overwrite);
        existing[String(f.file.name).toLowerCase()] = true;
      }
      toast("已上传 " + items.length + " 个容器图标");
      revokeAll();
      queue = [];
      closeModal();
      render();
    }

    openModal("上传容器图标", bodyHtml, doUpload);

    var save = $("modalSave");
    save.textContent = "上传";
    save.disabled = true;
    // 覆盖 openModal 的默认保存逻辑：按钮文案与上传语义一致
    save.onclick = async function () {
      $("modalErr").textContent = "";
      save.disabled = true;
      save.textContent = "上传中…";
      try {
        await doUpload();
      } catch (err) {
        $("modalErr").textContent = err.message || "上传失败";
        save.disabled = !queue.some(function (f) { return !f.error; });
        save.textContent = "上传";
      }
    };
    $("modalCancel").onclick = function () { revokeAll(); closeModal(); };
    renderQueue();

    $("cuInput").onchange = async function () {
      var files = Array.prototype.slice.call(this.files || []);
      this.value = "";
      for (var i = 0; i < files.length; i++) {
        var f = files[i];
        var lowerName = String(f.name || "").toLowerCase();
        if (queue.some(function (q) { return String(q.file.name).toLowerCase() === lowerName; })) {
          toast("已选择同名文件：" + f.name);
          continue;
        }
        var item = { file: f, url: URL.createObjectURL(f), error: null };
        queue.push(item);
        renderQueue();
        item.error = await validateContainerSvgFile(f);
        renderQueue();
      }
    };
  }

  /// 新增分类的排序：取现有最大 sort + 1，自动排到末尾
  function nextCatSort() {
    var max = 0;
    (state.charCategories || []).forEach(function (c) {
      if (Number(c.sort) > max) max = Number(c.sort);
    });
    return max + 1;
  }

  /// 分类上移 / 下移一位（客户端标签顺序随之变化）
  async function moveCharCategory(code, dir) {
    var cats = state.charCategories || [];
    var i = cats.findIndex(function (c) { return c.code === code; });
    if (i < 0) return;
    var other = cats[i + dir];
    if (!other) return;
    var curSort = Number(cats[i].sort);
    var newSort = dir < 0
      ? Math.min(Number(other.sort), curSort) - 1
      : Math.max(Number(other.sort), curSort) + 1;
    try {
      await api("/character-categories/" + encodeURIComponent(code), {
        method: "PATCH",
        body: JSON.stringify({ sort: newSort }),
      });
      render();
    } catch (err) { toast(err.message || "移动失败"); }
  }

      : state.charCategories.length + 1;

        '<div><label>分类 code</label><input id="cf_code" value="' + esc(isEdit ? cat.code : "") +

        '<div><label>序号</label><input value="' + (isEdit ? "当前第 " + pos + " 位（用列表 ↑ ↓ 调整）" : "新增后排在末尾") +
          '" readonly style="opacity:.6;" /></div>' +

      async function () {

        if (!name) throw new Error("显示名称必填");

        if (isEdit) {
          await api("/character-categories/" + encodeURIComponent(cat.code), {

        closeModal();
        toast(isEdit ? "已保存" : "已新增分类");
        render();
      }
    );
  }

          sort: isEdit && categoryCode === (item.categoryCode || "daily")
            ? Number(item.sort)
            : nextSortFor(categoryCode),
          isPublished: $("c_pub").checked,
        };
        if (!dto.code || !dto.name || !dto.assetUrl) throw new Error("code / 名称 / 素材地址 必填");
        if (isEdit) await api("/characters/" + item.id, { method: "PATCH", body: JSON.stringify(dto) });
        else await api("/characters", { method: "POST", body: JSON.stringify(dto) });
        closeModal();
        toast(isEdit ? "已保存" : "已新增");
        render();
      }
    );
    // 角色权益跟随分类：在弹窗里直接提示所选分类的权益
    var catMeta = {};
    (state.charCategories || []).forEach(function (c) { catMeta[c.code] = c; });
    function syncCatHint() {
      var c = catMeta[$("c_category").value];
      var el = $("c_member_hint");
      if (!el) return;
      el.textContent = c
        ? (c.memberOnly
            ? "该分类为会员专属：非会员在客户端整组加锁"
            : "该分类免费：所有用户可用（权益在「角色分类」页统一设置）")
        : "";
    }
    $("c_category").onchange = syncCatHint;
    syncCatHint();

    // 弹窗内上传：先选文件预览 + 校验，确认后再上传并回填地址
    var up = null; // { file, url, error, uploaded }
    function syncAssetPreview() {
      var box = $("c_asset_preview");
      if (box) box.innerHTML = challengeAssetPreview($("c_asset").value.trim());
    }
    function renderUp() {
      var box = $("c_up");
      if (!box) return;
      if (!up) { box.innerHTML = ""; return; }
      box.innerHTML = '<div class="cu-row" style="margin-top:10px;">' +
        '<span class="cu-thumb"><img src="' + esc(up.url) + '" alt="" /></span>' +
        '<div class="cu-meta">' +
          '<div class="cu-name">' + esc(up.file.name || "") + "</div>" +
          '<div class="cu-sub">' + (up.file.size / 1024).toFixed(1) + " KB</div>" +
          (up.error
            ? '<div class="cu-status bad">' + esc(up.error) + "</div>"
            : up.uploaded
              ? '<div class="cu-status ok">已上传，素材地址已填入</div>'
              : '<div class="cu-status ok">校验通过，可用于 App 角色素材</div>') +
          (!up.error && !up.uploaded
            ? '<div class="cu-tags"><button type="button" class="btn sm" id="c_up_do">上传</button></div>'
            : "") +
        "</div>" +
        '<button type="button" class="cu-del" id="c_up_del" title="移除">✕</button>' +
      "</div>";
      var doBtn = $("c_up_do");
      if (doBtn) doBtn.onclick = function () { uploadUp(); };
      var del = $("c_up_del");
      if (del) del.onclick = function () {
        if (up && up.url) URL.revokeObjectURL(up.url);
        up = null;
        renderUp();
      };
    }
    async function uploadUp() {
      if (!up || up.error || up.uploaded) return;
      var file = up.file;
      $("c_up_do").disabled = true;
      $("c_up_do").textContent = "上传中…";
      try {
        var url = await uploadAsset(file, "preset/characters", true);
        up.uploaded = true;
        $("c_asset").value = url;
        var base = String(file.name || "").replace(/\.[^.]+$/, "");
        if (!$("c_code").value.trim()) {
          $("c_code").value = base.replace(/[^a-zA-Z0-9_-]/g, "_");
        }
        if (!$("c_name").value.trim()) $("c_name").value = base;
        $("c_pick_hint").textContent = "已上传：" + url;
        syncAssetPreview();
        renderUp();
      } catch (err) {
        toast(err.message || "上传失败");
        renderUp();
      }
    }
    $("c_asset").oninput = syncAssetPreview;
    $("c_pick").onclick = function () { $("c_pick_file").click(); };
    $("c_pick_file").onchange = async function () {
      var f = this.files && this.files[0];
      this.value = "";
      if (!f) return;
      if (up && up.url) URL.revokeObjectURL(up.url);
      up = { file: f, url: URL.createObjectURL(f), error: null, uploaded: false };
      renderUp();
      up.error = await validateCharacterAssetFile(f, up.url);
      renderUp();
    };
  }

  /// 在所属分类内上移 / 下移一位：把当前项的排序值挪到相邻项之前 / 之后
  async function moveCharacter(id, dir) {
    var cur = state.rows.find(function (x) { return x.id === id; });
    if (!cur) return;
    var sibs = state.rows.filter(function (x) { return x.categoryCode === cur.categoryCode; });
    var i = sibs.findIndex(function (x) { return x.id === id; });
    var other = sibs[i + dir];
    if (!other) return;
    var newSort = dir < 0
      ? Math.min(Number(other.sort), Number(cur.sort)) - 1
      : Math.max(Number(other.sort), Number(cur.sort)) + 1;
    try {
      await api("/characters/" + id, { method: "PATCH", body: JSON.stringify({ sort: newSort }) });
      render();
    } catch (err) { toast(err.message || "移动失败"); }
  }

      render();
    } catch (err) { toast(err.message); }
  }

  /// 用户近 30 天打卡数据：总计 KPI + 卡片内按日期切换的当日数据
  async function userEntriesModal(user) {
    if (!user) return;
    openInfoModal(
      "打卡数据 · " + (user.nickname || user.id),
      '<div class="empty">加载中…</div>',
    );
    try {
      var res = await api(
        "/admin/users/" + encodeURIComponent(user.id) + "/entries?days=30",
      );
      if ($("modalMask").classList.contains("hidden")) return;
      var s = res.summary || {};
      var goal = Number((res.user ? res.user.dailyGoalMl : user.dailyGoalMl) || 0);
      var days = res.daily || [];
      // 明细按日期分组：接口只返回最近 200 条，超出部分在界面上给出提示
      var byDate = Object.create(null);
      (res.entries || []).forEach(function (e) {
        var key = String(e.drankAt || "").slice(0, 10);
        (byDate[key] || (byDate[key] = [])).push(e);
      });

      var mini = function (label, value, unit, sub) {
        return '<div class="kpi"><div class="kpi-label">' + esc(label) + "</div>" +
          '<div class="kpi-value" style="font-size:20px">' + value +
          (unit ? "<em>" + esc(unit) + "</em>" : "") + "</div>" +
          '<div class="kpi-sub">' + sub + "</div></div>";
      };
      var metric = function (label, value, unit) {
        return '<div class="metric"><div class="metric-label">' + esc(label) + "</div>" +
          '<div class="metric-value">' + value + "<em>" + esc(unit) + "</em></div></div>";
      };

      // 日期下拉：index 0 是今天，越往后越早
      var options = days.map(function (d, i) {
        return '<option value="' + i + '">' +
          esc(d.date === res.to ? d.date.slice(5) + "（今天）" : d.date.slice(5)) +
          "</option>";
      }).join("");

      var body =
        '<div class="kpi-grid" style="grid-template-columns:repeat(2,minmax(0,1fr));gap:10px;margin-bottom:12px">' +
          mini("总打卡次数", fmtInt(s.entries) + " 次", "", esc(res.from) + " ~ " + esc(res.to)) +
          mini("总有效饮水", fmtInt(s.effectiveMl), "ml", "实际饮水 " + fmtInt(s.volumeMl) + " ml") +
          mini("达标天数", fmtInt(s.reachedDays) + " / " + fmtInt(s.activeDays), "天", "每天目标 " + fmtInt(goal) + " ml") +
          mini("日均次数", Number(s.avgPerActiveDay || 0).toFixed(2), "次", "按有打卡的天数计") +
        "</div>" +
        '<div class="day-card">' +
          '<div class="day-head">' +
            '<div><div class="day-title">按天数据</div>' +
            '<div class="day-sub">切换日期查看当天的打卡次数与有效饮水</div></div>' +
            '<div class="day-nav">' +
              '<button type="button" id="dayPrev" aria-label="前一天">‹</button>' +
              '<select id="dayPick">' + options + "</select>" +
              '<button type="button" id="dayNext" aria-label="后一天">›</button>' +
            "</div>" +
          "</div>" +
          '<div class="metric-grid" id="dayMetrics"></div>' +
          '<div class="day-detail" id="dayDetail"></div>' +
        "</div>" +
        '<div class="dash-note">吨吨ID：' + esc(user.id) +
        " · 最近打卡：" + esc(fmtTime(s.lastDrankAt)) +
        " · 明细最多展示最近 200 条</div>";

      var box = $("modalBox");
      box.innerHTML =
        "<h3>打卡数据 · " + esc(user.nickname || user.id) + "</h3>" + body +
        '<div class="modal-foot"><button class="btn ghost" id="modalClose">关闭</button></div>';
      $("modalClose").onclick = closeModal;

      var pick = $("dayPick");
      var prevBtn = $("dayPrev");
      var nextBtn = $("dayNext");

      var renderDay = function (index) {
        var d = days[index];
        if (!d) return;
        pick.value = String(index);
        // 下拉列表是「今天 → 更早」，所以 index 越大日期越早
        prevBtn.disabled = index >= days.length - 1;
        nextBtn.disabled = index <= 0;

        var pct = goal > 0 ? Math.round((Number(d.effectiveMl) / goal) * 100) : 0;
        $("dayMetrics").innerHTML =
          metric("打卡次数", esc(fmtInt(d.entries)), "次") +
          metric("有效饮水", esc(fmtInt(d.effectiveMl)), "ml") +
          metric("实际饮水", esc(fmtInt(d.volumeMl)), "ml") +
          metric("完成度", esc(pct), "%");

        var list = byDate[d.date] || [];
        var header = '<div class="dash-note" style="margin:0 0 8px"><strong>' +
          esc(d.date) + "</strong> · " +
          (d.reached ? '<span class="tag on">已达标</span>' : '<span class="tag off">未达标</span>') +
          " · 目标 " + fmtInt(goal) + " ml</div>";

        var rows = list.map(function (e) {
          // 营养值口径与 App 一致：热量/咖啡因按每 250ml，酒精为 %vol
          var nutri = [];
          if (e.calories > 0) nutri.push("<strong>" + esc(e.calories) + "</strong> kcal");
          if (e.caffeineMg > 0) nutri.push("咖啡因 " + esc(e.caffeineMg) + " mg");
          if (e.alcoholPercent > 0) nutri.push("酒精 " + esc(e.alcoholPercent) + "%vol");
          return [
            esc((e.drankAt || "").replace("T", " ").slice(11, 16)),
            "<b>" + esc(e.beverageName || "-") + "</b>",
            esc(e.volumeMl) + " ml",
            esc(e.effectiveMl) + " ml",
            nutri.length
              ? nutri.map(function (t) { return '<div class="nutri-line">' + t + "</div>"; }).join("")
              : "-",
          ];
        });

        var detail = rows.length
          ? tableWrap(["时间", "饮品", "容量", "有效饮水", "营养（每 250ml）"], rows)
          : '<div class="card"><div class="empty" style="padding:22px">当天暂无打卡记录</div></div>';
        // 明细被 200 条上限截断时给出提示，避免误判为数据缺失
        if (rows.length && rows.length < Number(d.entries || 0)) {
          detail += '<div class="dash-note" style="margin-top:8px">当天共 ' +
            fmtInt(d.entries) + " 条，明细仅展示最近 " + rows.length + " 条</div>";
        }
        $("dayDetail").innerHTML = header + detail;
      };

      pick.onchange = function () { renderDay(Number(pick.value) || 0); };
      prevBtn.onclick = function () { renderDay(Math.min(days.length - 1, Number(pick.value) + 1)); };
      nextBtn.onclick = function () { renderDay(Math.max(0, Number(pick.value) - 1)); };
      renderDay(0);
    } catch (err) {
      toast(err.message || "打卡数据加载失败");
      closeModal();
    }
  }

          sort: Number($("p_sort").value),

          benefits: benefits,
        };
        if (!dto.name) throw new Error("套餐名称不能为空");
        if (!Number.isFinite(dto.priceCents) || dto.priceCents < 0) {
          throw new Error("价格不合法");
        }
        if (!Number.isFinite(dto.durationDays) || dto.durationDays < 0) {
          throw new Error("时长需为 0-3650 天");
        }
        await api("/admin/plans/" + encodeURIComponent(plan.code), {
          method: "PATCH",
          body: JSON.stringify(dto),
        });
        closeModal();
        toast("套餐已更新");
        render();
      }
    );

  /* ---------------- 挑战卡 ---------------- */
  // 内置插画以安装包路径下发（assets/images/characters/xxx.svg），后台预览时
  // 映射到服务器同名预设角色；后台上传的图片则存放在 /static/challenges。
  var CHALLENGE_ASSET_PREFIX = "assets/images/characters/";
  var BEVERAGE_CATEGORY_NAMES = [
    "water", "tea", "coffee", "milk", "milkTea", "juice", "soda", "soup", "alcohol",
  ];

  function challengeAssetPreview(asset) {
    if (!asset) return '<span class="tag off">无插画</span>';
    var src = asset;
    if (asset.indexOf(CHALLENGE_ASSET_PREFIX) === 0) {
      src = "/static/preset/characters/" + asset.slice(CHALLENGE_ASSET_PREFIX.length);
    } else if (asset.charAt(0) !== "/" && !/^https?:\/\//i.test(asset)) {
      return '<span class="tag">' + esc(asset) + "</span>";
    }
    return '<img src="' + esc(assetUrl(src)) + '" alt="" title="' + esc(asset) +
      '" style="width:40px;height:40px;object-fit:contain;border-radius:9px;background:#f5f7fa;vertical-align:middle;" />';
  }

  function splitCsv(text) {
    return String(text || "")
      .split(/[,，]/)
      .map(function (s) { return s.trim(); })
      .filter(function (s) { return s; });
  }

  // 好处：每行 `emoji|文案`，未写分隔符时整行按文案处理
  function parseBenefitsText(text) {
    var out = [];
    String(text || "").split(/\r?\n/).forEach(function (line) {
      line = line.trim();
      if (!line) return;
      var idx = line.indexOf("|");
      var emoji = idx >= 0 ? line.slice(0, idx).trim() : "";
      var body = idx >= 0 ? line.slice(idx + 1).trim() : line;
      if (body) out.push([emoji, body]);
    });
    return out;
  }

  function challengeModal(row) {

          esc((item.forbiddenLabels || []).join(", ")) + '" /></div>' +

          esc((item.forbiddenKeywords || []).join(", ")) + '" /></div>' +
