        "</select>" +
        '<div class="grow"></div>' +
        '<span class="api-hint">共 ' + total + " 条</span>" +
      "</div>" + body + pagerTotal(total);
    $("fbStatus").onchange = function () {
      state.fbStatus = this.value;
      state.page = 1;
      render();
    };
    bindPager();
    document.querySelectorAll("[data-fb]").forEach(function (el) {
      el.onclick = async function () {
        var row = state.fbRows.find(function (x) { return x.id === el.dataset.fb; });
        try {
          await api("/admin/feedback/" + row.id, {
            method: "PATCH",
            body: JSON.stringify({ status: row.status === "open" ? "resolved" : "open" }),
          });
          toast(row.status === "open" ? "已标记处理" : "已重新打开");
          render();
        } catch (err) { toast(err.message); }
      };
    });
  }

  async function renderOrders() {
    var qs = "/membership/orders?page=" + state.page + "&pageSize=" + state.pageSize;
    if (state.orderStatus) qs += "&status=" + encodeURIComponent(state.orderStatus);
    if (state.orderUser) qs += "&userId=" + encodeURIComponent(state.orderUser);
    var rows = await api(qs);
    state.rows = Array.isArray(rows) ? rows : [];
    var STATUS = { pending: "待确认", paid: "已确认", rejected: "已拒绝", cancelled: "已取消", refunded: "已退款" };
    var body = state.rows.map(function (o) {
      var st = o.status || "pending";
      var isPoints = (o.source || "payment") === "points";
      return [
        '<span class="mono">' + esc(o.id) + "</span>",
        "<b>" + esc(o.user ? (o.user.nickname || o.user.email || o.user.id) : o.userId) + "</b>",
        esc(o.plan ? o.plan.name : o.planId),
        isPoints
          ? '<span class="tag gold">-' + (o.pointsCost || 0) + " 积分</span>"
          : "¥" + ((o.amountCents || 0) / 100).toFixed(2),
        isPoints
          ? '<span class="tag gold">积分兑换</span>'
          : '<span class="tag on">付费</span>',
        '<span class="tag ' + esc(st) + '">' + esc(STATUS[st] || st) + "</span>",
        esc(fmtTime(o.createdAt)),
        esc(fmtTime(o.paidAt)),
        st === "pending"
          ? '<button class="btn sm" data-paid="' + esc(o.id) + '">确认并开通</button> ' +
            '<button class="btn sm danger" data-reject="' + esc(o.id) + '">拒绝</button>'
          : '<span class="tag off">-</span>',
      ];
    });
    $("view").innerHTML =
      '<div class="toolbar">' +
        '<span class="api-hint">内测阶段无真实支付：用户提交开通申请后在此确认，确认即下发会员权益，App 自动刷新生效；积分兑换的订单由服务端自动记为「已确认」</span>' +
        '<div class="grow"></div>' +
        '<select id="orderStatus">' +
          '<option value="">全部状态</option>' +
          ["pending", "paid", "rejected", "cancelled", "refunded"].map(function (s) {
            return '<option value="' + s + '"' + (state.orderStatus === s ? " selected" : "") + ">" + STATUS[s] + "</option>";
          }).join("") +
        "</select>" +
        '<input id="orderUser" placeholder="按 userId 过滤" value="' + esc(state.orderUser) + '" />' +
        '<button class="btn ghost" id="queryOrders">查询</button>' +
        '<div class="grow"></div>' +
      "</div>" +
      tableWrap(["订单号", "用户", "套餐", "金额", "来源", "状态", "创建时间", "支付时间", "操作"], body) +
      pager();
    bindPager();
    $("queryOrders").onclick = function () {
      state.orderStatus = $("orderStatus").value;
      state.orderUser = $("orderUser").value.trim();
      state.page = 1;
      render();
    };
    $("orderStatus").onchange = function () {
      state.orderStatus = $("orderStatus").value;
      state.page = 1;
      render();
    };
    document.querySelectorAll("[data-paid]").forEach(function (el) {
      el.onclick = function () { markPaid(el.dataset.paid); };
    });
    document.querySelectorAll("[data-reject]").forEach(function (el) {
      el.onclick = function () { rejectOrder(el.dataset.reject); };
    });
  }

  async function rejectOrder(id) {
    var order = state.rows.find(function (x) { return x.id === id; });
    var who = order
      ? (order.user ? (order.user.nickname || order.user.email || order.user.id) : order.userId)
      : id;
    if (!confirm("拒绝「" + who + "」的开通申请？\n\n用户会收到「申请未通过」提示，可重新提交。")) return;
    try {
      await api("/membership/orders/" + id + "/reject", {
        method: "PATCH",
        body: JSON.stringify({}),
      });
      toast("已拒绝该申请");
      render();
    } catch (err) { toast(err.message); }
  }

  async function markPaid(id) {
    var order = state.rows.find(function (x) { return x.id === id; });
    var who = order
      ? (order.user ? (order.user.nickname || order.user.email || order.user.id) : order.userId)
      : id;
    var planName = order && order.plan ? order.plan.name : (order ? order.planId : "");
    var amount = order ? "¥" + ((order.amountCents || 0) / 100).toFixed(2) : "";
    if (!confirm(
      "确认「" + who + "」的开通申请？\n\n套餐：" + planName + "\n金额：" + amount +
      "\n\n确认后立即下发会员权益，操作不可撤销。"
    )) return;
    try {
      await api("/membership/orders/" + id + "/paid", {
        method: "PATCH",
        body: JSON.stringify({ externalTxId: "manual_" + Date.now() }),
      });
      toast("已确认，会员权益已下发");
      render();
    } catch (err) { toast(err.message); }
  }

  /* ---------------- 弹窗 ---------------- */
  function openModal(title, bodyHtml, onSubmit, canSubmit) {
    var box = $("modalBox");
    box.innerHTML =
      "<h3>" + esc(title) + "</h3>" +
      bodyHtml +
      '<div class="modal-err" id="modalErr"></div>' +
      '<div class="modal-foot"><button class="btn ghost" id="modalCancel">取消</button>' +
      '<button class="btn" id="modalSave">保存</button></div>';
    $("modalMask").classList.remove("hidden");
    $("modalCancel").onclick = closeModal;
    $("modalSave").onclick = async function () {
      var btn = $("modalSave");
      $("modalErr").textContent = "";
      btn.disabled = true;
      btn.textContent = "保存中…";
      try {
        await onSubmit();
      } catch (err) {
        $("modalErr").textContent = err.message || "保存失败";
      } finally {
        btn.disabled = canSubmit ? !canSubmit() : false;
        btn.textContent = "保存";
      }
    };
  }

  function closeModal() {
    closeDropdown();
    closeIconPicker();
    $("modalMask").classList.add("hidden");
    $("modalBox").classList.remove("wide");
    $("modalBox").classList.remove("mid");
    $("modalBox").innerHTML = "";
  }

  /// 容器图标选择：独立小卡片浮在编辑弹窗之上，选完即关，主弹窗尺寸不变
  function openIconPicker(currentUrl, onPick) {
    var box = $("pickerBox");
    box.innerHTML = "<h3>选择容器图标</h3>" +
      '<div class="icon-pick-grid" id="pickerGrid"><div class="api-hint">加载中…</div></div>' +
      '<div class="modal-foot"><button class="btn ghost" id="pickerCancel">取消</button></div>';
    $("pickerMask").classList.remove("hidden");
    $("pickerMask").onclick = function (e) {
      if (e.target === $("pickerMask")) closeIconPicker();
    };
    $("pickerCancel").onclick = closeIconPicker;
    (async function () {
      var assets = [];
      try {
        var rows = await api("/admin/assets");
        assets = (rows || []).filter(function (a) {
          return a.name.indexOf("preset/containers/") === 0;
        });
      } catch (err) {
        toast(err.message || "图标库加载失败");
      }
      var grid = $("pickerGrid");
      if (!grid) return;
      if (!assets.length) {
        grid.style.background = "transparent";
        grid.style.padding = "0";
        grid.innerHTML = '<div class="api-hint">图标库为空，请先到「容器图标库」上传</div>';
        return;
      }
      grid.innerHTML = assets.map(function (a) {
        var on = currentUrl && currentUrl === a.url;
        var url = esc(assetUrl(a.url));
        // 与「容器图标库」保持一致：统一 #4a4a4a 剪影，去掉原图填色与方块底色
        var maskStyle = "-webkit-mask:url('" + url + "') center/contain no-repeat;" +
          "mask:url('" + url + "') center/contain no-repeat;";
        return '<button type="button" class="icon-pick' + (on ? " selected" : "") +
          '" data-pick="' + esc(a.url) + '" title="' + esc(String(a.name).split("/").pop()) + '">' +
          '<span class="pick-sil" style="' + maskStyle + '"></span></button>';
      }).join("");
      grid.onclick = function (e) {
        var btn = e.target.closest("[data-pick]");
        if (!btn) return;
        var url = btn.dataset.pick;
        closeIconPicker();
        onPick(url);
      };
    })();
  }

  function closeIconPicker() {
    closeDropdown();
    $("pickerMask").classList.add("hidden");
    $("pickerBox").innerHTML = "";
  }

  /* ---------------- 自定义下拉框 ---------------- */
  // 原生 select 展开后的选项列表由系统渲染、样式不可控，这里统一换成
  // 「按钮 + 浮层选项」：原 select 仍留在 DOM 中，value 读写与 change 事件
  // 行为完全不变，只替换外观。
  var ddOpen = null;

  function closeDropdown() {
    if (!ddOpen) return;
    var o = ddOpen;
    ddOpen = null;
    if (o.wrap) o.wrap.classList.remove("open");
    if (o.menu && o.menu.parentNode) o.menu.parentNode.removeChild(o.menu);
  }

  function openDropdown(ctx) {
    closeDropdown();
    ctx.sync();
    var sel = ctx.sel;
    var menu = document.createElement("div");
    menu.className = "dd-menu";
    Array.prototype.forEach.call(sel.options, function (opt, i) {
      var item = document.createElement("button");
      item.type = "button";
      item.className = "dd-opt" + (i === sel.selectedIndex ? " selected" : "");
      item.textContent = opt.textContent;
      item.disabled = opt.disabled;
      item.onclick = function () {
        closeDropdown();
        if (sel.value !== opt.value) {
          sel.value = opt.value;
          sel.dispatchEvent(new Event("change", { bubbles: true }));
        }
        ctx.sync();
      };
      menu.appendChild(item);
    });
    menu.onclick = function (e) { e.stopPropagation(); };
    document.body.appendChild(menu);
    ctx.menu = menu;
    ctx.wrap.classList.add("open");
    ddOpen = ctx;

    var r = ctx.btn.getBoundingClientRect();
    var width = Math.max(r.width, 172);
    menu.style.width = width + "px";
    menu.style.left = Math.min(Math.max(8, r.left), window.innerWidth - width - 8) + "px";
    var natural = menu.offsetHeight;
    var below = window.innerHeight - r.bottom - 10;
    var above = r.top - 10;
    // 下方空间不够时向上展开，避免被窗口底部截断
    var openUp = below < Math.min(natural, 240) && above > below;
    var maxH = Math.max(120, Math.min(natural, openUp ? above : below, 300));
    menu.style.maxHeight = maxH + "px";
    menu.style.top = openUp
      ? Math.max(8, r.top - maxH - 6) + "px"
      : (r.bottom + 6) + "px";
  }

  function enhanceSelect(sel) {
    if (!sel || sel.dataset.dd === "1") return;
    sel.dataset.dd = "1";
    var wrap = document.createElement("div");
    wrap.className = "dd";
    var btn = document.createElement("button");
    btn.type = "button";
    btn.className = "dd-btn";
    btn.innerHTML = '<span class="dd-label"></span>' +
      '<svg class="dd-caret" viewBox="0 0 24 24" aria-hidden="true">' +
      '<path d="M7 9.5 12 14.5 17 9.5"/></svg>';
    var labelEl = btn.querySelector(".dd-label");
    var ctx = {
      sel: sel, wrap: wrap, btn: btn, menu: null,
      sync: function () {
        var opt = sel.options[sel.selectedIndex];
        labelEl.textContent = opt ? opt.textContent : "";
        btn.disabled = !!sel.disabled;
      }
    };
    sel.parentNode.insertBefore(wrap, sel);
    wrap.appendChild(btn);
    wrap.appendChild(sel);
    sel.classList.add("dd-native");
    btn.onclick = function (e) {
      e.stopPropagation();
      if (ddOpen && ddOpen.sel === sel) closeDropdown();
      else openDropdown(ctx);
    };
    sel.addEventListener("change", ctx.sync);
    sel.addEventListener("mousedown", ctx.sync);
    ctx.sync();
  }

  function enhanceSelects(root) {
    (root || document).querySelectorAll("select").forEach(enhanceSelect);
  }

  // 页面与弹窗内容都是整体重绘的，用 MutationObserver 自动给新出现的
  // select 加外壳，避免在每处 render 里逐个补调用
  var ddPending = false;
  var ddObserver = new MutationObserver(function () {
    if (ddPending) return;
    ddPending = true;
    requestAnimationFrame(function () {
      ddPending = false;
      enhanceSelects(document);
    });
  });
  ddObserver.observe(document.body, { childList: true, subtree: true });
  document.addEventListener("click", function () { closeDropdown(); });
  window.addEventListener("resize", closeDropdown);
  window.addEventListener("scroll", closeDropdown, true);

  /* ---------------- 启动 ---------------- */
  $("loginForm").onsubmit = doLogin;
  $("logoutBtn").onclick = logout;
  $("accountBtn").onclick = openAccountModal;
  document.querySelectorAll(".nav-btn").forEach(function (b) {
    b.onclick = function () { switchTab(b.dataset.tab); };
  });
  $("modalMask").onclick = function (e) {
    if (e.target === $("modalMask")) closeModal();
  };

  // 实时刷新：停留的页面每 15 秒静默拉一次数据（弹窗 / 输入中 / 后台标签页暂停）
  setInterval(function () {
    if (!state.token) return;
    if (document.visibilityState !== "visible") return;
    if (ddOpen) return;
    if (!$("modalMask").classList.contains("hidden")) return;
    if (!$("pickerMask").classList.contains("hidden")) return;
    var el = document.activeElement;
    if (el && /^(INPUT|SELECT|TEXTAREA)$/.test(el.tagName)) return;
    var y = window.scrollY;
    render({ silent: true }).then(function () { window.scrollTo(0, y); });
  }, 15000);

  if (state.token) enterApp();
  else showLogin();
})();
</script>
</body>
</html>
