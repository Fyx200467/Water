<!DOCTYPE html>
<html lang="zh-CN">
<head>
<meta charset="utf-8" />
<meta name="viewport" content="width=device-width, initial-scale=1" />
<title>吨吨 · 管理后台</title>
<style>
  :root {
    --bg: #f5f6f8;
    --card: #ffffff;
    --ink: #1c1c1e;
    --gray: #8e8e93;
    --line: #ececef;
    --accent: #3bb3db;
    --accent-soft: #eaf7fb;
    --danger: #e5484d;
    --gold: #d9a13b;
    --nav: #1f2430;
  }
  * { box-sizing: border-box; }
  body {
    margin: 0;
    font-family: -apple-system, BlinkMacSystemFont, "Segoe UI", "PingFang SC",
      "Microsoft YaHei", sans-serif;
    background: var(--bg);
    color: var(--ink);
  }
  .hidden { display: none !important; }
  button { font-family: inherit; cursor: pointer; }
  input, select {
    font-family: inherit;
    font-size: 13px;
    padding: 8px 10px;
    border: 1px solid var(--line);
    border-radius: 10px;
    background: #fff;
    color: var(--ink);
    outline: none;
    width: 100%;
  }
  input:focus, select:focus { border-color: var(--accent); }

  /* ---------------- 登录 ---------------- */
  .login-wrap {
    min-height: 100vh;
    display: flex;
    align-items: center;
    justify-content: center;
    background: radial-gradient(circle at 30% 20%, #dff2f9, #f5f6f8 60%);
  }
  .login-card {
    width: 380px;
    background: var(--card);
    border-radius: 22px;
    padding: 32px 28px;
    box-shadow: 0 18px 50px rgba(31, 36, 48, 0.10);
  }
  .login-card h1 { margin: 0 0 4px; font-size: 24px; }
  .login-card p.sub { margin: 0 0 22px; color: var(--gray); font-size: 13px; }
  .field { margin-bottom: 12px; }
  .field label {
    display: block;
    font-size: 12px;
    color: var(--gray);
    margin-bottom: 6px;
  }
  .btn {
    border: 0;
    border-radius: 12px;
    padding: 10px 16px;
    font-size: 14px;
    font-weight: 600;
    background: var(--accent);
    color: #fff;
  }
  .btn:disabled { opacity: .6; cursor: default; }
  .btn.ghost { background: #f1f2f5; color: var(--ink); }
  .btn.danger { background: #fdecec; color: var(--danger); }
  .btn.sm { padding: 5px 10px; font-size: 12px; border-radius: 9px; }
  .login-card .btn { width: 100%; margin-top: 8px; }
  .login-err { color: var(--danger); font-size: 12px; min-height: 16px; margin-top: 8px; }

  /* ---------------- 布局 ---------------- */
  #app { display: flex; min-height: 100vh; }
  aside {
    width: 212px;
    background: var(--nav);
    color: #cfd6e4;
    padding: 22px 14px;
    display: flex;
    flex-direction: column;
    position: sticky;
    top: 0;
    height: 100vh;
  }
  .brand { padding: 0 10px 22px; color: #fff; font-weight: 800; font-size: 18px; letter-spacing: .5px; }
  .brand span { color: var(--accent); }
  .brand small { display: block; color: #7d879b; font-size: 11px; font-weight: 400; margin-top: 3px; letter-spacing: 0; }
  .nav-btn {
    display: block;
    width: 100%;
    text-align: left;
    border: 0;
    background: transparent;
    color: #cfd6e4;
    padding: 11px 12px;
    border-radius: 11px;
    font-size: 14px;
    margin-bottom: 4px;
  }
  .nav-btn:hover { background: rgba(255,255,255,.07); }
  .nav-btn.active { background: var(--accent); color: #fff; font-weight: 600; }
  .nav-foot { margin-top: auto; font-size: 12px; color: #7d879b; }
  .nav-foot button {
    border: 0; background: rgba(255,255,255,.08); color: #cfd6e4;
    padding: 8px 12px; border-radius: 10px; width: 100%; margin-bottom: 10px;
  }
  main { flex: 1; padding: 26px 30px 40px; min-width: 0; }
  header.page {
    display: flex; align-items: flex-end; justify-content: space-between;
    margin-bottom: 18px; gap: 16px; flex-wrap: wrap;
  }
  header.page h1 { margin: 0; font-size: 22px; }
  .api-hint { font-size: 12px; color: var(--gray); }
  .toolbar { display: flex; gap: 10px; align-items: center; margin-bottom: 14px; flex-wrap: wrap; }
  .toolbar .grow { flex: 1; }
  .toolbar select, .toolbar input { width: auto; min-width: 130px; }

  .card {
    background: var(--card);
    border-radius: 16px;
    overflow: hidden;
    box-shadow: 0 6px 22px rgba(31,36,48,.05);
  }
  table { width: 100%; border-collapse: collapse; font-size: 13px; }
  th {
    text-align: left; font-size: 12px; font-weight: 600; color: var(--gray);
    padding: 12px 14px; background: #fafafb; border-bottom: 1px solid var(--line);
    white-space: nowrap;
  }
  td { padding: 11px 14px; border-bottom: 1px solid var(--line); vertical-align: middle; }
  tr:last-child td { border-bottom: 0; }
  tr:hover td { background: #fbfdfe; }
  td.mono { font-family: ui-monospace, Consolas, monospace; font-size: 11px; color: var(--gray); }
  .tag {
    display: inline-block; padding: 2px 8px; border-radius: 7px;
    font-size: 11px; font-weight: 600; background: #f1f2f5; color: #6b7280;
  }
  .tag.on { background: var(--accent-soft); color: #1d8dad; }
  .tag.off { background: #f1f2f5; color: #9aa0aa; }
  .tag.gold { background: #fff4dd; color: var(--gold); }
  .tag.paid { background: #e8f7ee; color: #1f9254; }
  .tag.pending { background: #fff4dd; color: #b07d19; }
  .tag.cancelled, .tag.refunded { background: #f1f2f5; color: #8e8e93; }
  .row-actions { display: flex; gap: 6px; }
  .empty { padding: 40px; text-align: center; color: var(--gray); font-size: 13px; }
  .pager { display: flex; justify-content: flex-end; gap: 8px; margin-top: 14px; font-size: 12px; color: var(--gray); align-items: center; }
  /* 图标库网格 */
  .icon-grid { display: grid; grid-template-columns: repeat(auto-fill, minmax(132px, 1fr)); gap: 12px; padding: 16px; }
  .icon-cell { background: #f7f8fa; border-radius: 14px; padding: 10px; display: flex; flex-direction: column; align-items: center; gap: 8px; }
  .icon-cell img { width: 92px; height: 92px; object-fit: contain; border-radius: 12px; background: rgba(0,0,0,.20); padding: 8px; }
  .icon-cell .fname { font-size: 11px; color: var(--gray); font-family: ui-monospace, Consolas, monospace; max-width: 100%; overflow: hidden; text-overflow: ellipsis; white-space: nowrap; }
  .swatch { display: inline-block; width: 14px; height: 14px; border-radius: 4px; vertical-align: -2px; margin-right: 6px; border: 1px solid rgba(0,0,0,.08); }
  /* 饮品图标：容器剪影 + 液体色填充，与 App 饮品页一致 */
  .icon-tile {
    display: inline-flex; align-items: center; justify-content: center;
    border-radius: 9px; background: #eef4f8; overflow: hidden; vertical-align: middle;
  }
  .icon-tile img { object-fit: contain; }

  /* ---------------- 弹窗 ---------------- */
  #modalMask {
    position: fixed; inset: 0; background: rgba(20,24,32,.42);
    display: flex; align-items: center; justify-content: center; padding: 20px; z-index: 40;
  }
  .modal {
    width: 520px; max-height: 88vh; overflow: auto; background: #fff;
    border-radius: 20px; padding: 22px 24px;
  }
  .modal h3 { margin: 0 0 16px; font-size: 18px; }
  .form-grid { display: grid; grid-template-columns: 1fr 1fr; gap: 12px; }
  .form-grid .full { grid-column: 1 / -1; }
  .check { display: flex; align-items: center; gap: 8px; font-size: 13px; color: var(--ink); padding-top: 22px; }
  .check input { width: 16px; height: 16px; }
  .modal-foot { display: flex; justify-content: flex-end; gap: 10px; margin-top: 18px; }
  .modal-err { color: var(--danger); font-size: 12px; margin-top: 10px; }

  #toast {
    position: fixed; left: 50%; bottom: 30px; transform: translateX(-50%) translateY(20px);
    background: rgba(28,28,30,.92); color: #fff; padding: 10px 18px; border-radius: 12px;
    font-size: 13px; opacity: 0; pointer-events: none; transition: all .22s; z-index: 60;
  }
  #toast.show { opacity: 1; transform: translateX(-50%) translateY(0); }
</style>
</head>
<body>

<!-- 登录 -->
<div id="loginView" class="login-wrap">
  <form class="login-card" id="loginForm">
    <h1>吨吨管理后台</h1>
    <p class="sub">饮品库 · 分类 · 图标 · 角色 · 会员套餐 · 用户 · 订单</p>
    <div class="field">
      <label>API 地址</label>
      <input id="apiBase" placeholder="http://localhost:3000/api/v1" />
    </div>
    <div class="field">
      <label>管理员邮箱</label>
      <input id="email" type="email" placeholder="admin@example.com" autocomplete="username" />
    </div>
    <div class="field">
      <label>密码</label>
      <input id="password" type="password" placeholder="••••••••" autocomplete="current-password" />
    </div>
    <button class="btn" id="loginBtn" type="submit">登录</button>
    <div class="login-err" id="loginErr"></div>
    <p class="sub" style="margin-top:14px">
      本地服务首次启动会自动创建管理员：admin@example.com / admin123456，
      可用环境变量 ADMIN_EMAIL、ADMIN_PASSWORD 覆盖。
    </p>
  </form>
</div>

<!-- 主界面 -->
<div id="app" class="hidden">
  <aside>
    <div class="brand">吨吨<span>.</span><small>WaterLlama Admin</small></div>
    <button class="nav-btn" data-tab="beverages">饮品库</button>
    <button class="nav-btn" data-tab="categories">饮品分类</button>
    <button class="nav-btn" data-tab="icons">容器图标库</button>
    <button class="nav-btn" data-tab="characters">角色素材</button>
    <button class="nav-btn" data-tab="users">用户列表</button>
    <button class="nav-btn" data-tab="plans">会员套餐</button>
    <button class="nav-btn" data-tab="orders">订单查询</button>
    <div class="nav-foot">
      <div id="whoami" style="margin-bottom:8px;word-break:break-all;"></div>
      <button id="accountBtn" style="margin-bottom:6px;">账号安全</button>
      <button id="logoutBtn">退出登录</button>
    </div>
  </aside>
  <main>
    <header class="page">
      <h1 id="pageTitle">饮品库</h1>
      <div class="api-hint" id="apiHint"></div>
    </header>
    <div id="view"></div>
  </main>
</div>

<div id="modalMask" class="hidden"><div class="modal" id="modalBox"></div></div>
<div id="toast"></div>

<script>
(function () {
  "use strict";

  var LS_API = "wl_admin_api";
  var LS_TOKEN = "wl_admin_token";
  var LS_USER = "wl_admin_user";
  var LS_EMAIL = "wl_admin_email";

  var state = {
    token: localStorage.getItem(LS_TOKEN) || "",
    api: localStorage.getItem(LS_API) ||
      (location.protocol.indexOf("http") === 0
        ? location.origin + "/api/v1"
        : "http://localhost:3000/api/v1"),
    tab: "beverages",
    page: 1,
    pageSize: 20,
    orderStatus: "",
    orderUser: "",
    userQuery: "",
    charCategory: "",
    charCategories: [],
    rows: [],
  };

  var $ = function (id) { return document.getElementById(id); };
  var esc = function (v) {
    return String(v == null ? "" : v)
      .replace(/&/g, "&amp;").replace(/</g, "&lt;")
      .replace(/>/g, "&gt;").replace(/"/g, "&quot;");
  };

  function toast(msg) {
    var el = $("toast");
    el.textContent = msg;
    el.classList.add("show");
    clearTimeout(el._t);
    el._t = setTimeout(function () { el.classList.remove("show"); }, 2200);
  }

  async function api(path, opts) {
    opts = opts || {};
    var headers = { "Content-Type": "application/json" };
    if (state.token) headers["Authorization"] = "Bearer " + state.token;
    var res;
    try {
      res = await fetch(state.api + path, Object.assign({}, opts, { headers: headers }));
    } catch (e) {
      throw new Error("无法连接后端：" + state.api);
    }
    var text = await res.text();
    var data = null;
    try { data = text ? JSON.parse(text) : null; } catch (_) { data = text; }
    if (res.status === 401) {
      var em = (data && data.error && data.error.message) || "";
      if (state.token) {
        logout();
        throw new Error("登录已过期，请重新登录");
      }
      throw new Error(em || "邮箱或密码错误");
    }
    if (!res.ok) {
      var msg = (data && data.error && data.error.message) || ("HTTP " + res.status);
      if (Array.isArray(msg)) msg = msg.join("; ");
      throw new Error(msg);
    }
    return data;
  }

  /* ---------------- 素材地址与上传 ---------------- */
  // 后端 API 前缀是 /api/v1，静态素材挂在根路径 /static/*，这里换算出资源根地址
  function assetOrigin() {
    return state.api.replace(/\/api\/v\d+\/?$/i, "");
  }

  function assetUrl(u) {
    if (!u) return "";
    if (/^https?:\/\//i.test(u)) return u;
    return assetOrigin() + (u.charAt(0) === "/" ? u : "/" + u);
  }

  async function uploadAsset(file, dir, keepName) {
    var m = /\.([a-z0-9]+)$/i.exec(file.name || "");
    var ext = m ? m[1].toLowerCase() : "svg";
    if (["svg", "png", "jpg", "jpeg", "webp"].indexOf(ext) < 0) {
      throw new Error("仅支持 SVG / PNG / JPG / WEBP");
    }
    if (file.size > 3 * 1024 * 1024) throw new Error("文件不能超过 3MB");
    var q = "?ext=" + encodeURIComponent(ext);
    if (dir) q += "&dir=" + encodeURIComponent(dir);
    // 容器图标保留原文件名：App 以文件名作为容器 id，删除/覆盖都按它对应
    if (keepName) q += "&name=" + encodeURIComponent(file.name || "");
    var res = await fetch(state.api + "/admin/assets" + q, {
      method: "POST",
      headers: {
        "Authorization": "Bearer " + state.token,
        "Content-Type": "application/octet-stream",
      },
      body: file,
    });
    var data = null;
    try { data = await res.json(); } catch (_) {}
    if (res.status === 401) { logout(); throw new Error("登录已过期，请重新登录"); }
    if (!res.ok) {
      var msg = (data && (data.message || (data.error && data.error.message))) || ("HTTP " + res.status);
      throw new Error(msg);
    }
    return data.url;
  }

  /* ---------------- 登录 / 退出 ---------------- */
  function showLogin() {
    $("loginView").classList.remove("hidden");
    $("app").classList.add("hidden");
    $("apiBase").value = state.api;
  }

  function logout() {
    state.token = "";
    state.tab = "beverages";
    state.page = 1;
    state.categories = [];
    localStorage.removeItem(LS_TOKEN);
    localStorage.removeItem(LS_USER);
    showLogin();
  }

  async function doLogin(e) {
    e.preventDefault();
    var btn = $("loginBtn");
    $("loginErr").textContent = "";
    var apiBase = $("apiBase").value.trim().replace(/\/+$/, "");
    if (!apiBase) { $("loginErr").textContent = "请填写 API 地址"; return; }
    state.api = apiBase;
    localStorage.setItem(LS_API, state.api);
    btn.disabled = true;
    btn.textContent = "登录中…";
    try {
      var data = await api("/admin/login", {
        method: "POST",
        body: JSON.stringify({
          email: $("email").value.trim(),
          password: $("password").value,
        }),
      });
      state.token = data.accessToken;
      localStorage.setItem(LS_TOKEN, state.token);
      localStorage.setItem(LS_USER, data.userId || "");
      localStorage.setItem(LS_EMAIL, data.email || "");
      // 重新登录总是回到饮品库，避免上次页面接口异常导致循环跳登录
      state.tab = "beverages";
      state.page = 1;
      enterApp();
    } catch (err) {
      $("loginErr").textContent = err.message || "登录失败";
    } finally {
      btn.disabled = false;
      btn.textContent = "登录";
    }
  }

  function renderWho() {
    var email = localStorage.getItem(LS_EMAIL) || "";
    var uid = localStorage.getItem(LS_USER) || "";
    $("whoami").textContent = "已登录：" + (email || uid || "—");
  }

  function enterApp() {
    $("loginView").classList.add("hidden");
    $("app").classList.remove("hidden");
    $("apiHint").textContent = state.api;
    renderWho();
    switchTab(state.tab);
  }

  /* ---------------- 账号安全：修改邮箱 / 密码 ---------------- */
  async function openAccountModal() {
    var currentEmail = localStorage.getItem(LS_EMAIL) || "";
    try {
      var info = await api("/admin/account");
      currentEmail = info.email || currentEmail;
      localStorage.setItem(LS_EMAIL, currentEmail);
      renderWho();
    } catch (err) {
      // 取不到就用本地缓存邮箱继续，保存时会由服务端校验
    }

    openModal(
      "账号安全",
      '<div class="form-grid">' +
        '<div class="full"><label>登录邮箱</label><input id="a_email" value="' + esc(currentEmail) + '" /></div>' +
        '<div class="full"><label>当前密码</label><input id="a_old" type="password" autocomplete="current-password" /></div>' +
        '<div class="full"><label>新密码（留空表示不修改）</label><input id="a_new" type="password" autocomplete="new-password" /></div>' +
        '<div class="full"><label>确认新密码</label><input id="a_new2" type="password" autocomplete="new-password" /></div>' +
        '<div class="full" style="font-size:12px;opacity:.7;">修改密码后，其他设备上的登录态会失效，当前设备保持登录。</div>' +
      "</div>",
      async function () {
        var email = $("a_email").value.trim();
        var oldPwd = $("a_old").value;
        var newPwd = $("a_new").value;
        var newPwd2 = $("a_new2").value;
        if (!email) throw new Error("请填写登录邮箱");
        if (!oldPwd) throw new Error("请输入当前密码");
        if (newPwd || newPwd2) {
          if (newPwd.length < 8) throw new Error("新密码至少 8 位");
          if (newPwd !== newPwd2) throw new Error("两次输入的新密码不一致");
        }
        var dto = { currentPassword: oldPwd, email: email };
        if (newPwd) dto.newPassword = newPwd;
        var res = await api("/admin/account", {
          method: "PATCH",
          body: JSON.stringify(dto),
        });
        localStorage.setItem(LS_EMAIL, res.email || email);
        renderWho();
        closeModal();
        toast("账号信息已更新");
      }
    );
  }

  /* ---------------- 导航 ---------------- */
  var TITLES = {
    beverages: "饮品库",
    categories: "饮品分类",
    icons: "容器图标库",
    characters: "角色素材",
    users: "用户列表",
    plans: "会员套餐",
    orders: "订单查询",
  };

  function switchTab(tab) {
    state.tab = tab;
    state.page = 1;
    $("pageTitle").textContent = TITLES[tab];
    document.querySelectorAll(".nav-btn").forEach(function (b) {
      b.classList.toggle("active", b.dataset.tab === tab);
    });
    render();
  }

  async function render() {
    var view = $("view");
    view.innerHTML = '<div class="card"><div class="empty">加载中…</div></div>';
    try {
      if (state.tab === "beverages") await renderBeverages();
      else if (state.tab === "categories") await renderCategories();
      else if (state.tab === "icons") await renderIcons();
      else if (state.tab === "characters") await renderCharacters();
      else if (state.tab === "users") await renderUsers();
      else if (state.tab === "plans") await renderPlans();
      else await renderOrders();
    } catch (err) {
      view.innerHTML = '<div class="card"><div class="empty">' + esc(err.message) + "</div></div>";
    }
  }

  function tableWrap(headers, rows) {
    if (!rows.length) return '<div class="card"><div class="empty">暂无数据</div></div>';
    var html = '<div class="card"><table><thead><tr>';
    headers.forEach(function (h) { html += "<th>" + esc(h) + "</th>"; });
    html += "</tr></thead><tbody>";
    rows.forEach(function (r) {
      html += "<tr>";
      r.forEach(function (cell) { html += "<td>" + cell + "</td>"; });
      html += "</tr>";
    });
    return html + "</tbody></table></div>";
  }

  function pager() {
    return '<div class="pager">' +
      '<button class="btn ghost sm" id="prevPage" ' + (state.page <= 1 ? "disabled" : "") + ">上一页</button>" +
      "<span>第 " + state.page + " 页</span>" +
      '<button class="btn ghost sm" id="nextPage" ' + (state.rows.length < state.pageSize ? "disabled" : "") + ">下一页</button>" +
      "</div>";
  }

  function bindPager() {
    var prev = $("prevPage"), next = $("nextPage");
    if (prev) prev.onclick = function () { state.page--; render(); };
    if (next) next.onclick = function () { state.page++; render(); };
  }

  /* ---------------- 饮品库 ---------------- */
  // 内置饮品图标：与 App 饮品页同款容器剪影（containers/<id>_user.svg），
  // 渲染时按液体色填充；后台新增分类按基础分类回退
  var PRESET_CONTAINERS = {
    water_pure: "water_pure_user", tea: "tea_user", coffee: "coffee_user",
    milk_milk: "milk_milk_user", milk_tea: "milk_tea_user", milk_juice: "milk_juice_user",
    soda: "soda_user", soup_porridge: "soup_porridge_user", soup_chicken: "soup_chicken_user",
    alcohol_beer: "alcohol_beer_user", alcohol_wine: "alcohol_wine_user",
    alcohol_spirits: "alcohol_spirits_user",
  };
  var BASE_CONTAINERS = {
    water: "water_pure_user", tea: "tea_user", coffee: "coffee_user",
    milk: "milk_milk_user", milkTea: "milk_tea_user", juice: "milk_juice_user",
    soda: "soda_user", soup: "soup_porridge_user", alcohol: "alcohol_beer_user",
  };
  var BASE_COLORS = {
    water: "#4FC3F7", tea: "#C79A5B", coffee: "#6B3E2E", milk: "#C8CDD0",
    milkTea: "#A8723C", juice: "#FFB300", soda: "#C9364F", soup: "#E9D8B4",
    alcohol: "#F0B429",
  };

  function containerName(b, categoryCode) {
    var id = String(b.id || "");
    if (PRESET_CONTAINERS[id]) return PRESET_CONTAINERS[id];
    var code = categoryCode || b.category || "";
    return BASE_CONTAINERS[code] || BASE_CONTAINERS[b.baseCategory] || BASE_CONTAINERS.water;
  }

  function liquidColor(b, categoryCode) {
    return b.liquidColor || b.categoryColor ||
      BASE_COLORS[categoryCode || b.category] || BASE_COLORS[b.baseCategory] || "#4FC3F7";
  }

  /// 容器剪影着色渲染（mask + 液体色）
  function containerIconHtml(b, px, categoryCode) {
    var url = assetUrl("/static/preset/containers/" + containerName(b, categoryCode) + ".svg");
    var fill = liquidColor(b, categoryCode);
    var inner = Math.round(px * 0.74);
    return '<span class="icon-tile" style="width:' + px + "px;height:" + px + 'px;" title="内置图标">' +
      '<i style="display:block;width:' + inner + "px;height:" + inner + "px;background:" + esc(fill) + ";" +
      "filter:drop-shadow(0 0 1px rgba(0,0,0,.28));" +
      "-webkit-mask:url('" + esc(url) + "') center/contain no-repeat;" +
      "mask:url('" + esc(url) + "') center/contain no-repeat;\"></i></span>";
  }

  function uploadedIconHtml(url, px) {
    var inner = Math.round(px * 0.8);
    return '<span class="icon-tile" style="width:' + px + "px;height:" + px + 'px;background:rgba(0,0,0,.28);" title="已上传图标">' +
      '<img src="' + esc(assetUrl(url)) + '" alt="" style="width:' + inner + "px;height:" + inner + 'px;" /></span>';
  }

      "</div>",
      async function () {
        var dto = {
          name: $("f_name").value.trim(),
          category: $("f_category").value,
          defaultMl: Number($("f_ml").value),
          hydrationRatio: Number($("f_ratio").value),
          sort: Number($("f_sort").value),
          memberOnly: $("f_member").checked,
          isPublished: $("f_pub").checked,
          iconUrl: $("f_icon").value.trim(),
          liquidColor: $("f_color").value.trim(),
        };

        if (isEdit) await api("/beverages/" + item.id, { method: "PATCH", body: JSON.stringify(dto) });
        else await api("/beverages", { method: "POST", body: JSON.stringify(dto) });

    // 未上传图标时预览内置容器剪影（按分类 + 液体色着色），与客户端展示一致
    function syncPreview() {
      var u = iconInput.value.trim();
      if (!u) {
        var code = catSelect.value;
        var cat = null;
        cats.forEach(function (c) { if (c.code === code) cat = c; });
        preview.innerHTML = containerIconHtml(
          {
            id: isEdit ? item.id : "",
            category: code,
            baseCategory: cat ? cat.baseCategory : "",
            liquidColor: colorInput.value.trim(),
            categoryColor: cat ? cat.color : "",
          },
          56,
          code
        );
        hint.style.display = "";
        hint.textContent = "当前为内置图标（与客户端一致），可上传或填写地址替换";
        return;
      }
      preview.innerHTML = uploadedIconHtml(u, 56);
      hint.style.display = "none";

    iconInput.oninput = syncPreview;
    catSelect.onchange = syncPreview;
    colorInput.oninput = syncPreview;
    syncPreview();

      var file = this.files && this.files[0];
      this.value = "";
      if (!file) return;
      try {
        toast("上传中…");
        iconInput.value = await uploadAsset(file);
        syncPreview();
        toast("已上传，保存后生效");
      } catch (err) {
        toast(err.message || "上传失败");
      }
    };
  }

  function characterModal(item) {
    var isEdit = !!item;
    item = item || { code: "", name: "", categoryCode: state.charCategory || "daily", assetUrl: "", thumbnailUrl: "", memberOnly: false, sort: 0, isPublished: true };
    var catOpts = (state.charCategories || []).map(function (c) {
      return '<option value="' + esc(c.code) + '"' +
        (c.code === (item.categoryCode || "daily") ? " selected" : "") + ">" +
        esc(c.name) + "（" + esc(c.code) + "）</option>";
    }).join("");
    openModal(
      (isEdit ? "编辑角色" : "新增角色"),
      '<div class="form-grid">' +
        '<div><label>code</label><input id="c_code" value="' + esc(item.code) + '" placeholder="llama" /></div>' +
        '<div><label>名称</label><input id="c_name" value="' + esc(item.name) + '" /></div>' +
        '<div class="full"><label>分类</label><select id="c_category">' + catOpts + "</select></div>" +
        '<div class="full"><label>素材地址 (assetUrl)</label><input id="c_asset" value="' + esc(item.assetUrl) + '" placeholder="https://…/llama.png" /></div>' +
        '<div class="full"><label>缩略图地址 (thumbnailUrl)</label><input id="c_thumb" value="' + esc(item.thumbnailUrl || "") + '" /></div>' +
        '<div><label>排序</label><input id="c_sort" type="number" value="' + esc(item.sort) + '" /></div>' +
        '<div class="check"><input id="c_member" type="checkbox"' + (item.memberOnly ? " checked" : "") + ' /><label style="margin:0">会员专属</label></div>' +
        '<div class="check"><input id="c_pub" type="checkbox"' + (item.isPublished ? " checked" : "") + ' /><label style="margin:0">发布到客户端</label></div>' +
      "</div>",
      async function () {
        var dto = {
          code: $("c_code").value.trim(),
          name: $("c_name").value.trim(),
          categoryCode: $("c_category").value || "daily",
          assetUrl: $("c_asset").value.trim(),
          thumbnailUrl: $("c_thumb").value.trim() || null,
          sort: Number($("c_sort").value),
          memberOnly: $("c_member").checked,
          isPublished: $("c_pub").checked,
        };
        if (!dto.code || !dto.name || !dto.assetUrl) throw new Error("code / 名称 / 素材地址 必填");
        if (isEdit) await api("/characters/" + item.id, { method: "PATCH", body: JSON.stringify(dto) });
        else await api("/characters", { method: "POST", body: JSON.stringify(dto) });
        closeModal();
        toast(isEdit ? "已保存" : "已新增");
        render();
      }
    );
  }

  async function removeCharacter(id) {
    if (!confirm("确认删除该角色？")) return;
    try {
      await api("/characters/" + id, { method: "DELETE" });
      toast("已删除");
      render();
    } catch (err) { toast(err.message); }
  }

  /* ---------------- 用户列表 ---------------- */
  function memberCell(u) {
    if (u.membershipPermanent) return '<span class="tag gold">永久会员</span>';
    var exp = u.membershipExpireAt ? Date.parse(u.membershipExpireAt) : NaN;
    if (Number.isFinite(exp) && exp > Date.now()) {
      return '<span class="tag on">会员至 ' + esc(u.membershipExpireAt.slice(0, 10)) + "</span>";
    }
    return '<span class="tag off">非会员</span>';
  }

  async function renderUsers() {
    var qs = "/user?page=" + state.page + "&pageSize=" + state.pageSize;
    if (state.userQuery) qs += "&q=" + encodeURIComponent(state.userQuery);
    var rows = await api(qs);
    state.rows = Array.isArray(rows) ? rows : [];
    var body = state.rows.map(function (u) {
      return [
        "<b>" + esc(u.nickname || "未命名") + "</b>",
        esc(u.email || "-"),
        esc(u.phone || "-"),
        esc(u.gender || "-"),
        u.weightKg != null ? esc(u.weightKg) + " kg" : "-",
        u.heightCm != null ? esc(u.heightCm) + " cm" : "-",
        esc(u.dailyGoalMl) + " ml",
        memberCell(u),
        esc((u.createdAt || "").slice(0, 10)),
        '<button class="btn ghost sm" data-member="' + esc(u.id) + '">设置会员</button>',
      ];
    });
    $("view").innerHTML =
      '<div class="toolbar">' +
        '<input id="userQuery" placeholder="搜索昵称 / 邮箱 / ID" value="' + esc(state.userQuery) + '" />' +
        '<button class="btn ghost" id="queryUsers">搜索</button>' +
        '<button class="btn ghost" id="resetUsers">重置</button>' +
        '<div class="grow"></div>' +
        '<span class="api-hint">会员到期后客户端自动回退为免费版</span>' +
      "</div>" +
      tableWrap(["昵称", "邮箱", "手机", "性别", "体重", "身高", "目标", "会员", "注册日", "操作"], body) +
      pager();
    bindPager();
    $("queryUsers").onclick = function () {
      state.userQuery = $("userQuery").value.trim();
      state.page = 1;
      render();
    };
    $("userQuery").onkeydown = function (e) {
      if (e.key === "Enter") $("queryUsers").click();
    };
    $("resetUsers").onclick = function () {
      state.userQuery = "";
      state.page = 1;
      render();
    };
    document.querySelectorAll("[data-member]").forEach(function (el) {
      el.onclick = function () {
        var user = state.rows.find(function (x) { return x.id === el.dataset.member; });
        memberModal(user);
      };
    });
  }

  /// 人工赠送会员：按天数顺延，或直接设为永久
  function memberModal(user) {
    if (!user) return;
    var state_ = user.membershipPermanent
      ? "永久会员"
      : user.membershipExpireAt && Date.parse(user.membershipExpireAt) > Date.now()
        ? "会员至 " + user.membershipExpireAt.slice(0, 10)
        : "非会员";
    openModal(
      "设置会员 · " + (user.nickname || user.id),
      '<div class="form-grid">' +
        '<div class="full" style="font-size:12px;opacity:.72;">当前状态：' + esc(state_) + "</div>" +
        '<div><label>赠送天数（1-3650）</label><input id="m_days" type="number" value="30" /></div>' +
        '<div class="check"><input id="m_forever" type="checkbox"' + (user.membershipPermanent ? " checked" : "") + ' /><label style="margin:0">设为永久会员</label></div>' +
        '<div class="full" style="font-size:12px;opacity:.7;">赠送天数会从当前有效期继续顺延（已过期则从今天算起）。</div>' +
      "</div>",
      async function () {
        var dto;
        if ($("m_forever").checked) {
          dto = { permanent: true };
        } else {
          var days = Number($("m_days").value);
          if (!Number.isFinite(days) || days < 1 || days > 3650) {
            throw new Error("赠送天数需为 1-3650");
          }
          dto = { membershipDays: Math.round(days) };
        }
        await api("/user/" + encodeURIComponent(user.id), {
          method: "PATCH",
          body: JSON.stringify(dto),
        });
        closeModal();
        toast("会员状态已更新");
        render();
      }
    );
  }

  /* ---------------- 会员套餐 ---------------- */
  async function renderPlans() {
    var rows = await api("/admin/plans");
    state.rows = Array.isArray(rows) ? rows : [];
    var body = state.rows.map(function (p) {
      return [
        '<span class="mono">' + esc(p.code) + "</span>",
        "<b>" + esc(p.name) + "</b>",
        "¥" + ((p.priceCents || 0) / 100).toFixed(2),
        p.durationDays > 0 ? esc(p.durationDays) + " 天" : "永久",
        p.badge ? '<span class="tag gold">' + esc(p.badge) + "</span>" : "-",
        esc(p.sort),
        p.isPublished ? '<span class="tag on">上架</span>' : '<span class="tag off">下架</span>',
        '<button class="btn ghost sm" data-plan="' + esc(p.code) + '">编辑</button>',
      ];
    });
    $("view").innerHTML =
      '<div class="toolbar"><span class="api-hint">套餐会实时同步到 App 会员页，改价/下架后客户端下次拉取即生效</span>' +
      '<div class="grow"></div></div>' +
      tableWrap(["代码", "名称", "价格", "时长", "角标", "排序", "状态", "操作"], body);
    document.querySelectorAll("[data-plan]").forEach(function (el) {
      el.onclick = function () {
        var plan = state.rows.find(function (x) { return x.code === el.dataset.plan; });
        planModal(plan);
      };
    });
  }

  function planModal(plan) {
    if (!plan) return;
    openModal(
      "编辑套餐 · " + plan.code,
      '<div class="form-grid">' +
        '<div class="full"><label>套餐名称</label><input id="p_name" value="' + esc(plan.name) + '" /></div>' +
        '<div><label>价格（元）</label><input id="p_price" type="number" step="0.01" value="' + esc((plan.priceCents || 0) / 100) + '" /></div>' +
        '<div><label>时长（天，0 表示永久）</label><input id="p_days" type="number" value="' + esc(plan.durationDays) + '" /></div>' +
        '<div><label>角标文案</label><input id="p_badge" placeholder="如 限时优惠" value="' + esc(plan.badge || "") + '" /></div>' +
        '<div><label>排序</label><input id="p_sort" type="number" value="' + esc(plan.sort) + '" /></div>' +
        '<div class="check"><input id="p_pub" type="checkbox"' + (plan.isPublished ? " checked" : "") + ' /><label style="margin:0">上架到客户端</label></div>' +
        '<div class="full" style="font-size:12px;opacity:.7;">修改价格只影响之后的订单金额，已支付订单不会被改写。</div>' +
      "</div>",
      async function () {
        var dto = {
          name: $("p_name").value.trim(),
          priceCents: Math.round(Number($("p_price").value) * 100),
          durationDays: Number($("p_days").value),
          badge: $("p_badge").value.trim(),
          sort: Number($("p_sort").value),
          isPublished: $("p_pub").checked,
        };
        if (!dto.name) throw new Error("套餐名称不能为空");
        if (!Number.isFinite(dto.priceCents) || dto.priceCents < 0) {
          throw new Error("价格不合法");
        }
        if (!Number.isFinite(dto.durationDays) || dto.durationDays < 0) {
          throw new Error("时长需为 0-3650 天");
        }
        await api("/admin/plans/" + encodeURIComponent(plan.code), {
          method: "PATCH",
          body: JSON.stringify(dto),
        });
        closeModal();
        toast("套餐已更新");
        render();
      }
    );
  }

  /* ---------------- 订单查询 ---------------- */
  async function renderOrders() {
    var qs = "/membership/orders?page=" + state.page + "&pageSize=" + state.pageSize;
    if (state.orderStatus) qs += "&status=" + encodeURIComponent(state.orderStatus);
    if (state.orderUser) qs += "&userId=" + encodeURIComponent(state.orderUser);
    var rows = await api(qs);
    state.rows = Array.isArray(rows) ? rows : [];
    var STATUS = { pending: "待支付", paid: "已支付", cancelled: "已取消", refunded: "已退款" };
    var body = state.rows.map(function (o) {
      var st = o.status || "pending";
      return [
        '<span class="mono">' + esc(o.id) + "</span>",
        "<b>" + esc(o.user ? (o.user.nickname || o.user.email || o.user.id) : o.userId) + "</b>",
        esc(o.plan ? o.plan.name : o.planId),
        "¥" + ((o.amountCents || 0) / 100).toFixed(2),
        '<span class="tag ' + esc(st) + '">' + esc(STATUS[st] || st) + "</span>",
        esc((o.createdAt || "").replace("T", " ").slice(0, 16)),
        esc(o.paidAt ? o.paidAt.replace("T", " ").slice(0, 16) : "-"),
        st === "pending"
          ? '<button class="btn sm" data-paid="' + esc(o.id) + '">标记已支付</button>'
          : '<span class="tag off">-</span>',
      ];
    });
    $("view").innerHTML =
      '<div class="toolbar">' +
        '<select id="orderStatus">' +
          '<option value="">全部状态</option>' +
          ["pending", "paid", "cancelled", "refunded"].map(function (s) {
            return '<option value="' + s + '"' + (state.orderStatus === s ? " selected" : "") + ">" + STATUS[s] + "</option>";
          }).join("") +
        "</select>" +
        '<input id="orderUser" placeholder="按 userId 过滤" value="' + esc(state.orderUser) + '" />' +
        '<button class="btn ghost" id="queryOrders">查询</button>' +
        '<div class="grow"></div>' +
      "</div>" +
      tableWrap(["订单号", "用户", "套餐", "金额", "状态", "创建时间", "支付时间", "操作"], body) +
      pager();
    bindPager();
    $("queryOrders").onclick = function () {
      state.orderStatus = $("orderStatus").value;
      state.orderUser = $("orderUser").value.trim();
      state.page = 1;
      render();
    };
    $("orderStatus").onchange = function () {
      state.orderStatus = $("orderStatus").value;
      state.page = 1;
      render();
    };
    document.querySelectorAll("[data-paid]").forEach(function (el) {
      el.onclick = function () { markPaid(el.dataset.paid); };
    });
  }

  async function markPaid(id) {
    var tx = prompt("请输入外部交易号（Apple IAP / Google Play order id，可留空）：", "");
    if (tx === null) return;
    try {
      await api("/membership/orders/" + id + "/paid", {
        method: "PATCH",
        body: JSON.stringify({ externalTxId: tx || "manual_" + Date.now() }),
      });
      toast("已标记支付");
      render();
    } catch (err) { toast(err.message); }
  }

  /* ---------------- 弹窗 ---------------- */
  function openModal(title, bodyHtml, onSubmit) {
    var box = $("modalBox");
    box.innerHTML =
      "<h3>" + esc(title) + "</h3>" +
      bodyHtml +
      '<div class="modal-err" id="modalErr"></div>' +
      '<div class="modal-foot"><button class="btn ghost" id="modalCancel">取消</button>' +
      '<button class="btn" id="modalSave">保存</button></div>';
    $("modalMask").classList.remove("hidden");
    $("modalCancel").onclick = closeModal;
    $("modalSave").onclick = async function () {
      var btn = $("modalSave");
      $("modalErr").textContent = "";
      btn.disabled = true;
      btn.textContent = "保存中…";
      try {
        await onSubmit();
      } catch (err) {
        $("modalErr").textContent = err.message || "保存失败";
      } finally {
        btn.disabled = false;
        btn.textContent = "保存";
      }
    };
  }

  function closeModal() {
    $("modalMask").classList.add("hidden");
    $("modalBox").innerHTML = "";
  }

  /* ---------------- 启动 ---------------- */
  $("loginForm").onsubmit = doLogin;
  $("logoutBtn").onclick = logout;
  $("accountBtn").onclick = openAccountModal;
  document.querySelectorAll(".nav-btn").forEach(function (b) {
    b.onclick = function () { switchTab(b.dataset.tab); };
  });
  $("modalMask").onclick = function (e) {
    if (e.target === $("modalMask")) closeModal();
  };

  if (state.token) enterApp();
  else showLogin();
})();
</script>
</body>
</html>
