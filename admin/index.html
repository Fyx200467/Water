<!DOCTYPE html>
<html lang="zh-CN">
<head>
<meta charset="utf-8" />
<meta name="viewport" content="width=device-width, initial-scale=1" />
<title>吨吨 · 管理后台</title>
<style>
  :root {
    --bg: #f5f6f8;
    --card: #ffffff;
    --ink: #1c1c1e;
    --gray: #8e8e93;
    --line: #ececef;
    --accent: #3bb3db;
    --accent-soft: #eaf7fb;
    --danger: #e5484d;
    --gold: #d9a13b;
    --nav: #1f2430;
  }
  * { box-sizing: border-box; }
  body {
    margin: 0;
    font-family: -apple-system, BlinkMacSystemFont, "Segoe UI", "PingFang SC",
      "Microsoft YaHei", sans-serif;
    background: var(--bg);
    color: var(--ink);
  }
  .hidden { display: none !important; }
  button { font-family: inherit; cursor: pointer; }
  input, select {
    font-family: inherit;
    font-size: 13px;
    padding: 8px 10px;
    border: 1px solid var(--line);
    border-radius: 10px;
    background: #fff;
    color: var(--ink);
    outline: none;
    width: 100%;
  }
  input:focus, select:focus { border-color: var(--accent); }

  /* ---------------- 登录 ---------------- */
  .login-wrap {
    min-height: 100vh;
    display: flex;
    align-items: center;
    justify-content: center;
    background: radial-gradient(circle at 30% 20%, #dff2f9, #f5f6f8 60%);
  }
  .login-card {
    width: 380px;
    background: var(--card);
    border-radius: 22px;
    padding: 32px 28px;
    box-shadow: 0 18px 50px rgba(31, 36, 48, 0.10);
  }
  .login-card h1 { margin: 0 0 4px; font-size: 24px; }
  .login-card p.sub { margin: 0 0 22px; color: var(--gray); font-size: 13px; }
  .field { margin-bottom: 12px; }
  .field label {
    display: block;
    font-size: 12px;
    color: var(--gray);
    margin-bottom: 6px;
  }
  .btn {
    border: 0;
    border-radius: 12px;
    padding: 10px 16px;
    font-size: 14px;
    font-weight: 600;
    background: var(--accent);
    color: #fff;
  }
  .btn:disabled { opacity: .6; cursor: default; }
  .btn.ghost { background: #f1f2f5; color: var(--ink); }
  .btn.danger { background: #fdecec; color: var(--danger); }
  .btn.sm { padding: 5px 10px; font-size: 12px; border-radius: 9px; }
  .login-card .btn { width: 100%; margin-top: 8px; }
  .login-err { color: var(--danger); font-size: 12px; min-height: 16px; margin-top: 8px; }

  /* ---------------- 布局 ---------------- */
  #app { display: flex; min-height: 100vh; }
  aside {
    width: 212px;
    background: var(--nav);
    color: #cfd6e4;
    padding: 22px 14px;
    display: flex;
    flex-direction: column;
    position: sticky;
    top: 0;
    height: 100vh;
  }
  .brand { padding: 0 10px 22px; color: #fff; font-weight: 800; font-size: 18px; letter-spacing: .5px; }
  .brand span { color: var(--accent); }
  .brand small { display: block; color: #7d879b; font-size: 11px; font-weight: 400; margin-top: 3px; letter-spacing: 0; }
  .nav-btn {
    display: block;
    width: 100%;
    text-align: left;
    border: 0;
    background: transparent;
    color: #cfd6e4;
    padding: 11px 12px;
    border-radius: 11px;
    font-size: 14px;
    margin-bottom: 4px;
  }
  .nav-btn:hover { background: rgba(255,255,255,.07); }
  .nav-btn.active { background: var(--accent); color: #fff; font-weight: 600; }
  .nav-foot { margin-top: auto; font-size: 12px; color: #7d879b; }
  .nav-foot button {
    border: 0; background: rgba(255,255,255,.08); color: #cfd6e4;
    padding: 8px 12px; border-radius: 10px; width: 100%; margin-bottom: 10px;
  }
  main { flex: 1; padding: 26px 30px 40px; min-width: 0; }
  header.page {
    display: flex; align-items: flex-end; justify-content: space-between;
    margin-bottom: 18px; gap: 16px; flex-wrap: wrap;
  }
  header.page h1 { margin: 0; font-size: 22px; }
  .api-hint { font-size: 12px; color: var(--gray); }
  .toolbar { display: flex; gap: 10px; align-items: center; margin-bottom: 14px; flex-wrap: wrap; }
  .toolbar .grow { flex: 1; }
  .toolbar select, .toolbar input { width: auto; min-width: 130px; }

  .card {
    background: var(--card);
    border-radius: 16px;
    overflow: hidden;
    box-shadow: 0 6px 22px rgba(31,36,48,.05);
  }
  table { width: 100%; border-collapse: collapse; font-size: 13px; }
  th {
    text-align: left; font-size: 12px; font-weight: 600; color: var(--gray);
    padding: 12px 14px; background: #fafafb; border-bottom: 1px solid var(--line);
    white-space: nowrap;
  }
  td { padding: 11px 14px; border-bottom: 1px solid var(--line); vertical-align: middle; }
  tr:last-child td { border-bottom: 0; }
  tr:hover td { background: #fbfdfe; }
  td.mono { font-family: ui-monospace, Consolas, monospace; font-size: 11px; color: var(--gray); }
  .tag {
    display: inline-block; padding: 2px 8px; border-radius: 7px;
    font-size: 11px; font-weight: 600; background: #f1f2f5; color: #6b7280;
  }
  .tag.on { background: var(--accent-soft); color: #1d8dad; }
  .tag.off { background: #f1f2f5; color: #9aa0aa; }
  .tag.gold { background: #fff4dd; color: var(--gold); }
  .tag.paid { background: #e8f7ee; color: #1f9254; }
  .tag.pending { background: #fff4dd; color: #b07d19; }
  .tag.cancelled, .tag.refunded { background: #f1f2f5; color: #8e8e93; }
  .tag.rejected { background: #fdecec; color: var(--danger); }
  .row-actions { display: flex; gap: 6px; }
  .empty { padding: 40px; text-align: center; color: var(--gray); font-size: 13px; }
  .pager { display: flex; justify-content: flex-end; gap: 8px; margin-top: 14px; font-size: 12px; color: var(--gray); align-items: center; }
  /* 容器图标库：表格里的图标缩略图（点击放大） */
  .icon-thumb {
    display: inline-flex; align-items: center; justify-content: center;
    width: 48px; height: 48px; border-radius: 10px; background: #f5f6f8;
  }
  .icon-thumb img {
    width: 40px; height: 40px; object-fit: contain;
    filter: drop-shadow(0 0 1px rgba(0,0,0,.45));
  }
  .icon-fname {
    font-size: 12px; color: #4b5563;
    font-family: ui-monospace, Consolas, monospace;
  }
  .swatch { display: inline-block; width: 14px; height: 14px; border-radius: 4px; vertical-align: -2px; margin-right: 6px; border: 1px solid rgba(0,0,0,.08); }
  /* 饮品图标：容器剪影 + 液体色填充，与 App 饮品页一致 */
  .icon-tile {
    display: inline-flex; align-items: center; justify-content: center;
    border-radius: 9px; overflow: hidden; vertical-align: middle;
  }
  .icon-tile img { object-fit: contain; }
  /* 饮品图标：去掉承载背景，点击放大查看 */
  .icon-btn { border: 0; background: transparent; padding: 0; display: inline-flex; cursor: zoom-in; }

  /* ---------------- 弹窗 ---------------- */
  #modalMask {
    position: fixed; inset: 0; background: rgba(20,24,32,.42);
    display: flex; align-items: center; justify-content: center; padding: 20px; z-index: 40;
  }
  .modal {
    width: 520px; max-width: 100%; max-height: 88vh; overflow: auto; background: #fff;
    border-radius: 20px; padding: 22px 24px;
  }
  .modal h3 { margin: 0 0 16px; font-size: 18px; }
  .form-grid { display: grid; grid-template-columns: 1fr 1fr; gap: 12px; }
  .form-grid .full { grid-column: 1 / -1; }
  .form-grid > div > label,
  .bev-hero-meta > div > label {
    display: block; font-size: 12px; color: var(--gray); margin-bottom: 6px;
  }
  .check { display: flex; align-items: center; gap: 8px; font-size: 13px; color: var(--ink); padding-top: 22px; }
  .check input { width: 16px; height: 16px; }
  .modal-foot { display: flex; justify-content: flex-end; gap: 10px; margin-top: 18px; }
  .modal-err { color: var(--danger); font-size: 12px; margin-top: 10px; }
  /* 饮品编辑：参考客户端添加饮品页的分区 + 色板 */
  .modal.wide { width: 880px; }
  /* 只读信息弹窗（如用户打卡明细） */
  .modal.mid { width: 720px; max-width: 100%; }
  /* 打卡数据：按天卡片（总计 KPI + 日期切换 + 当日指标/明细） */
  .day-card {
    border: 1px solid var(--line); border-radius: 16px;
    padding: 14px 16px; background: #fff; margin-bottom: 12px;
  }
  .day-head {
    display: flex; align-items: center; justify-content: space-between;
    gap: 12px; flex-wrap: wrap;
  }
  .day-title { font-size: 14px; font-weight: 600; }
  .day-sub { font-size: 12px; color: var(--gray); margin-top: 4px; }
  .day-nav { display: flex; align-items: center; gap: 8px; }
  .day-nav button {
    width: 30px; height: 30px; flex: none; padding: 0;
    border: 1px solid var(--line); border-radius: 9px;
    background: #fff; color: var(--ink); font-size: 15px; line-height: 1;
  }
  .day-nav button:disabled { opacity: .38; cursor: default; }
  .day-nav select { width: auto; min-width: 138px; }
  .metric-grid {
    display: grid; grid-template-columns: repeat(4, minmax(0, 1fr));
    gap: 10px; margin-top: 14px;
  }
  .metric { background: #f7f9fb; border-radius: 12px; padding: 10px 12px; min-width: 0; }
  .metric-label {
    font-size: 12px; color: var(--gray);
    white-space: nowrap; overflow: hidden; text-overflow: ellipsis;
  }
  .metric-value {
    font-size: 18px; font-weight: 700; margin-top: 6px; line-height: 1.15;
    white-space: nowrap; overflow: hidden; text-overflow: ellipsis;
  }
  .metric-value em { font-style: normal; font-size: 12px; font-weight: 600; color: var(--gray); margin-left: 2px; }
  .day-detail { margin-top: 14px; border-top: 1px solid var(--line); padding-top: 12px; }
  .day-detail .card { box-shadow: none; border: 1px solid var(--line); }
  .day-detail th { padding: 8px 10px; }
  .day-detail td { padding: 8px 10px; font-size: 12px; }
  .bev-hero {
    display: flex; gap: 18px; align-items: center;
    background: #f7f9fb; border-radius: 16px; padding: 14px 16px; margin-bottom: 14px;
  }
  .bev-hero-preview {
    width: 108px; height: 108px; flex: none;
    display: flex; align-items: center; justify-content: center;
  }
  .bev-hero-meta { flex: 1; min-width: 0; display: grid; gap: 10px; }
  .bev-section {
    border-top: 1px solid var(--line); padding: 12px 0 0; margin-top: 4px;
  }
  .bev-section h4 { margin: 0 0 8px; font-size: 13px; color: var(--gray); font-weight: 600; }
  /* 两列排布：把弹窗高度压到一屏内，不用上下滚动 */
  .bev-cols {
    display: grid; grid-template-columns: 1fr 1fr; gap: 0 22px;
    border-top: 1px solid var(--line); padding-top: 12px; margin-top: 4px;
  }
  .bev-cols .bev-section { border-top: 0; padding-top: 0; }
  .bev-cols > div { min-width: 0; }
  .palette-grid { display: grid; grid-template-columns: repeat(5, 40px); gap: 10px 14px; align-items: center; }
  .pdot {
    width: 38px; height: 38px; border-radius: 50%; padding: 3px; cursor: pointer;
    border: 2.5px solid transparent; box-sizing: border-box;
  }
  .pdot.selected { border-color: #1c1c1e; }
  .pdot > span {
    display: flex; align-items: center; justify-content: center;
    width: 100%; height: 100%; border-radius: 50%; color: #fff; font-size: 16px;
  }
  .palette-custom { display: flex; gap: 10px; align-items: center; }
  .palette-custom input[type="color"] { width: 44px; height: 32px; padding: 2px; flex: none; }
  .palette-custom #f_color { width: 120px; flex: none; font-family: ui-monospace, Consolas, monospace; }
  .color-label { font-size: 12px; color: var(--gray); white-space: nowrap; }

  .char-thumb { cursor: zoom-in; transition: box-shadow .15s; }
  .char-thumb:hover { box-shadow: 0 0 0 2px var(--accent), 0 4px 12px rgba(31,36,48,.18); }
  .char-preview {
    display: flex; align-items: center; justify-content: center;
    background: #f7f9fb; border-radius: 16px; padding: 18px; min-height: 260px;
  }
  .char-preview img { max-width: 100%; max-height: 52vh; object-fit: contain; }
  .nutri-line { font-size: 11px; color: var(--gray); line-height: 1.55; white-space: nowrap; }
  .nutri-line strong { color: #4b5563; font-weight: 600; }

  .benefit-grid { display: grid; grid-template-columns: 1fr 1fr; gap: 8px; }
  .bcheck {
    display: flex; align-items: center; gap: 8px; font-size: 12px;
    padding: 8px 10px; border: 1px solid var(--line); border-radius: 10px;
    background: #fafbfc; cursor: pointer;
  }
  .bcheck input { width: 14px; height: 14px; padding: 0; flex: none; accent-color: var(--accent); }
  .bcheck span { min-width: 0; overflow: hidden; text-overflow: ellipsis; white-space: nowrap; }
  .bcheck:has(input:checked) { border-color: var(--accent); background: var(--accent-soft); }

  /* ---------------- 数据看板 ---------------- */
  .kpi-grid {
    display: grid; grid-template-columns: repeat(auto-fit, minmax(176px, 1fr));
    gap: 14px; margin-bottom: 16px;
  }
  .kpi {
    background: var(--card); border-radius: 16px; padding: 15px 16px 14px;
    box-shadow: 0 6px 22px rgba(31,36,48,.05); min-width: 0;
  }
  .kpi-label { font-size: 12px; color: var(--gray); white-space: nowrap; }
  .kpi-value {
    font-size: 25px; font-weight: 700; letter-spacing: -.6px;
    margin-top: 8px; line-height: 1.1;
  }
  .kpi-value em { font-style: normal; font-size: 13px; font-weight: 600; color: var(--gray); margin-left: 3px; }
  .kpi-sub { font-size: 12px; color: var(--gray); margin-top: 8px; }
  .kpi-sub b { color: #1d8dad; font-weight: 600; }
  .chart-grid { display: grid; grid-template-columns: 1.45fr 1fr; gap: 16px; margin-bottom: 16px; }
  .chart-card {
    background: var(--card); border-radius: 16px; padding: 16px 18px 8px;
    box-shadow: 0 6px 22px rgba(31,36,48,.05); min-width: 0;
  }
  .chart-head {
    display: flex; align-items: baseline; justify-content: space-between;
    gap: 10px; flex-wrap: wrap; margin-bottom: 4px;
  }
  .chart-head h3 { margin: 0; font-size: 14px; }
  .chart-head .legend { display: flex; gap: 14px; font-size: 12px; color: var(--gray); }
  .legend i {
    display: inline-block; width: 8px; height: 8px; border-radius: 3px;
    margin-right: 5px; vertical-align: 1px;
  }
  .chart-svg { display: block; width: 100%; height: auto; }
  .stat-list { display: grid; gap: 14px; margin: 18px 0 10px; }
  .stat-row {
    display: grid; grid-template-columns: 58px 1fr auto;
    gap: 12px; align-items: center; font-size: 12px;
  }
  .stat-row .stat-name { color: #4b5563; }
  .stat-row .stat-num { text-align: right; color: var(--gray); white-space: nowrap; }
  .stat-bar { height: 8px; border-radius: 5px; background: #f1f2f5; overflow: hidden; }
  .stat-bar > span { display: block; height: 100%; border-radius: 5px; }
  .dash-note { font-size: 12px; color: var(--gray); line-height: 1.7; }
  /* 会员转化漏斗 */
  .funnel { display: grid; gap: 10px; }
  .funnel-step {
    display: grid; grid-template-columns: 88px 1fr 90px 58px;
    align-items: center; gap: 12px; font-size: 13px;
  }
  .funnel-step .funnel-label { color: #4b5563; white-space: nowrap; }
  .funnel-track { height: 22px; border-radius: 7px; background: #f1f2f5; overflow: hidden; }
  .funnel-track > span {
    display: block; height: 100%; border-radius: 7px;
    background: linear-gradient(90deg, #3bb3db, #6ccbe6);
    min-width: 2px; transition: width .2s;
  }
  .funnel-step .funnel-num { text-align: right; color: var(--ink); font-weight: 600; }
  .funnel-step .funnel-rate { text-align: right; color: var(--gray); font-size: 12px; }
  .funnel-extra { margin-top: 12px; font-size: 12px; color: var(--gray); }
  .funnel-extra b { color: #1d8dad; font-weight: 600; }
  @media (max-width: 1080px) { .chart-grid { grid-template-columns: 1fr; } }

  /* 卡片内滚动时隐藏滚动条（内容超出仍可滚动） */
  .modal, .icon-pick-grid { scrollbar-width: none; -ms-overflow-style: none; }
  .modal::-webkit-scrollbar,
  .icon-pick-grid::-webkit-scrollbar { width: 0; height: 0; display: none; }

  /* 容器图标选择：独立小卡片浮在编辑弹窗之上，不撑大主弹窗 */
  #pickerMask {
    position: fixed; inset: 0; background: rgba(20,24,32,.30);
    display: flex; align-items: center; justify-content: center; padding: 24px; z-index: 50;
  }
  .modal.picker { width: 560px; max-height: 74vh; padding: 20px 22px; }
  .icon-pick-grid {
    display: grid; grid-template-columns: repeat(auto-fill, minmax(56px, 1fr));
    gap: 10px; max-height: 46vh; overflow: auto;
    padding: 12px; background: #f7f8fa; border-radius: 12px;
  }
  .icon-pick {
    height: 56px; padding: 5px; border: 2px solid transparent; border-radius: 10px;
    background: #fff; display: flex; align-items: center; justify-content: center;
  }
  .icon-pick.selected { border-color: var(--accent); }
  .icon-pick img { width: 100%; height: 100%; object-fit: contain; filter: drop-shadow(0 0 1px rgba(0,0,0,.45)); }

  #toast {
    position: fixed; left: 50%; bottom: 30px; transform: translateX(-50%) translateY(20px);
    background: rgba(28,28,30,.92); color: #fff; padding: 10px 18px; border-radius: 12px;
    font-size: 13px; opacity: 0; pointer-events: none; transition: all .22s; z-index: 60;
  }
  #toast.show { opacity: 1; transform: translateX(-50%) translateY(0); }
</style>
</head>
<body>

<!-- 登录 -->
<div id="loginView" class="login-wrap">
  <form class="login-card" id="loginForm">
    <h1>吨吨管理后台</h1>
    <p class="sub">饮品库 · 分类 · 图标 · 角色 · 会员套餐 · 用户 · 订单</p>
    <div class="field">
      <label>API 地址</label>
      <input id="apiBase" placeholder="http://localhost:3000/api/v1" />
    </div>
    <div class="field">
      <label>管理员邮箱</label>
      <input id="email" type="email" placeholder="admin@example.com" autocomplete="username" />
    </div>
    <div class="field">
      <label>密码</label>
      <input id="password" type="password" placeholder="••••••••" autocomplete="current-password" />
    </div>
    <button class="btn" id="loginBtn" type="submit">登录</button>
    <div class="login-err" id="loginErr"></div>
    <p class="sub" style="margin-top:14px">
      本地服务首次启动会自动创建管理员：admin@example.com / admin123456，
      可用环境变量 ADMIN_EMAIL、ADMIN_PASSWORD 覆盖。
    </p>
  </form>
</div>

<!-- 主界面 -->
<div id="app" class="hidden">
  <aside>
    <div class="brand">吨吨<span>.</span><small>WaterLlama Admin</small></div>
    <button class="nav-btn" data-tab="dashboard">数据看板</button>
    <button class="nav-btn" data-tab="beverages">饮品库</button>
    <button class="nav-btn" data-tab="categories">饮品分类</button>
    <button class="nav-btn" data-tab="icons">容器图标库</button>
    <button class="nav-btn" data-tab="characters">角色库</button>
    <button class="nav-btn" data-tab="charcats">角色分类</button>
    <button class="nav-btn" data-tab="users">用户列表</button>
    <button class="nav-btn" data-tab="plans">会员套餐</button>
    <button class="nav-btn" data-tab="orders">订单查询</button>
    <button class="nav-btn" data-tab="tips">贴士卡</button>
    <button class="nav-btn" data-tab="releases">版本发布</button>
    <button class="nav-btn" data-tab="feedback">用户反馈</button>
    <button class="nav-btn" data-tab="errors">异常上报</button>
    <div class="nav-foot">
      <div id="whoami" style="margin-bottom:8px;word-break:break-all;"></div>
      <button id="accountBtn" style="margin-bottom:6px;">账号安全</button>
      <button id="logoutBtn">退出登录</button>
    </div>
  </aside>
  <main>
    <header class="page">
      <h1 id="pageTitle">饮品库</h1>
      <div class="api-hint" id="apiHint"></div>
    </header>
    <div id="view"></div>
  </main>
</div>

<div id="modalMask" class="hidden"><div class="modal" id="modalBox"></div></div>
<div id="pickerMask" class="hidden"><div class="modal picker" id="pickerBox"></div></div>
<div id="toast"></div>

<script>
(function () {
  "use strict";

  var LS_API = "wl_admin_api";
  var LS_TOKEN = "wl_admin_token";
  var LS_USER = "wl_admin_user";
  var LS_EMAIL = "wl_admin_email";

  var state = {
    token: localStorage.getItem(LS_TOKEN) || "",
    api: localStorage.getItem(LS_API) ||
      (location.protocol.indexOf("http") === 0
        ? location.origin + "/api/v1"
        : "http://localhost:3000/api/v1"),
    tab: "dashboard",
    page: 1,
    pageSize: 20,
    statDays: 30,
    orderStatus: "",
    orderUser: "",
    userQuery: "",
    charCategory: "",
    charCategories: [],
    benefitDict: [],
    beverageCategory: "",
    beverageAll: [],
    rows: [],
  };

  var esc = function (v) {
    return String(v == null ? "" : v)
      .replace(/&/g, "&amp;").replace(/</g, "&lt;")
      .replace(/>/g, "&gt;").replace(/"/g, "&quot;");
  };

  function toast(msg) {
    var el = $("toast");
    el.textContent = msg;
    el.classList.add("show");
    clearTimeout(el._t);
    el._t = setTimeout(function () { el.classList.remove("show"); }, 2200);

  async function api(path, opts) {
    opts = opts || {};
    var headers = { "Content-Type": "application/json" };
    if (state.token) headers["Authorization"] = "Bearer " + state.token;
    var res;
    try {
      res = await fetch(state.api + path, Object.assign({}, opts, { headers: headers }));
    } catch (e) {
      throw new Error("无法连接后端：" + state.api);
    }
    var text = await res.text();
    var data = null;
    try { data = text ? JSON.parse(text) : null; } catch (_) { data = text; }
    if (res.status === 401) {
      var em = (data && data.error && data.error.message) || "";
      if (state.token) {
        logout();
        throw new Error("登录已过期，请重新登录");
      }
      throw new Error(em || "邮箱或密码错误");
    }
    if (!res.ok) {
      var msg = (data && data.error && data.error.message) || ("HTTP " + res.status);
      if (Array.isArray(msg)) msg = msg.join("; ");
      throw new Error(msg);
    }
    return data;
  }

  /* ---------------- 素材地址与上传 ---------------- */
  // 后端 API 前缀是 /api/v1，静态素材挂在根路径 /static/*，这里换算出资源根地址
  function assetOrigin() {
    return state.api.replace(/\/api\/v\d+\/?$/i, "");
  }

  function assetUrl(u) {
    if (!u) return "";
    if (/^https?:\/\//i.test(u)) return u;
    return assetOrigin() + (u.charAt(0) === "/" ? u : "/" + u);
  }

  async function uploadAsset(file, dir, keepName) {
    var m = /\.([a-z0-9]+)$/i.exec(file.name || "");
    var ext = m ? m[1].toLowerCase() : "svg";
    if (["svg", "png", "jpg", "jpeg", "webp"].indexOf(ext) < 0) {
      throw new Error("仅支持 SVG / PNG / JPG / WEBP");
    }
    if (file.size > 3 * 1024 * 1024) throw new Error("文件不能超过 3MB");
    var q = "?ext=" + encodeURIComponent(ext);
    if (dir) q += "&dir=" + encodeURIComponent(dir);
    // 容器图标保留原文件名：App 以文件名作为容器 id，删除/覆盖都按它对应
    if (keepName) q += "&name=" + encodeURIComponent(file.name || "");
    var res = await fetch(state.api + "/admin/assets" + q, {
      method: "POST",
      headers: {
        "Authorization": "Bearer " + state.token,
        "Content-Type": "application/octet-stream",
      },
      body: file,
    });
    var data = null;
    try { data = await res.json(); } catch (_) {}
    if (res.status === 401) { logout(); throw new Error("登录已过期，请重新登录"); }
    if (!res.ok) {
      var msg = (data && (data.message || (data.error && data.error.message))) || ("HTTP " + res.status);
      throw new Error(msg);
    }
    return data.url;
  }

  var fmtInt = function (v) { return Number(v || 0).toLocaleString("zh-CN"); };

  /// 让纵轴最大值落在整齐刻度上（4 条网格线）
  function niceCeil(v) {
    if (!v || v <= 4) return 4;
    var mag = Math.pow(10, Math.floor(Math.log10(v)));
    var steps = [1, 2, 2.5, 5, 10];
    for (var i = 0; i < steps.length; i++) {
      var step = steps[i] * mag / 4;
      if (step * 4 >= v) return step * 4;
    }
    return v;
  }

  /// 通用趋势图：多序列折线，或单序列柱状；纯内联 SVG，自适应容器宽度
  function trendChart(labels, series, opt) {
    opt = opt || {};
    var W = 780;
    var H = opt.height || 200;
    var L = 44, R = 10, T = 14, B = 24;
    var iw = W - L - R, ih = H - T - B;
    var max = 1;
    series.forEach(function (s) {
      s.values.forEach(function (v) { if (Number(v) > max) max = Number(v); });
    });
    max = niceCeil(max);
    var n = Math.max(2, labels.length);
    var band = iw / n;
    var lineStep = iw / Math.max(1, n - 1);
    var xAt = function (i) {
      return opt.bar ? L + band * (i + 0.5) : L + lineStep * i;
    };
    var yAt = function (v) { return T + ih - (Math.max(0, Number(v) || 0) / max) * ih; };

    var out = '<svg class="chart-svg" viewBox="0 0 ' + W + " " + H + '" role="img">';
    for (var g = 0; g <= 4; g++) {
      var val = max * g / 4;
      var y = yAt(val);
      out += '<line x1="' + L + '" y1="' + y + '" x2="' + (W - R) + '" y2="' + y +
        '" stroke="#eef0f3" stroke-width="1" />';
      out += '<text x="' + (L - 8) + '" y="' + (y + 3.5) +
        '" text-anchor="end" font-size="10" fill="#9aa0aa">' +
        esc(opt.tick ? opt.tick(val) : fmtInt(Math.round(val))) + "</text>";
    }
    var every = Math.ceil(labels.length / 6);
    labels.forEach(function (lb, i) {
      if (i % every !== 0 && i !== labels.length - 1) return;
      out += '<text x="' + xAt(i) + '" y="' + (H - 6) +
        '" text-anchor="middle" font-size="10" fill="#9aa0aa">' + esc(lb) + "</text>";
    });

    if (opt.bar) {
      var bw = Math.min(26, band * 0.6);
      series[0].values.forEach(function (v, i) {
        var h = T + ih - yAt(v);
        if (h <= 0) return;
        out += '<rect x="' + (xAt(i) - bw / 2) + '" y="' + yAt(v) +
          '" width="' + bw + '" height="' + Math.max(2, h) + '" rx="4" fill="' +
          series[0].color + '" />';
      });
    } else {
      series.forEach(function (s) {
        var pts = s.values.map(function (v, i) { return xAt(i) + "," + yAt(v); });
        if (s.fill && pts.length) {
          out += '<polygon points="' + xAt(0) + "," + (T + ih) + " " + pts.join(" ") +
            " " + xAt(pts.length - 1) + "," + (T + ih) + '" fill="' + s.color +
            '" opacity=".07" />';
        }
        out += '<polyline fill="none" stroke="' + s.color + '" stroke-width="2.4"' +
          ' stroke-linejoin="round" stroke-linecap="round" points="' + pts.join(" ") + '" />';
        var last = pts[pts.length - 1] || "";
        var xy = last.split(",");
        if (xy.length === 2) {
          out += '<circle cx="' + xy[0] + '" cy="' + xy[1] + '" r="3.4" fill="#fff"' +
            ' stroke="' + s.color + '" stroke-width="2.2" />';
        }
      });
    }
    return out + "</svg>";
  }

  /* ---------------- 饮品库 ---------------- */
  // 内置饮品图标：与 App 饮品页同款容器剪影（containers/<id>_user.svg），
  // 渲染时按液体色填充；后台新增分类按基础分类回退
  var PRESET_CONTAINERS = {
    water_pure: "water_pure_user", tea: "tea_user", coffee: "coffee_user",
    milk_milk: "milk_milk_user", milk_tea: "milk_tea_user", milk_juice: "milk_juice_user",
    soda: "soda_user", soup_porridge: "soup_porridge_user", soup_chicken: "soup_chicken_user",
    alcohol_beer: "alcohol_beer_user", alcohol_wine: "alcohol_wine_user",
    alcohol_spirits: "alcohol_spirits_user",
  };
  var BASE_CONTAINERS = {
    water: "water_pure_user", tea: "tea_user", coffee: "coffee_user",
    milk: "milk_milk_user", milkTea: "milk_tea_user", juice: "milk_juice_user",
    soda: "soda_user", soup: "soup_porridge_user", alcohol: "alcohol_beer_user",
  };
  var BASE_COLORS = {
    water: "#4FC3F7", tea: "#C79A5B", coffee: "#6B3E2E", milk: "#C8CDD0",
    milkTea: "#A8723C", juice: "#FFB300", soda: "#C9364F", soup: "#E9D8B4",
    alcohol: "#F0B429",
  };
  // 与客户端 drink_color_screen.dart 的预设色板保持一致
  var DRINK_COLOR_PRESETS = [
    "#E4E4E9", "#F7CE46", "#F2994A", "#F178B6", "#D7264D",
    "#6FCF97", "#56CCF2", "#9B51E0", "#8D6E63", "#2F3A4F",
    "#4A90F4", "#C6E837", "#B05C33",
  ];

  function containerName(b, categoryCode) {
    var id = String(b.id || "");
    if (PRESET_CONTAINERS[id]) return PRESET_CONTAINERS[id];
    var code = categoryCode || b.category || "";
    return BASE_CONTAINERS[code] || BASE_CONTAINERS.water;
  }

  function liquidColor(b, categoryCode) {
    return b.liquidColor || b.categoryColor ||
      BASE_COLORS[categoryCode || b.category] || "#4FC3F7";
  }

  /// 容器剪影着色渲染（mask + 液体色）
  function containerIconHtml(b, px, categoryCode) {
    var url = assetUrl("/static/preset/containers/" + containerName(b, categoryCode) + ".svg");
    var fill = liquidColor(b, categoryCode);
    var inner = Math.round(px * 0.74);
    return '<span class="icon-tile" style="width:' + px + "px;height:" + px + 'px;" title="内置图标">' +
      '<i style="display:block;width:' + inner + "px;height:" + inner + "px;background:" + esc(fill) + ";" +
      "filter:drop-shadow(0 0 1px rgba(0,0,0,.28));" +
      "-webkit-mask:url('" + esc(url) + "') center/contain no-repeat;" +
      "mask:url('" + esc(url) + "') center/contain no-repeat;\"></i></span>";
  }

  /// 云端图标：SVG 剪影按液体色着色（与客户端一致），位图原样显示
  function uploadedIconHtml(url, px, fill) {
    var inner = Math.round(px * 0.86);
    var box = "width:" + px + "px;height:" + px + "px;";
    if (fill && /\.svg(\?|#|$)/i.test(url || "")) {
      return '<span class="icon-tile" style="' + box + '" title="云端图标（按液体色着色）">' +
        '<i style="display:block;width:' + inner + "px;height:" + inner + "px;background:" + esc(fill) + ";" +
        "filter:drop-shadow(0 0 1px rgba(0,0,0,.28));" +
        "-webkit-mask:url('" + esc(assetUrl(url)) + "') center/contain no-repeat;" +
        "mask:url('" + esc(assetUrl(url)) + "') center/contain no-repeat;\"></i></span>";
    }
    return '<span class="icon-tile" style="' + box + '" title="云端图标">' +
      '<img src="' + esc(assetUrl(url)) + '" alt="" style="width:' + inner + "px;height:" + inner + 'px;" /></span>';
  }

  function beverageIconCell(b, px) {
    var size = px || 46;
    return b.iconUrl ? uploadedIconHtml(b.iconUrl, size, liquidColor(b)) : containerIconHtml(b, size);
  }

  /// 图标放大查看：点列表里的图标弹出大图
  function previewBeverageIcon(b) {
    openModal(
      "图标预览 · " + b.name,
      '<div style="display:flex;flex-direction:column;align-items:center;gap:10px;padding:12px 0 6px;">' +
        beverageIconCell(b, 220) +
        '<div class="api-hint">' + esc(b.categoryName || b.category) + " · " +
          (b.iconUrl ? "云端图标（SVG 按液体色着色）" : "内置容器剪影（按液体色着色）") + "</div>" +
      "</div>",
      async function () {}
    );
    var save = $("modalSave");
    if (save) save.classList.add("hidden");
    $("modalCancel").textContent = "关闭";
  }

  async function renderBeverages() {
    // 分类胶囊：分类由「饮品分类」页维护
    var cats = state.categories || [];
    try {
      cats = await api("/admin/categories");
      state.categories = Array.isArray(cats) ? cats : [];
    } catch (_) { cats = state.categories || []; }
    if (!Array.isArray(cats)) cats = [];
    if (state.beverageCategory &&
        !cats.some(function (c) { return c.code === state.beverageCategory; })) {
      state.beverageCategory = "";
    }

    // 饮品数量不大，分页循环拉全量：排序靠列表里的 ↑ ↓ 精确控制
    var all = [];
    for (var p = 1; p <= 20; p++) {
      var chunk = await api("/beverages?page=" + p + "&pageSize=100");
      if (!Array.isArray(chunk) || !chunk.length) break;
      all = all.concat(chunk);
      if (chunk.length < 100) break;
    }
    state.beverageAll = all;
    state.rows = state.beverageCategory
      ? all.filter(function (b) { return b.category === state.beverageCategory; })
      : all;

    var catName = {};
    var counts = {};
    all.forEach(function (b) {
      catName[b.category] = b.categoryName || b.category;
      counts[b.category] = (counts[b.category] || 0) + 1;
    });
    cats.forEach(function (c) {
      catName[c.code] = c.name;
      if (!counts[c.code]) counts[c.code] = 0;
    });

    var chips = [{ code: "", name: "全部", count: all.length }]
      .concat(cats.map(function (c) {
        return { code: c.code, name: c.name, count: counts[c.code] || 0 };
      }))
      .map(function (c) {
        var active = (c.code || "") === (state.beverageCategory || "");
        return '<button class="btn sm' + (active ? "" : " ghost") + '" style="margin:0;" data-bcat="' +
          esc(c.code) + '">' + esc(c.name) +
          ' <span style="opacity:.55;">' + esc(c.count) + "</span></button>";
      }).join("");

    var body = state.rows.map(function (b) {
      return [
        "<b>" + esc(b.name) + "</b>",
        '<button type="button" class="icon-btn" data-preview="' + esc(b.id) + '" title="点击放大查看">' +
          beverageIconCell(b, 46) + "</button>",
        '<span class="tag">' + esc(catName[b.category] || b.category) + "</span>",
        esc(b.defaultMl) + " ml",
        esc(b.hydrationRatio),
        b.calories == null ? "-" : esc(b.calories) + " 千卡",
        b.memberOnly ? '<span class="tag gold">会员</span>' : '<span class="tag off">免费</span>',
        esc(b.sort),
        b.isPublished ? '<span class="tag on">已发布</span>' : '<span class="tag off">草稿</span>',
        '<div class="row-actions">' +
          '<button class="btn ghost sm" data-edit="' + esc(b.id) + '">编辑</button>' +
          '<button class="btn danger sm" data-del="' + esc(b.id) + '">删除</button>' +
        "</div>",
      ];
    });

    $("view").innerHTML =
      '<div class="toolbar"><span class="api-hint">共 ' + all.length + " 个饮品" +
        (state.beverageCategory ? "，当前筛选：" + esc(catName[state.beverageCategory] || state.beverageCategory) : "") +
        "</span>" +
        '<div class="grow"></div>' +
        '<button class="btn" id="addBeverage">+ 新增饮品</button></div>' +
      '<div style="display:flex;flex-wrap:wrap;gap:8px;margin-bottom:12px;">' + chips + "</div>" +
      (body.length
        ? tableWrap(["名称", "图标", "分类", "默认容量", "折算比例", "卡路里", "权益", "排序", "状态", "操作"], body)
        : '<div class="card"><div class="empty">该分类下还没有饮品</div></div>') +
      '<div class="api-hint" style="margin-top:10px;">点图标可放大查看；排序值越小的饮品在客户端越靠前</div>';

    $("addBeverage").onclick = function () { beverageModal(null); };
    document.querySelectorAll("[data-bcat]").forEach(function (el) {
      el.onclick = function () {
        state.beverageCategory = el.dataset.bcat;
        state.page = 1;
        render();
      };
    });
    document.querySelectorAll("[data-preview]").forEach(function (el) {
      el.onclick = function () {
        var b = state.rows.find(function (x) { return x.id === el.dataset.preview; });
        if (b) previewBeverageIcon(b);
      };
    });
    document.querySelectorAll("[data-edit]").forEach(function (el) {
      el.onclick = function () {
        var item = state.rows.find(function (x) { return x.id === el.dataset.edit; });
        beverageModal(item);
      };
    });
    document.querySelectorAll("[data-del]").forEach(function (el) {
      el.onclick = function () { removeBeverage(el.dataset.del); };
    });
  }

  /// 新增饮品排序：全库最大 sort + 1，自动排到末尾
  function nextDrinkSort() {
    var max = 0;
    (state.beverageAll || []).forEach(function (b) {
      if (Number(b.sort) > max) max = Number(b.sort);
    });
    return max + 1;
  }

  async function beverageModal(item) {
    var isEdit = !!item;
    item = item || { category: "water", name: "", defaultMl: 250, hydrationRatio: 1.0, calories: null, caffeineMg: null, alcoholPercent: null, volumePreset: "regular", animation: "bubbles", memberOnly: false, sort: 0, isPublished: true, iconUrl: "", liquidColor: DRINK_COLOR_PRESETS[6] };

    var cats = state.categories || [];

      (isEdit ? "编辑饮品" : "新增饮品"),
      '<div class="bev-hero">' +
        '<div class="bev-hero-preview" id="f_preview"></div>' +
        '<div class="bev-hero-meta">' +
          '<div><label>名称</label><input id="f_name" placeholder="例如：冰美式" value="' + esc(item.name) + '" /></div>' +
          '<div class="form-grid" style="gap:10px;">' +
            "<div><label>分类</label><select id=\"f_category\">" + opts + "</select></div>" +
            '<div><label>排序</label>' +
              (isEdit
                ? '<input id="f_sort" type="number" value="' + esc(item.sort) + '" />'
                : '<input value="自动排在末尾（第 ' + nextDrinkSort() + ' 位）" readonly style="opacity:.6;" />') +
            "</div>" +
          "</div>" +
        "</div>" +
      "</div>" +

      '<div class="bev-cols">' +
        '<div class="bev-section"><h4>常用颜色</h4>' +
          '<div class="palette-grid" id="f_palette"></div>' +
          '<div class="palette-custom" style="margin-top:10px;">' +
            '<span class="color-label">自定义颜色</span>' +
            '<input id="f_color" placeholder="#4FC3F7" value="' + esc(item.liquidColor || "") + '" />' +
            '<input type="color" id="f_color_pick" value="' + esc(item.liquidColor || "#4FC3F7") + '" />' +
            '<span style="font-size:12px;opacity:.6;">支持 16 进制</span>' +
          "</div>" +
        "</div>" +

        '<div class="bev-section"><h4>容器图标</h4>' +
          '<div style="display:flex;gap:8px;align-items:center;">' +
            '<input id="f_icon" placeholder="从图标库选择" readonly value="' + esc(item.iconUrl || "") +
              '" style="flex:1;background:#f7f8fa;color:#4b5563;" />' +
            '<button type="button" class="btn ghost sm" id="f_icon_lib_btn" style="white-space:nowrap;margin:0;">从图标库选择</button>' +
          "</div>" +
          '<div id="f_icon_hint" style="font-size:12px;opacity:.7;margin-top:8px;">图标统一在「容器图标库」维护，这里只能从库中挑选</div>' +
        "</div>" +
      "</div>" +

      '<div class="bev-cols">' +
        '<div class="bev-section"><h4>容量与折算</h4><div class="form-grid">' +
          '<div><label>默认容量 (ml)</label><input id="f_ml" type="number" value="' + esc(item.defaultMl) + '" /></div>' +
          '<div><label>快捷容量档位</label><select id="f_volume">' +
            '<option value="regular"' + (item.volumePreset === "regular" ? " selected" : "") + '>常规 3 档（250/330/500）</option>' +
            '<option value="water"' + (item.volumePreset === "water" ? " selected" : "") + '>水 5 档（100/200/300/500/1000）</option>' +
          "</select></div>" +
          '<div><label>有效水折算比例</label><input id="f_ratio" type="number" step="0.01" value="' + esc(item.hydrationRatio) + '" /></div>' +
          '<div><label>液体动画</label><select id="f_anim">' +
            ["micro:微气泡", "bubbles:气泡", "ice:冰块", "rice:米粒", "leaves:茶叶", "none:无"].map(function (a) {
              var kv = a.split(":");
              return '<option value="' + kv[0] + '"' + ((item.animation || "bubbles") === kv[0] ? " selected" : "") + ">" + kv[1] + "</option>";
            }).join("") +
          "</select></div>" +
        "</div></div>" +

        '<div class="bev-section"><h4>营养信息（每 250ml，可留空）</h4><div class="form-grid">' +
          '<div><label>卡路里（千卡）</label><input id="f_cal" type="number" placeholder="留空表示未配置" value="' + esc(item.calories == null ? "" : item.calories) + '" /></div>' +
          '<div><label>咖啡因（mg）</label><input id="f_caffeine" type="number" placeholder="留空表示未配置" value="' + esc(item.caffeineMg == null ? "" : item.caffeineMg) + '" /></div>' +
          '<div><label>酒精（%vol）</label><input id="f_alcohol" type="number" placeholder="留空表示不含酒精" value="' + esc(item.alcoholPercent == null ? "" : item.alcoholPercent) + '" /></div>' +
        "</div></div>" +
      "</div>" +

      '<div class="bev-section"><h4>其他</h4><div class="form-grid">' +
        '<div class="check" style="padding-top:0;"><input id="f_member" type="checkbox"' + (item.memberOnly ? " checked" : "") + " /><label style=\"margin:0\">会员专属</label></div>" +
        '<div class="check" style="padding-top:0;"><input id="f_pub" type="checkbox"' + (item.isPublished ? " checked" : "") + " /><label style=\"margin:0\">发布到客户端</label></div>" +
      "</div></div>",
      async function () {
        var dto = {
          name: $("f_name").value.trim(),
          category: $("f_category").value,
          defaultMl: Number($("f_ml").value),
          hydrationRatio: Number($("f_ratio").value),
          calories: $("f_cal").value.trim() === "" ? null : Number($("f_cal").value),
          caffeineMg: $("f_caffeine").value.trim() === "" ? null : Number($("f_caffeine").value),
          alcoholPercent: $("f_alcohol").value.trim() === "" ? null : Number($("f_alcohol").value),
          volumePreset: $("f_volume").value,
          animation: $("f_anim").value,
          sort: isEdit ? Number($("f_sort").value) : nextDrinkSort(),
          memberOnly: $("f_member").checked,
          isPublished: $("f_pub").checked,
          iconUrl: $("f_icon").value.trim(),
          liquidColor: $("f_color").value.trim(),
        };
        if (!modalReady()) throw new Error("请先填写完整的配置信息");
        if (!dto.name) throw new Error("名称不能为空");
        if (isEdit) await api("/beverages/" + item.id, { method: "PATCH", body: JSON.stringify(dto) });
        else await api("/beverages", { method: "POST", body: JSON.stringify(dto) });
        closeModal();
        toast(isEdit ? "已保存" : "已新增");
        render();
      },
      function () { return modalReady(); }
    );

    // 弹窗加宽：参考客户端添加饮品页的「预览 + 分区」布局
    $("modalBox").classList.add("wide");

    var iconInput = $("f_icon");
    var preview = $("f_preview");
    var hint = $("f_icon_hint");
    var catSelect = $("f_category");
    var colorInput = $("f_color");
    var colorPick = $("f_color_pick");
    var palette = $("f_palette");

    // 颜色统一为 16 进制 #RRGGBB（兼容 #RGB 与不带 # 的简写）
    function normalizeHex(raw) {
      var v = String(raw || "").trim().replace(/^#/, "");
      if (/^[0-9a-fA-F]{3}$/.test(v)) {
        v = v[0] + v[0] + v[1] + v[1] + v[2] + v[2];
      }
      if (!/^[0-9a-fA-F]{6}$/.test(v)) return null;
      return "#" + v.toUpperCase();
    }

    var currentColor = normalizeHex(item.liquidColor) || DRINK_COLOR_PRESETS[6];

    // 常用色板：只放两行常用色（10 个），当前颜色高亮
    function renderPalette() {
      palette.innerHTML = DRINK_COLOR_PRESETS.slice(0, 10).map(function (c) {
        var on = c.toUpperCase() === currentColor.toUpperCase();
        return '<div class="pdot' + (on ? " selected" : "") + '" data-color="' + c + '" title="' + c + '">' +
          '<span style="background:' + c + ';color:' + (on ? "#fff" : "transparent") + ';">' +
            (on ? "✓" : "") +
          "</span></div>";
      }).join("");
    }

    // 未上传图标时预览内置容器剪影（按分类 + 液体色着色），与客户端展示一致
    function syncPreview() {
      var u = iconInput.value.trim();
      if (!u) {
        var code = catSelect.value;
        preview.innerHTML = containerIconHtml(
          {
            id: isEdit ? item.id : "",
            category: code,
            liquidColor: currentColor,
          },
          96,
          code
        );
        hint.style.display = "";
        hint.textContent = "未选图标时使用客户端内置插画；图标请从「容器图标库」挑选";
        return;
      }
      preview.innerHTML = uploadedIconHtml(u, 96, currentColor);
      hint.style.display = "none";
    }

    // 色板 / 文本框 / 取色器统一入口：同步色值、选中态与预览
    function applyColor(hex) {
      currentColor = hex;
      if (colorInput.value.toUpperCase() !== hex.toUpperCase()) colorInput.value = hex;
      if (colorPick.value.toUpperCase() !== hex.toUpperCase()) colorPick.value = hex;
      renderPalette();
      syncPreview();
    }

    colorInput.value = currentColor;
    colorPick.value = currentColor;
    renderPalette();
    palette.onclick = function (e) {
      var dot = e.target.closest("[data-color]");
      if (dot) applyColor(dot.dataset.color);
    };
    // 输入过程中只在完整 6 位时实时预览，失焦时再纠正/补全写法
    colorInput.oninput = function () {
      var v = this.value.trim().replace(/^#/, "");
      if (/^[0-9a-fA-F]{6}$/.test(v)) {
        currentColor = "#" + v.toUpperCase();
        renderPalette();
        syncPreview();
      }
    };
    colorInput.onchange = function () {
      var hex = normalizeHex(this.value);
      if (!hex) {
        this.value = currentColor;
        toast("颜色格式应为 16 进制，例如 #56CCF2");
        return;
      }
      applyColor(hex);
    };
    colorPick.oninput = function () {
      var hex = normalizeHex(this.value);
      if (hex) applyColor(hex);
    };
    iconInput.oninput = syncPreview;
    catSelect.onchange = syncPreview;
    syncPreview();

    // 从「容器图标库」挑现成图标：单独的小卡片，不改变主弹窗尺寸
    $("f_icon_lib_btn").onclick = function () {
      openIconPicker(iconInput.value.trim(), function (url) {
        iconInput.value = url;
        syncPreview();
        modalReady();
      });
    };

    // 必填项没录完：「保存」保持禁用
    function modalReady() {
      if (!$("f_name")) return false;
      var ready = $("f_name").value.trim().length > 0 &&
        !!$("f_category").value &&
        $("f_icon").value.trim().length > 0 &&
        Number($("f_ml").value) > 0 &&
        Number($("f_ratio").value) > 0 &&
        !!normalizeHex($("f_color").value) &&
        !!$("f_anim").value;
      var save = $("modalSave");
      if (save) {
        save.disabled = !ready;
        save.title = ready ? "" : "请先填写完整的配置信息";
      }
      return ready;
    }
    ["f_name", "f_category", "f_icon", "f_ml", "f_ratio", "f_color", "f_anim"].forEach(function (id) {
      var el = $(id);
      if (!el) return;
      el.addEventListener("input", modalReady);
      el.addEventListener("change", modalReady);
    });
    modalReady();
  }

  async function removeBeverage(id) {

    try {
      await api("/beverages/" + id, { method: "DELETE" });
      toast("已删除");
      render();
    } catch (err) { toast(err.message); }
  }

  /// 新增分类的排序：取现有最大 sort + 1，自动排到末尾
  function nextCatSort() {
    var max = 0;
    (state.charCategories || []).forEach(function (c) {
      if (Number(c.sort) > max) max = Number(c.sort);
    });
    return max + 1;
  }

  /// 分类上移 / 下移一位（客户端标签顺序随之变化）
  async function moveCharCategory(code, dir) {
    var cats = state.charCategories || [];
    var i = cats.findIndex(function (c) { return c.code === code; });
    if (i < 0) return;
    var other = cats[i + dir];
    if (!other) return;
    var curSort = Number(cats[i].sort);
    var newSort = dir < 0
      ? Math.min(Number(other.sort), curSort) - 1
      : Math.max(Number(other.sort), curSort) + 1;
    try {
      await api("/character-categories/" + encodeURIComponent(code), {
        method: "PATCH",
        body: JSON.stringify({ sort: newSort }),
      });
      render();
    } catch (err) { toast(err.message || "移动失败"); }
  }

      async function () {

  /// 在所属分类内上移 / 下移一位：把当前项的排序值挪到相邻项之前 / 之后
  async function moveCharacter(id, dir) {
    var cur = state.rows.find(function (x) { return x.id === id; });
    if (!cur) return;
    var sibs = state.rows.filter(function (x) { return x.categoryCode === cur.categoryCode; });
    var i = sibs.findIndex(function (x) { return x.id === id; });
    var other = sibs[i + dir];
    if (!other) return;
    var newSort = dir < 0
      ? Math.min(Number(other.sort), Number(cur.sort)) - 1
      : Math.max(Number(other.sort), Number(cur.sort)) + 1;
    try {
      await api("/characters/" + id, { method: "PATCH", body: JSON.stringify({ sort: newSort }) });
      render();
    } catch (err) { toast(err.message || "移动失败"); }
  }

  /// 用户近 30 天打卡数据：总计 KPI + 卡片内按日期切换的当日数据
  async function userEntriesModal(user) {
    if (!user) return;
    openInfoModal(
      "打卡数据 · " + (user.nickname || user.id),
      '<div class="empty">加载中…</div>',
    );
    try {
      var res = await api(
        "/admin/users/" + encodeURIComponent(user.id) + "/entries?days=30",
      );
      if ($("modalMask").classList.contains("hidden")) return;
      var s = res.summary || {};
      var goal = Number((res.user ? res.user.dailyGoalMl : user.dailyGoalMl) || 0);
      var days = res.daily || [];
      // 明细按日期分组：接口只返回最近 200 条，超出部分在界面上给出提示
      var byDate = Object.create(null);
      (res.entries || []).forEach(function (e) {
        var key = String(e.drankAt || "").slice(0, 10);
        (byDate[key] || (byDate[key] = [])).push(e);
      });

      var mini = function (label, value, unit, sub) {
        return '<div class="kpi"><div class="kpi-label">' + esc(label) + "</div>" +
          '<div class="kpi-value" style="font-size:20px">' + value +
          (unit ? "<em>" + esc(unit) + "</em>" : "") + "</div>" +
          '<div class="kpi-sub">' + sub + "</div></div>";
      };
      var metric = function (label, value, unit) {
        return '<div class="metric"><div class="metric-label">' + esc(label) + "</div>" +
          '<div class="metric-value">' + value + "<em>" + esc(unit) + "</em></div></div>";
      };

      // 日期下拉：index 0 是今天，越往后越早
      var options = days.map(function (d, i) {
        return '<option value="' + i + '">' +
          esc(d.date === res.to ? d.date.slice(5) + "（今天）" : d.date.slice(5)) +
          "</option>";
      }).join("");

      var body =
        '<div class="kpi-grid" style="grid-template-columns:repeat(2,minmax(0,1fr));gap:10px;margin-bottom:12px">' +
          mini("总打卡次数", fmtInt(s.entries) + " 次", "", esc(res.from) + " ~ " + esc(res.to)) +
          mini("总有效饮水", fmtInt(s.effectiveMl), "ml", "实际饮水 " + fmtInt(s.volumeMl) + " ml") +
          mini("达标天数", fmtInt(s.reachedDays) + " / " + fmtInt(s.activeDays), "天", "每天目标 " + fmtInt(goal) + " ml") +
          mini("日均次数", Number(s.avgPerActiveDay || 0).toFixed(2), "次", "按有打卡的天数计") +
        "</div>" +
        '<div class="day-card">' +
          '<div class="day-head">' +
            '<div><div class="day-title">按天数据</div>' +
            '<div class="day-sub">切换日期查看当天的打卡次数与有效饮水</div></div>' +
            '<div class="day-nav">' +
              '<button type="button" id="dayPrev" aria-label="前一天">‹</button>' +
              '<select id="dayPick">' + options + "</select>" +
              '<button type="button" id="dayNext" aria-label="后一天">›</button>' +
            "</div>" +
          "</div>" +
          '<div class="metric-grid" id="dayMetrics"></div>' +
          '<div class="day-detail" id="dayDetail"></div>' +
        "</div>" +
        '<div class="dash-note">吨吨ID：' + esc(user.id) +
        " · 最近打卡：" + esc(String(s.lastDrankAt || "-").replace("T", " ").slice(0, 16)) +
        " · 明细最多展示最近 200 条</div>";

      var box = $("modalBox");
      box.innerHTML =
        "<h3>打卡数据 · " + esc(user.nickname || user.id) + "</h3>" + body +
        '<div class="modal-foot"><button class="btn ghost" id="modalClose">关闭</button></div>';
      $("modalClose").onclick = closeModal;

      var pick = $("dayPick");
      var prevBtn = $("dayPrev");
      var nextBtn = $("dayNext");

      var renderDay = function (index) {
        var d = days[index];
        if (!d) return;
        pick.value = String(index);
        // 下拉列表是「今天 → 更早」，所以 index 越大日期越早
        prevBtn.disabled = index >= days.length - 1;
        nextBtn.disabled = index <= 0;

        var pct = goal > 0 ? Math.round((Number(d.effectiveMl) / goal) * 100) : 0;
        $("dayMetrics").innerHTML =
          metric("打卡次数", esc(fmtInt(d.entries)), "次") +
          metric("有效饮水", esc(fmtInt(d.effectiveMl)), "ml") +
          metric("实际饮水", esc(fmtInt(d.volumeMl)), "ml") +
          metric("完成度", esc(pct), "%");

        var list = byDate[d.date] || [];
        var header = '<div class="dash-note" style="margin:0 0 8px"><strong>' +
          esc(d.date) + "</strong> · " +
          (d.reached ? '<span class="tag on">已达标</span>' : '<span class="tag off">未达标</span>') +
          " · 目标 " + fmtInt(goal) + " ml</div>";

        var rows = list.map(function (e) {
          // 营养值口径与 App 一致：热量/咖啡因按每 250ml，酒精为 %vol
          var nutri = [];
          if (e.calories > 0) nutri.push("<strong>" + esc(e.calories) + "</strong> kcal");
          if (e.caffeineMg > 0) nutri.push("咖啡因 " + esc(e.caffeineMg) + " mg");
          if (e.alcoholPercent > 0) nutri.push("酒精 " + esc(e.alcoholPercent) + "%vol");
          return [
            esc((e.drankAt || "").replace("T", " ").slice(11, 16)),
            "<b>" + esc(e.beverageName || "-") + "</b>",
            esc(e.volumeMl) + " ml",
            esc(e.effectiveMl) + " ml",
            nutri.length
              ? nutri.map(function (t) { return '<div class="nutri-line">' + t + "</div>"; }).join("")
              : "-",
          ];
        });

        var detail = rows.length
          ? tableWrap(["时间", "饮品", "容量", "有效饮水", "营养（每 250ml）"], rows)
          : '<div class="card"><div class="empty" style="padding:22px">当天暂无打卡记录</div></div>';
        // 明细被 200 条上限截断时给出提示，避免误判为数据缺失
        if (rows.length && rows.length < Number(d.entries || 0)) {
          detail += '<div class="dash-note" style="margin-top:8px">当天共 ' +
            fmtInt(d.entries) + " 条，明细仅展示最近 " + rows.length + " 条</div>";
        }
        $("dayDetail").innerHTML = header + detail;
      };

      pick.onchange = function () { renderDay(Number(pick.value) || 0); };
      prevBtn.onclick = function () { renderDay(Math.min(days.length - 1, Number(pick.value) + 1)); };
      nextBtn.onclick = function () { renderDay(Math.max(0, Number(pick.value) - 1)); };
      renderDay(0);
    } catch (err) {
      toast(err.message || "打卡数据加载失败");
      closeModal();
    }
  }

  function tipModal(row) {
    var isEdit = !!row;
    var options = TIP_GROUPS.map(function (g) {
      return '<option value="' + g[0] + '"' +
        (isEdit && row.groupCode === g[0] ? " selected" : "") + ">" + g[1] + "</option>";
    }).join("");
    openModal(
      isEdit ? "编辑贴士卡" : "新增贴士卡",
      '<div class="form-grid">' +
        '<div><label>分组（决定在「查看全部」中的位置）</label><select id="t_group">' + options + "</select></div>" +
        '<div><label>状态</label><select id="t_pub">' +
          '<option value="1"' + (!isEdit || row.isPublished ? " selected" : "") + ">展示</option>" +
          '<option value="0"' + (isEdit && !row.isPublished ? " selected" : "") + ">隐藏</option>" +
        "</select></div>" +
        '<div class="full"><label>文案（建议 20 字以内）</label><input id="t_title" maxlength="120" value="' +
          (isEdit ? esc(row.title) : "") + '" /></div>' +
        '<div><label>背景色</label><input id="t_bg" type="color" value="' +
          (isEdit && row.bgColor ? esc(row.bgColor) : "#EAF7FB") + '" style="height:38px;padding:3px;" /></div>' +
        '<div><label>文字色</label><input id="t_fg" type="color" value="' +
          (isEdit && row.fgColor ? esc(row.fgColor) : "#3BB3DB") + '" style="height:38px;padding:3px;" /></div>' +
        '<div class="full"><label>插画地址（选填，留空显示纯色底）</label>' +
          '<div style="display:flex;gap:8px;">' +
            '<input id="t_img" placeholder="/static/xxx.png" value="' + (isEdit ? esc(row.imageUrl || "") : "") + '" />' +
            '<label class="btn ghost" style="white-space:nowrap;line-height:22px;">上传<input id="t_file" type="file" accept="image/*" style="display:none;" /></label>' +
          "</div></div>" +
      "</div>",
      async function () {
        var title = $("t_title").value.trim();
        if (!title) throw new Error("文案不能为空");
        var dto = {
          groupCode: $("t_group").value,
          title: title,
          bgColor: $("t_bg").value,
          fgColor: $("t_fg").value,
          imageUrl: $("t_img").value.trim(),
          isPublished: $("t_pub").value === "1",
        };
        if (isEdit) {
          await api("/admin/tips/" + row.id, { method: "PATCH", body: JSON.stringify(dto) });
        } else {
          await api("/admin/tips", { method: "POST", body: JSON.stringify(dto) });
        }
        closeModal();
        toast(isEdit ? "已保存" : "已新增");
        render();
      }
    );
    $("t_file").onchange = async function () {
      var file = this.files && this.files[0];
      if (!file) return;
      try {
        var saved = await uploadAsset(file, "tips");
        $("t_img").value = saved;
        toast("插画已上传");
      } catch (err) { toast(err.message); }
    };
  }

  /* ---------------- 异常上报 ---------------- */

    state.errRows = res.items || [];
    var rows = state.errRows;
    var body = rows.length
      ? tableWrap(
          ["上报时间", "用户", "版本 / 平台", "错误摘要", "操作"],
          rows.map(function (r) {
            var first = (r.message || "").split("\n")[0];
            var short = first.length > 70 ? first.slice(0, 70) + "…" : first;
            return [
              esc((r.createdAt || "").replace("T", " ").slice(0, 16)),
              esc(r.userNickname || (r.userId ? r.userId.slice(0, 8) : "游客")),
              esc((r.appVersion || "-") + " / " + (r.platform || "-")),

    $("view").innerHTML =
      '<div class="toolbar">' +

        '<div class="grow"></div>' +
        '<button class="btn ghost" id="errRefresh">刷新</button>' +
      "</div>" + body +
      (res.total > 50
        ? '<div class="toolbar" style="justify-content:center;margin-top:12px;">' +
          '<button class="btn ghost sm" id="errPrev"' + (page <= 1 ? " disabled" : "") + ">上一页</button>" +
          '<span class="api-hint">第 ' + page + " 页</span>" +
          '<button class="btn ghost sm" id="errNext"' + (page * 50 >= res.total ? " disabled" : "") + ">下一页</button>" +
          "</div>"
        : "");
    $("errRefresh").onclick = function () { render(); };
    if ($("errPrev")) $("errPrev").onclick = function () { state.errPage = page - 1; render(); };
    if ($("errNext")) $("errNext").onclick = function () { state.errPage = page + 1; render(); };

      el.onclick = function () {
        var row = state.errRows.find(function (x) { return x.id === el.dataset.err; });
        openModal(
          "异常详情",
          '<div class="api-hint" style="margin-bottom:8px;">' +

            esc(row.device || "-") + " · " + esc(row.createdAt || "") + "</div>" +
            '<pre style="max-height:52vh;overflow:auto;white-space:pre-wrap;word-break:break-all;font-size:12px;background:#fafafb;border:1px solid var(--line);border-radius:10px;padding:12px;margin:0;">' +
            esc((row.message || "") + "\n\n" + (row.stack || "无堆栈")) + "</pre>",
          async function () { closeModal(); }

        $("modalSave").style.display = "none";
        $("modalCancel").textContent = "关闭";

  function releaseModal(row) {
    var isEdit = !!row;
    openModal(
      isEdit ? "编辑版本 · " + row.versionName : "新增版本",
      '<div class="form-grid">' +
        '<div><label>平台</label><select id="r_platform"' + (isEdit ? " disabled" : "") + '>' +
          '<option value="android"' + (isEdit && row.platform === "android" ? " selected" : "") + '>Android</option>' +

        "</select></div>" +
        '<div><label>版本号</label><input id="r_name" placeholder="如 1.0.1" value="' + (isEdit ? esc(row.versionName) : "") + '" /></div>' +
        '<div><label>Build 号（递增，客户端据此判断）</label><input id="r_code" type="number" value="' + (isEdit ? esc(row.versionCode) : "") + '" /></div>' +
        '<div class="full"><label>下载地址（选填）</label><input id="r_url" placeholder="安装包或商店链接" value="' + (isEdit ? esc(row.downloadUrl || "") : "") + '" /></div>' +
        '<div class="full"><label>更新说明</label><textarea id="r_notes" rows="3" style="width:100%;padding:8px 10px;border:1px solid var(--line);border-radius:10px;font-family:inherit;font-size:13px;">' + (isEdit ? esc(row.notes || "") : "") + "</textarea></div>" +
        '<div class="check"><input id="r_force" type="checkbox"' + (isEdit && row.forceUpdate ? " checked" : "") + ' /><label style="margin:0">强制更新</label></div>' +
        '<div class="check"><input id="r_pub" type="checkbox"' + (!isEdit || row.isPublished ? " checked" : "") + ' /><label style="margin:0">启用（客户端可见）</label></div>' +
      "</div>",
      async function () {
        var dto = {
          versionName: $("r_name").value.trim(),
          versionCode: Number($("r_code").value),
          downloadUrl: $("r_url").value.trim(),
          notes: $("r_notes").value.trim(),
          forceUpdate: $("r_force").checked,
          isPublished: $("r_pub").checked,
        };
        if (!dto.versionName) throw new Error("版本号不能为空");
        if (!Number.isFinite(dto.versionCode) || dto.versionCode <= 0) {
          throw new Error("Build 号需为正整数");
        }
        if (isEdit) {
          await api("/admin/releases/" + row.id, {
            method: "PATCH",
            body: JSON.stringify(dto),
          });
        } else {
          dto.platform = $("r_platform").value;
          await api("/admin/releases", { method: "POST", body: JSON.stringify(dto) });
        }
        closeModal();
        toast(isEdit ? "版本已更新" : "版本已发布");
        render();
      }

  async function renderOrders() {
    var qs = "/membership/orders?page=" + state.page + "&pageSize=" + state.pageSize;
    if (state.orderStatus) qs += "&status=" + encodeURIComponent(state.orderStatus);
    if (state.orderUser) qs += "&userId=" + encodeURIComponent(state.orderUser);
    var rows = await api(qs);
    state.rows = Array.isArray(rows) ? rows : [];
    var STATUS = { pending: "待确认", paid: "已确认", rejected: "已拒绝", cancelled: "已取消", refunded: "已退款" };
    var body = state.rows.map(function (o) {
      var st = o.status || "pending";
      return [
        '<span class="mono">' + esc(o.id) + "</span>",
        "<b>" + esc(o.user ? (o.user.nickname || o.user.email || o.user.id) : o.userId) + "</b>",
        esc(o.plan ? o.plan.name : o.planId),
        "¥" + ((o.amountCents || 0) / 100).toFixed(2),
        '<span class="tag ' + esc(st) + '">' + esc(STATUS[st] || st) + "</span>",
        esc((o.createdAt || "").replace("T", " ").slice(0, 16)),
        esc(o.paidAt ? o.paidAt.replace("T", " ").slice(0, 16) : "-"),
        st === "pending"
          ? '<button class="btn sm" data-paid="' + esc(o.id) + '">确认并开通</button> ' +
            '<button class="btn sm danger" data-reject="' + esc(o.id) + '">拒绝</button>'
          : '<span class="tag off">-</span>',
      ];
    });
    $("view").innerHTML =
      '<div class="toolbar">' +
        '<span class="api-hint">内测阶段无真实支付：用户提交开通申请后在此确认，确认即下发会员权益，App 自动刷新生效</span>' +
        '<div class="grow"></div>' +
        '<select id="orderStatus">' +
          '<option value="">全部状态</option>' +
          ["pending", "paid", "rejected", "cancelled", "refunded"].map(function (s) {
            return '<option value="' + s + '"' + (state.orderStatus === s ? " selected" : "") + ">" + STATUS[s] + "</option>";
          }).join("") +
        "</select>" +
        '<input id="orderUser" placeholder="按 userId 过滤" value="' + esc(state.orderUser) + '" />' +
        '<button class="btn ghost" id="queryOrders">查询</button>' +
        '<div class="grow"></div>' +
      "</div>" +
      tableWrap(["订单号", "用户", "套餐", "金额", "状态", "创建时间", "支付时间", "操作"], body) +
      pager();
    bindPager();
    $("queryOrders").onclick = function () {
      state.orderStatus = $("orderStatus").value;
      state.orderUser = $("orderUser").value.trim();
      state.page = 1;
      render();

      state.page = 1;

      el.onclick = function () { rejectOrder(el.dataset.reject); };
    });

  async function rejectOrder(id) {
    var order = state.rows.find(function (x) { return x.id === id; });
    var who = order
      ? (order.user ? (order.user.nickname || order.user.email || order.user.id) : order.userId)
      : id;
    if (!confirm("拒绝「" + who + "」的开通申请？\n\n用户会收到「申请未通过」提示，可重新提交。")) return;
    try {
      await api("/membership/orders/" + id + "/reject", {
        method: "PATCH",
        body: JSON.stringify({}),
      });
      toast("已拒绝该申请");
      render();
    } catch (err) { toast(err.message); }
  }

  async function markPaid(id) {
    var order = state.rows.find(function (x) { return x.id === id; });
    var who = order
      ? (order.user ? (order.user.nickname || order.user.email || order.user.id) : order.userId)
      : id;
    var planName = order && order.plan ? order.plan.name : (order ? order.planId : "");
    var amount = order ? "¥" + ((order.amountCents || 0) / 100).toFixed(2) : "";
    if (!confirm(
      "确认「" + who + "」的开通申请？\n\n套餐：" + planName + "\n金额：" + amount +
      "\n\n确认后立即下发会员权益，操作不可撤销。"
    )) return;
    try {
      await api("/membership/orders/" + id + "/paid", {
        method: "PATCH",
        body: JSON.stringify({ externalTxId: "manual_" + Date.now() }),
      });
      toast("已确认，会员权益已下发");
      render();
    } catch (err) { toast(err.message); }
  }

  /* ---------------- 弹窗 ---------------- */
  function openModal(title, bodyHtml, onSubmit, canSubmit) {
    var box = $("modalBox");
    box.innerHTML =
      "<h3>" + esc(title) + "</h3>" +
      bodyHtml +
      '<div class="modal-err" id="modalErr"></div>' +
      '<div class="modal-foot"><button class="btn ghost" id="modalCancel">取消</button>' +
      '<button class="btn" id="modalSave">保存</button></div>';
    $("modalMask").classList.remove("hidden");
    $("modalCancel").onclick = closeModal;
    $("modalSave").onclick = async function () {
      var btn = $("modalSave");
      $("modalErr").textContent = "";
      btn.disabled = true;
      btn.textContent = "保存中…";
      try {
        await onSubmit();
      } catch (err) {
        $("modalErr").textContent = err.message || "保存失败";
      } finally {
        btn.disabled = canSubmit ? !canSubmit() : false;
        btn.textContent = "保存";
      }
    };
  }

  function closeModal() {
    closeIconPicker();
    $("modalMask").classList.add("hidden");
    $("modalBox").classList.remove("wide");
    $("modalBox").classList.remove("mid");
    $("modalBox").innerHTML = "";
  }

  /// 容器图标选择：独立小卡片浮在编辑弹窗之上，选完即关，主弹窗尺寸不变
  function openIconPicker(currentUrl, onPick) {
    var box = $("pickerBox");
    box.innerHTML = "<h3>选择容器图标</h3>" +
      '<div class="icon-pick-grid" id="pickerGrid"><div class="api-hint">加载中…</div></div>' +
      '<div class="modal-foot"><button class="btn ghost" id="pickerCancel">取消</button></div>';
    $("pickerMask").classList.remove("hidden");
    $("pickerMask").onclick = function (e) {
      if (e.target === $("pickerMask")) closeIconPicker();
    };
    $("pickerCancel").onclick = closeIconPicker;
    (async function () {
      var assets = [];
      try {
        var rows = await api("/admin/assets");
        assets = (rows || []).filter(function (a) {
          return a.name.indexOf("preset/containers/") === 0;
        });
      } catch (err) {
        toast(err.message || "图标库加载失败");
      }
      var grid = $("pickerGrid");
      if (!grid) return;
      if (!assets.length) {
        grid.style.background = "transparent";
        grid.style.padding = "0";
        grid.innerHTML = '<div class="api-hint">图标库为空，请先到「容器图标库」上传</div>';
        return;
      }
      grid.innerHTML = assets.map(function (a) {
        var on = currentUrl && currentUrl === a.url;
        return '<button type="button" class="icon-pick' + (on ? " selected" : "") +
          '" data-pick="' + esc(a.url) + '" title="' + esc(String(a.name).split("/").pop()) + '">' +
          '<img src="' + esc(assetUrl(a.url)) + '" alt="" /></button>';
      }).join("");
      grid.onclick = function (e) {
        var btn = e.target.closest("[data-pick]");
        if (!btn) return;
        var url = btn.dataset.pick;
        closeIconPicker();
        onPick(url);
      };
    })();
  }

  function closeIconPicker() {
    $("pickerMask").classList.add("hidden");
    $("pickerBox").innerHTML = "";
  }

  /* ---------------- 启动 ---------------- */
  $("loginForm").onsubmit = doLogin;
  $("logoutBtn").onclick = logout;
  $("accountBtn").onclick = openAccountModal;
  document.querySelectorAll(".nav-btn").forEach(function (b) {
    b.onclick = function () { switchTab(b.dataset.tab); };
  });
  $("modalMask").onclick = function (e) {
    if (e.target === $("modalMask")) closeModal();
  };

  // 实时刷新：停留的页面每 15 秒静默拉一次数据（弹窗 / 输入中 / 后台标签页暂停）
  setInterval(function () {
    if (!state.token) return;
    if (document.visibilityState !== "visible") return;
    if (!$("modalMask").classList.contains("hidden")) return;
    if (!$("pickerMask").classList.contains("hidden")) return;
    var el = document.activeElement;
    if (el && /^(INPUT|SELECT|TEXTAREA)$/.test(el.tagName)) return;
    var y = window.scrollY;
    render({ silent: true }).then(function () { window.scrollTo(0, y); });
  }, 15000);

  if (state.token) enterApp();
  else showLogin();
})();
</script>
</body>
</html>
