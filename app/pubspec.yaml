name: water_llama
description: "喝水养成 App - 对标 WaterLlama"
publish_to: 'none'
version: 1.0.0+1

environment:
  sdk: ^3.12.1

dependencies:
  flutter:
    sdk: flutter
  cupertino_icons: ^1.0.8

  # 状态管理
  flutter_riverpod: ^2.5.1
  riverpod_annotation: ^2.3.5

  # 路由
  go_router: ^14.2.0

  # 本地存储
  shared_preferences: ^2.3.2
  sqflite: ^2.3.3+1
  sqflite_common_ffi: ^2.3.3
  path: ^1.9.0
  path_provider: ^2.1.4

  # 工具
  intl: ^0.20.2

  # 图表（M3 起用）
  fl_chart: ^0.69.0

  # 通知（M3 起用）
  flutter_local_notifications: ^17.2.2
  timezone: ^0.9.4

  # 网络（M5 起用）
  dio: ^5.7.0
  flutter_svg: ^2.3.0
  share_plus: ^13.3.1

  # 健康同步（Apple Health / Health Connect）
  health: ^13.3.2

  # Android 桌面小组件（Home Screen Widget）
  home_widget: ^0.7.0

dependency_overrides:
  # 本地接管 home_widget：updateWidget 改为直接同步调用 provider.onUpdate
  # （不经广播），规避 vivo 等厂商 ROM 对后台应用广播的延迟/丢弃
  home_widget:
    path: third_party/home_widget
  # health 新版要求 json_annotation ^4.12，与旧版 json_serializable 的
  # dev 约束冲突；这里统一到 4.12（生成代码只用 JsonKey/JsonSerializable 注解）
  json_annotation: ^4.12.0

dev_dependencies:
  flutter_test:
    sdk: flutter
  flutter_lints: ^6.0.0
  riverpod_generator: ^2.4.3
  build_runner: ^2.4.12
  json_serializable: ^6.8.0
  json_annotation: ^4.9.0

flutter:
  uses-material-design: true
  assets:
    # iOS 音效走 Flutter asset + AVAudioPlayer（Android 用 res/raw 同一份素材）
    - assets/audio/
    - assets/images/
    - assets/images/drinks/
    - assets/images/characters/
    - assets/images/icons/
    - assets/images/containers/
    - assets/images/tips/
    - assets/icons/menu/

# sqlite3 钩子默认从 GitHub Releases 下载预编译库，当前网络直连超时，
# 改走 gh-proxy 镜像（$RELEASE_TAG/$FILENAME 为占位符，由钩子替换）
hooks:
  user_defines:
    sqlite3:
      url_pattern: https://gh-proxy.com/https://github.com/simolus3/sqlite3.dart/releases/download/$RELEASE_TAG/$FILENAME
