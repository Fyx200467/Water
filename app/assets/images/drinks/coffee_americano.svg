<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 100 100">
  <defs>
    <linearGradient id="lid" x1="0" y1="0" x2="0" y2="1">
      <stop offset="0%" stop-color="#F5F5F5"/>
      <stop offset="100%" stop-color="#C8C8C8"/>
    </linearGradient>
    <linearGradient id="cup" x1="0" y1="0" x2="1" y2="0">
      <stop offset="0%" stop-color="#5D3527"/>
      <stop offset="45%" stop-color="#7A4A38"/>
      <stop offset="100%" stop-color="#4A2818"/>
    </linearGradient>
  </defs>
  <!-- 杯盖圆顶 -->
  <path d="M24 26 Q50 10 76 26 L76 32 L24 32 Z" fill="url(#lid)"/>
  <!-- 盖顶饮水口 -->
  <ellipse cx="50" cy="22" rx="8" ry="2.5" fill="#A8A8A8"/>
  <!-- 两侧卡扣 -->
  <rect x="18" y="29" width="8" height="6" rx="2" fill="#E0E0E0"/>
  <rect x="74" y="29" width="8" height="6" rx="2" fill="#E0E0E0"/>
  <!-- 杯身 -->
  <path d="M26 33 L74 33 L72 86 Q72 90 68 90 L32 90 Q28 90 28 86 Z" fill="url(#cup)"/>
  <!-- 咖啡豆图标 -->
  <g transform="translate(50 58)">
    <ellipse cx="-5" cy="0" rx="5" ry="8" fill="#F5E6D3" transform="rotate(-25)"/>
    <ellipse cx="5" cy="0" rx="5" ry="8" fill="#F5E6D3" transform="rotate(25)"/>
    <path d="M-5 -7 Q-3 0 -5 7" stroke="#6B3E2E" stroke-width="1.5" fill="none" transform="rotate(-25)"/>
    <path d="M5 -7 Q3 0 5 7" stroke="#6B3E2E" stroke-width="1.5" fill="none" transform="rotate(25)"/>
  </g>
</svg>
