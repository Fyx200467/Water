name: migrate-data
on:
  workflow_dispatch:
  push:
    tags:
      - 'migrate-*'

jobs:
  migrate:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - name: Restore database and assets
        run: |
          set -e
          mkdir -p /opt/heshuiyangcheng/data /opt/heshuiyangcheng/assets
          cp _migrate/water_20261104.db /opt/heshuiyangcheng/data/water.db
          tar -xzf _migrate/assets_20261104.tar.gz -C /opt/heshuiyangcheng/assets --strip-components=1
          ls -lh /opt/heshuiyangcheng/data/water.db
          test "$(stat -c%s /opt/heshuiyangcheng/data/water.db)" -gt 100000
      - name: Restart container
        run: docker restart heshuiyangcheng-backend
      - name: Health check
        run: |
          for i in $(seq 1 10); do
            if docker exec heshuiyangcheng-backend node -e "fetch('http://127.0.0.1:3000/health').then(r=>{if(!r.ok)process.exit(1);return r.text()}).then(t=>console.log(t)).catch(()=>process.exit(1))"; then
              exit 0
            fi
            sleep 3
          done
          docker logs --tail 50 heshuiyangcheng-backend
          exit 1
